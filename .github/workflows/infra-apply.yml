# Shared resources affect prod: always explicit, protected, serialized.
name: infra-apply
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protections:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify main-only dispatch and live environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/environments/infra" > "$RUNNER_TEMP/environment.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/infra/deployment-branch-policies" > "$RUNNER_TEMP/branch-policies.json"
          python3 scripts/check-deploy-environment.py infra "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/branch-policies.json"
  validate:
    uses: ./.github/workflows/infra-check.yml
  apply:
    needs: [protections, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: infra
    concurrency:
      group: azure-infra-shared
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize shared state and apply reviewed configuration
        env:
          STATE_ACCOUNT: ${{ vars.TF_STATE_ACCOUNT }}
          TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f pilot.auto.tfvars.json plan.tfplan' EXIT
          printf '%s' "$TF_VARS_JSON" > pilot.auto.tfvars.json
          terraform init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config=container_name=tfstate \
            -backend-config=key=pilot.tfstate \
            -backend-config=use_azuread_auth=true -backend-config=use_oidc=true
          terraform plan -input=false -out=plan.tfplan
          terraform apply -input=false plan.tfplan
