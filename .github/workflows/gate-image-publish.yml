name: Publish tested gate image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kuhlman-labs/fishhawk-gate

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: publish-gate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: gate-image-amd64
          path: ${{ runner.temp }}/gate-images
      - uses: actions/download-artifact@v8
        with:
          name: gate-image-arm64
          path: ${{ runner.temp }}/gate-images
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and assemble their manifest
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/gate-images/gate-$arch.tar"
            tag="$IMAGE:$GITHUB_SHA-$arch"
            docker tag "fishhawk-gate:ci-$arch" "$tag"
            docker push "$tag"
            ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$ref" == "$IMAGE@sha256:"* ]]
            refs+=("$ref")
          done
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "${refs[@]}"
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$GITHUB_SHA"
            scripts/check-gate-image --image "$IMAGE:$GITHUB_SHA" --platform "linux/$arch"
          done
      - name: Promote only while this commit is main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::notice::A newer main exists; keeping only the immutable image tag."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:$GITHUB_SHA"
