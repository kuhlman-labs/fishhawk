# CLI release workflow (E74.1 / #3716).
#
# Triggered by a tag push matching `cli/v*`. The CLI is the non-root Go
# module at `cli/`, so `cli/vX.Y.Z` is the tag Go's module system itself
# resolves for it (the same path-prefixed convention as `runner/v*` and
# `backend/v*`). The workflow:
#
#  1. Re-runs lint + tests at the tag's commit (catches a tag pushed
#     from a dirty branch).
#  2. Builds `fishhawk` for four platforms (darwin-arm64, darwin-amd64,
#     linux-amd64, linux-arm64), stamping Version + GitSHA through
#     `scripts/release-ldflags` (#4117), the one stamping source shared
#     with `scripts/dev` and the other release workflows. CGO disabled:
#     the module links no cgo package, and a static binary works against
#     any libc.
#  3. Checks the linux-amd64 binary's `fishhawk version` reports the tag
#     and commit, so a wrong `-X` package path (a silent no-op in the Go
#     linker) fails the release instead of shipping a `dev` binary.
#  4. Generates an SPDX-JSON SBOM of the cli module.
#  5. Computes SHA-256 checksums of every release artifact.
#  6. Signs the SHA256SUMS file with cosign (keyless / OIDC).
#  7. Publishes a GitHub Release with the artifacts attached.
#
# Versioning convention: `cli/vX.Y.Z`. A tag with a prerelease suffix
# (e.g. `cli/v0.1.0-rc.1`) publishes a GitHub pre-release.

name: CLI Release

on:
  push:
    tags:
      - 'cli/v*'

permissions:
  contents: write   # create release + upload assets
  id-token: write   # cosign keyless signing via GitHub OIDC

jobs:
  release:
    name: Build, sign, and publish CLI release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag (final or -rc.N only)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A published release locks its tag (immutable releases), so the
          # tag must read unambiguously: a final release or a release
          # candidate. -alpha, -beta and any other suffix are refused.
          if ! printf '%s\n' "$TAG" | grep -Eq '^(backend|runner|mcp|cli)/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::release tag '$TAG' must be <component>/vX.Y.Z or <component>/vX.Y.Z-rc.N (no -alpha, -beta or other suffix)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so release-notes generation works.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install golangci-lint
        run: |
          # Pin install.sh to the v2.8.0 tag, NOT master: the master script
          # is unpinned and an upstream change to it broke CI (exit 1 right
          # after resolving v2.8.0) with no change on our side. The tagged
          # script matches the version it installs and is reproducible.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.8.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0

      - name: Verify the tagged commit passes lint + tests
        run: |
          set -eu
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"
          (
            cd cli
            "$GOLANGCI_LINT" run ./...
            go build ./...
            go test -race ./...
          )

      - name: Compute version and build binaries
        id: build
        run: |
          set -eu
          # refs/tags/cli/v0.1.0 → v0.1.0
          version="${GITHUB_REF#refs/tags/cli/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # One stamping source (#4117). Fail closed if it is absent rather
          # than ship an unstamped `dev` binary.
          if [ ! -x scripts/release-ldflags ]; then
            echo "::error::scripts/release-ldflags is missing at this commit; it lands with #4117" >&2
            exit 1
          fi
          stamp="$(scripts/release-ldflags fishhawk "${version}" "${GITHUB_SHA}")"
          mkdir -p dist
          # Operator-facing targets:
          #   darwin-arm64 / amd64 — most dev machines run macOS.
          #   linux-amd64 / arm64 — server installs and CI hosts.
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            out="dist/fishhawk-${version}-${target}"
            (
              cd cli
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
                -ldflags="-s -w ${stamp}" \
                -o "../${out}" \
                ./cmd/fishhawk
            )
            echo "built ${out}"
          done
          # The runner is linux-amd64, so only that binary can execute
          # here. `fishhawk version` prints "<version> (<git-sha>)" today;
          # the check asks only that both values appear.
          got="$("dist/fishhawk-${version}-linux-amd64" version)"
          echo "fishhawk version: ${got}"
          case "${got}" in
            *"${version}"*"${GITHUB_SHA}"*) ;;
            *)
              echo "::error::fishhawk version reported '${got}', want ${version} and ${GITHUB_SHA}; the -ldflags stamp did not take effect" >&2
              exit 1
              ;;
          esac

      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./cli
          format: spdx-json
          output-file: ./dist/cli-${{ steps.build.outputs.version }}.sbom.spdx.json

      - name: Compute checksums
        run: |
          set -eu
          cd dist
          # `./*` keeps shellcheck happy: filenames starting with `-`
          # would otherwise be interpreted as flags.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          set -eu
          cd dist
          # Verify downstream with:
          #
          #   cosign verify-blob \
          #     --certificate-identity-regexp 'https://github.com/kuhlman-labs/fishhawk/\.github/workflows/cli-release\.yml@.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --signature SHA256SUMS.sig \
          #     --certificate SHA256SUMS.pem \
          #     SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CLI ${{ steps.build.outputs.version }}
          generate_release_notes: true
          body_path: .github/release-notes/cli.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/fishhawk-${{ steps.build.outputs.version }}-darwin-arm64
            dist/fishhawk-${{ steps.build.outputs.version }}-darwin-amd64
            dist/fishhawk-${{ steps.build.outputs.version }}-linux-amd64
            dist/fishhawk-${{ steps.build.outputs.version }}-linux-arm64
            dist/cli-${{ steps.build.outputs.version }}.sbom.spdx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
