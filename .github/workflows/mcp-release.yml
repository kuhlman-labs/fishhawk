# MCP server release workflow (E19.7 / #347).
#
# Triggered by a tag push matching `mcp/v*` (path-prefixed module
# tag, same convention as runner / backend / verifier releases).
# The workflow:
#
#  1. Re-runs lint + tests at the tag's commit (catches a tag
#     pushed from a dirty branch).
#  2. Builds `fishhawk-mcp` and `fishhawk-mcp-shim` (ADR-060, the
#     hot-swapping wrapper a local install registers, #4134) for four
#     platforms via a single Go loop (darwin-arm64, darwin-amd64,
#     linux-amd64, linux-arm64). The shim versions with its child, so
#     it rides the `mcp/v*` tag.
#     CGO disabled so the binary is statically linked and works
#     across libc variants. Version + GitSHA are stamped through
#     `scripts/release-ldflags` (#4117), the one stamping source
#     shared with `scripts/dev` and the other release workflows.
#  3. Generates an SPDX-JSON SBOM of the backend module (the MCP
#     binary lives under `backend/cmd/fishhawk-mcp/`, so the SBOM
#     covers the whole module's dependency tree — including the
#     MCP SDK pulled in by E19.2).
#  4. Computes SHA-256 checksums of every release artifact.
#  5. Signs the SHA256SUMS file with cosign (keyless / OIDC).
#  6. Publishes a GitHub Release with the artifacts attached.
#
# Versioning convention: `mcp/vX.Y.Z`. Go's module system doesn't
# strictly require a path-prefixed tag for `backend/cmd/fishhawk-
# mcp/` because it's a sub-package, not its own module — but using
# the same prefix shape as the other releases keeps the operator
# mental model uniform.

name: MCP Release

on:
  push:
    tags:
      - 'mcp/v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and publish MCP release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Validate release tag (final or -rc.N only)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A published release locks its tag (immutable releases), so the
          # tag must read unambiguously: a final release or a release
          # candidate. -alpha, -beta and any other suffix are refused.
          if ! printf '%s\n' "$TAG" | grep -Eq '^(backend|runner|mcp|cli)/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::release tag '$TAG' must be <component>/vX.Y.Z or <component>/vX.Y.Z-rc.N (no -alpha, -beta or other suffix)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so release-notes generation works.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Install golangci-lint
        run: |
          # Pin install.sh to the v2.12.2 tag, NOT master: the master script
          # is unpinned and an upstream change to it broke CI (exit 1 right
          # after resolving v2.12.2) with no change on our side. The tagged
          # script matches the version it installs and is reproducible.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Verify the tagged commit passes lint + tests
        run: |
          set -eu
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"
          (
            cd backend
            "$GOLANGCI_LINT" run ./...
            go build ./...
            ../scripts/test single -p 4 -timeout 20m ./backend/...
          )

      - name: Compute version and build binaries
        id: build
        run: |
          set -eu
          # refs/tags/mcp/v0.1.0 → v0.1.0
          version="${GITHUB_REF#refs/tags/mcp/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # One stamping source (#4117). Fail closed if it is absent rather
          # than ship an unstamped `dev` binary.
          if [ ! -x scripts/release-ldflags ]; then
            echo "::error::scripts/release-ldflags is missing at this commit; it lands with #4117" >&2
            exit 1
          fi
          stamp="$(scripts/release-ldflags fishhawk-mcp "${version}" "${GITHUB_SHA}")"
          shim_stamp="$(scripts/release-ldflags fishhawk-mcp-shim "${version}" "${GITHUB_SHA}")"
          mkdir -p dist
          # Operator-facing targets:
          #   darwin-arm64 / amd64 — most dev machines run macOS.
          #   linux-amd64 / arm64 — server installs + the runner
          #   container image.
          # CGO disabled so the static binary works against any libc.
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            out="dist/fishhawk-mcp-${version}-${target}"
            (
              cd backend
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
                -ldflags="-s -w ${stamp}" \
                -o "../${out}" \
                ./cmd/fishhawk-mcp
            )
            echo "built ${out}"
            shim_out="dist/fishhawk-mcp-shim-${version}-${target}"
            (
              cd backend
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
                -ldflags="-s -w ${shim_stamp}" \
                -o "../${shim_out}" \
                ./cmd/fishhawk-mcp-shim
            )
            echo "built ${shim_out}"
          done
          # No sanity-check exec on the server binary: it has no
          # --help flag and would block on stdin waiting for an MCP
          # handshake. The shim's --version spawns no child and reads
          # no stdin, so the linux-amd64 shim is checked to carry the
          # tag and the full commit, not `dev`.
          shim_version="$("dist/fishhawk-mcp-shim-${version}-linux-amd64" --version)"
          echo "fishhawk-mcp-shim --version: ${shim_version}"
          case "${shim_version}" in
            "${version} (${GITHUB_SHA})") ;;
            *) echo "::error::fishhawk-mcp-shim reports '${shim_version}', want '${version} (${GITHUB_SHA})'" >&2; exit 1 ;;
          esac

      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: spdx-json
          upload-release-assets: false
          output-file: ./dist/mcp-${{ steps.build.outputs.version }}.sbom.spdx.json

      - name: Compute checksums
        run: |
          set -eu
          cd dist
          # `./*` keeps shellcheck happy: filenames starting with `-`
          # would otherwise be interpreted as flags.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish mcp release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: mcp-release-files
          path: dist
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          set -eu
          cd dist
          # Verify downstream with:
          #
          #   cosign verify-blob \
          #     --certificate-identity-regexp 'https://github.com/kuhlman-labs/fishhawk/.+' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --signature SHA256SUMS.sig \
          #     --certificate SHA256SUMS.pem \
          #     SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MCP ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body_path: .github/release-notes/mcp.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/fishhawk-mcp-${{ needs.build.outputs.version }}-darwin-arm64
            dist/fishhawk-mcp-${{ needs.build.outputs.version }}-darwin-amd64
            dist/fishhawk-mcp-${{ needs.build.outputs.version }}-linux-amd64
            dist/fishhawk-mcp-${{ needs.build.outputs.version }}-linux-arm64
            dist/fishhawk-mcp-shim-${{ needs.build.outputs.version }}-darwin-arm64
            dist/fishhawk-mcp-shim-${{ needs.build.outputs.version }}-darwin-amd64
            dist/fishhawk-mcp-shim-${{ needs.build.outputs.version }}-linux-amd64
            dist/fishhawk-mcp-shim-${{ needs.build.outputs.version }}-linux-arm64
            dist/mcp-${{ needs.build.outputs.version }}.sbom.spdx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
