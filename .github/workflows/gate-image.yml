name: gate-image

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kuhlman-labs/fishhawk-gate

jobs:
  pins:
    name: Gate image pins (static)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-gate-image

  build:
    name: Gate image build (${{ matrix.arch }})
    needs: pins
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build once and export the image to validate
        uses: docker/build-push-action@v7
        with:
          context: deploy/gate-image
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/gate-${{ matrix.arch }}.tar
          provenance: false
          tags: fishhawk-gate:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=gate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gate-${{ matrix.arch }}
      - name: Load the exported image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker load --input "$RUNNER_TEMP/gate-$ARCH.tar"
      - name: Dynamic pin check
        run: scripts/check-gate-image --image fishhawk-gate:ci-${{ matrix.arch }} --platform linux/${{ matrix.arch }}
      - name: Lint parity
        if: matrix.arch == 'amd64'
        env:
          FISHHAWK_TEST_GATE_IMAGE: fishhawk-gate:ci-amd64
        run: scripts/test lint --in-gate-image
      # PRs never publish images or hand artifacts to a privileged workflow.
      # The publisher is a downstream job of this SAME main-push CI run.
      - name: Retain the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: gate-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/gate-${{ matrix.arch }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  published-drift:
    name: Published main drift (${{ matrix.platform }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - run: docker pull --platform ${{ matrix.platform }} "$IMAGE:main"
      - run: scripts/check-gate-image --image "$IMAGE:main" --platform ${{ matrix.platform }}
