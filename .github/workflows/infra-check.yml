name: infra-check
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fmt-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - name: Terraform syntax, provider schemas, and hosted contracts
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          for root in infra/terraform infra/terraform/bootstrap; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          python3 -m venv "$RUNNER_TEMP/hosting-tools"
          "$RUNNER_TEMP/hosting-tools/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/hosting-tools/bin/python" deploy/azure/test_hosting.py
