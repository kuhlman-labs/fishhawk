name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR updates supersede older checks. Main pushes must each be evaluated:
  # a shared latest-pending slot can discard a code push before a docs push.
  # Publishers have their own serialization below.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      openapi: ${{ steps.filter.outputs.openapi }}
      docker: ${{ steps.filter.outputs.docker }}
      site: ${{ steps.filter.outputs.site }}
      helm: ${{ steps.filter.outputs.helm }}
      infra: ${{ steps.filter.outputs.infra }}
      gate-image: ${{ steps.filter.outputs.gate-image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              # Include embedded schemas, migrations, fixtures and module-local
              # assets, not only Go source. Unknown module additions widen via go.work.
              - 'backend/**'
              - 'runner/**'
              - 'cli/**'
              - 'verifier/**'
              - 'directory/**'
              - 'pricing/**'
              - 'redaction/**'
              - 'credstore/**'
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '**/testdata/**'
              - 'testdata/**'
              - 'go.work*'
              - '.golangci.yml'
              - '.fishhawk/**'
              - 'docs/spec/**'
              - 'docs/api/**'
              - 'docs/adr/**'
              - 'docs/review/**'
              - 'scripts/**'
              - '.github/workflows/**'
            ts:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            openapi:
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            docker:
              # All workspace source copied by backend/Dockerfile.
              - 'backend/**'
              - 'runner/**'
              - 'cli/**'
              - 'verifier/**'
              - 'directory/**'
              - 'pricing/**'
              - 'redaction/**'
              - 'credstore/**'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work*'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/backend-build.yml'
              - 'scripts/ci-image-current'
            site:
              - 'site/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'
            helm:
              - 'deploy/helm/**'
              - 'scripts/test-helm-render'
              - '.github/workflows/ci.yml'
              - '.github/workflows/helm-render.yml'
            infra:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/infra-*.yml'
            gate-image:
              # Static pin validation runs on EVERY change in repository-checks.
              # Rebuild only when the image, its validation or its publisher changes.
              - 'deploy/gate-image/**'
              - 'scripts/ci-image-current'
              - 'scripts/check-gate-image'
              - 'scripts/test'
              - '.github/workflows/ci.yml'
              - '.github/workflows/gate-image*.yml'

  # Always run the repository gate, including non-Go-only changes. The Go
  # test matrix remains path-filtered; verify --no-tests never reruns it.
  repository-checks:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # The workspace declares `go 1.26` (#3787: golang-migrate 4.20 and
          # x/mod / x/tools need it), so the runner's toolchain floats on the
          # 1.26 line. The exact patch pin is deploy/gate-image's GO_VERSION.
          go-version: '1.26'
          cache: true
          # There is no root go.mod (multi-module go.work), and setup-go's
          # default dependency file is ./go.mod — so without this every run
          # logged "Restore cache failed: Dependencies file is not found" and
          # started cold (#3882).
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint
        run: |
          # golangci-lint must be built with a Go at least as new as the
          # workspace: v2.8.0 (go1.25) panics on a go 1.26 workspace with
          # "package requires newer Go version go1.26" (#3787). v2.12.2 is
          # built with go1.26.2; v2.13+ is built with go1.27, whose gofmt
          # disagrees with go1.26's.
          #
          # Pin install.sh to the v2.12.2 tag, NOT master: the master script
          # is unpinned and an upstream change to it broke CI (exit 1 right
          # after resolving v2.12.2) with no change on our side. The tagged
          # script matches the version it installs and is reproducible.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      # golangci-lint keeps an incremental analysis cache at
      # ~/.cache/golangci-lint that setup-go's cache does NOT cover. Restoring
      # it across runs lets golangci re-lint only changed packages instead of
      # the whole workspace cold. The key rotates per-commit (so every run
      # writes back the latest cache) while restore-keys fall back to the most
      # recent prior cache for the same .golangci.yml; a config change drops to
      # the OS-level fallback and rebuilds. Keyed off .golangci.yml only (not
      # **/*.go) so an ordinary code change reuses the warm cache rather than
      # thrashing the exact key on every push.
      - name: Cache golangci-lint analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}-
            golangci-${{ runner.os }}-

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - name: Verify repository contracts and gate harnesses
        run: scripts/test verify --no-tests
      - name: Check recorded review-prompt evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-review-prompt-eval --base "$BASE_SHA"
      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        # v1.7.12 predates GitHub's queue:max. Ignore only that diagnostic;
        # test-ci-workflows.py validates the queue values and cancellation pair.
        run: >-
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color
          -ignore '^unexpected key "queue" for "concurrency" section\.'
      - name: Install workflow test parser
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/pip" install PyYAML==6.0.3
      - name: Test CI workflow contracts
        run: '"$RUNNER_TEMP/ci-tools/bin/python" scripts/test-ci-workflows.py'

  # Test legs (#3882). scripts/ci-test-leg owns the partition: every package
  # of every go.work module lands in exactly one leg by construction (new
  # packages and modules need no edit), runner/cmd/fishhawk-runner is split
  # across two legs by `-run ^TestRun` / `-skip ^TestRun`, and every leg runs
  # in scripts/test's environment (sourced lib-only) — the
  # TESTCONTAINERS_RYUK_DISABLED / GIT_CONFIG_* pins and the
  # fishhawk-test-postgres lease + reap that #1413 routed CI through
  # scripts/test for. The `leg` list below must match
  # `scripts/ci-test-leg --list`; go-coverage fails if a leg's profiles are
  # missing, so a leg added to the script but not here cannot drop silently.
  go-test:
    name: Go (test ${{ matrix.leg }})
    needs: detect
    if: ${{ needs.detect.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [backend-mcp, backend-server, backend-storage, backend-rest, runner-main-a, runner-main-b, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Cached explicitly below, per leg: each leg compiles a different
          # package set, so one shared setup-go key would save only whichever
          # leg finished first.
          cache: false

      # Module + build cache per leg, keyed on go.sum. The race/cover build of
      # third-party deps (pgx, the AWS SDK, testcontainers, ...) is the bulk
      # of a cold compile and only changes with go.sum; our own packages
      # recompile from source either way. Saved once per (leg, go.sum).
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-1.26-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-test-${{ runner.os }}-1.26-${{ matrix.leg }}-

      # Download EVERY go.work module's dependencies, not just the ones this
      # leg compiles. basedelta's TestGoListLoader_RealRepository runs `go list`
      # over the whole workspace under GOPROXY=off, so on a go.sum change the
      # restore-keys fallback (one leg's older cache) lacks another module's
      # new versions and the test fails with "module lookup disabled by
      # GOPROXY=off" (#3787: the runner's x/mod, x/tools, x/sys bumps failed
      # the backend-rest leg). A no-op on a warm cache.
      - name: Download workspace modules
        run: go mod download

      - name: Test leg ${{ matrix.leg }}
        run: scripts/ci-test-leg "${{ matrix.leg }}" coverage-profiles

      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.leg }}
          path: coverage-profiles/*.out
          if-no-files-found: error
          retention-days: 1

  # Merge every leg's profiles and apply the aggregate gate (≥ 80%, excl.
  # sqlc-generated `/db/` packages — identical to the old
  # `scripts/test coverage`). check-coverage.py merges blocks that recur
  # across profiles (#3881), so the two fishhawk-runner halves count each
  # statement once. Targets: ARCHITECTURE §9.
  go-coverage:
    name: Go (coverage gate)
    needs: [detect, go-test]
    if: ${{ needs.detect.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      # The partition proof: every package of every go.work module is tested
      # by exactly one leg (or by the -run/-skip complement pair). It runs
      # here, against the same tree, so the gate below is only trusted when
      # the legs it merges provably covered everything.
      - name: Check the leg partition
        run: scripts/ci-test-leg --check-partition

      - uses: actions/download-artifact@v8
        with:
          pattern: go-coverage-*
          path: coverage-profiles

      - name: Every leg delivered profiles
        run: |
          missing=0
          for leg in $(scripts/ci-test-leg --list); do
            if ! ls coverage-profiles/go-coverage-"$leg"/*.out >/dev/null 2>&1; then
              echo "::error::No coverage profiles from leg $leg — is it missing from the go-test matrix?"
              missing=1
            fi
          done
          exit "$missing"

      - name: Coverage threshold (≥ 80% aggregate, excl. sqlc-generated)
        run: python3 scripts/check-coverage.py --threshold 80 --exclude '/db/' coverage-profiles/*/*.out

  ts:
    name: TypeScript (lint + build + test)
    needs: detect
    if: ${{ needs.detect.outputs.ts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # pnpm version is pinned via `packageManager` in frontend/package.json;
      # action-setup defaults to reading the *root* package.json, so we
      # point it at frontend/ explicitly. Without this it errors out
      # with "No pnpm version is specified."
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  openapi:
    name: OpenAPI (lint)
    needs: detect
    if: ${{ needs.detect.outputs.openapi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Lint OpenAPI spec
        run: |
          # Pin to a concrete published version, NOT @latest: a floating
          # ref lets an upstream release red-line CI with no change on our
          # side. Bump deliberately. See #607/#608.
          npx -y @redocly/cli@2.31.5 lint \
            --config docs/api/redocly.yaml \
            docs/api/v0.openapi.yaml

  docker-build:
    name: Docker build (fishhawkd image, no push)
    needs: detect
    if: ${{ needs.detect.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build-only validation of the release build context. This mirrors
      # backend-build.yml's build step but with push/sign/sbom stripped:
      # no registry login, no credentials, no publish — the point is to
      # fail a PR when the go.work workspace no longer resolves inside the
      # container (the #733 class), not to produce an artifact. Reads the
      # release job's warm cache (scope=backend-build) for speed but writes
      # its own scope so a PR can never poison the published image's cache.
      - name: Build fishhawkd image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-build
          cache-to: type=gha,mode=max,scope=ci-docker-build
          provenance: false
          sbom: false

  site:
    name: Documentation site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  helm:
    needs: detect
    if: needs.detect.outputs.helm == 'true'
    uses: ./.github/workflows/helm-render.yml

  infra:
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    uses: ./.github/workflows/infra-check.yml

  gate-image:
    needs: detect
    if: needs.detect.outputs.gate-image == 'true'
    uses: ./.github/workflows/gate-image.yml

  # Rollup gate. The repo ruleset requires only this job; it inherits
  # the result of every job listed in `needs`. Add new jobs to that
  # list and they automatically become part of the gate without
  # touching the ruleset.
  ci-pass:
    name: CI Pass
    needs: [detect, repository-checks, go-test, go-coverage, ts, openapi, docker-build, site, helm, infra, gate-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify required jobs
        run: |
          # Skipped jobs (e.g. the TS job when no TS files changed)
          # are NOT failures. Cancellations are.
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs was cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped)."

  publish-backend:
    needs: [detect, ci-pass]
    if: >-
      always() && needs.ci-pass.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/backend-build.yml

  publish-gate:
    needs: [detect, ci-pass]
    if: >-
      always() && needs.ci-pass.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.gate-image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gate-image-publish.yml
