# fishhawkd release workflow (E13.3 / #60).
#
# Triggered by a tag push matching `backend/v*` (mirrors the
# runner module-tag convention from E5.7). The workflow:
#
#  1. Re-runs lint + tests at the tag's commit (catches a tag
#     pushed from a dirty branch).
#  2. Builds the multi-stage Dockerfile with -ldflags=-X stamping
#     the tag version into internal/version.Version.
#  3. Pushes ghcr.io/kuhlman-labs/fishhawkd:vX.Y.Z + :latest.
#  4. Signs the resulting image digest with cosign keyless.
#  5. Generates an SPDX-JSON SBOM as a downloadable artifact.
#  6. Publishes a GitHub Release with the SBOM + image-digest
#     reference, plus the standalone `fishhawkd` binaries below.
#
# Standalone binaries (#3716): the `binaries` job builds `fishhawkd`
# for darwin-arm64/amd64 and linux-amd64/arm64, stamped through
# `scripts/release-ldflags` (#4117), checksums them into SHA256SUMS and
# signs that with cosign keyless. It runs BEFORE the image job and
# hands its files over as a workflow artifact, because this repository
# has immutable releases enabled: GitHub accepts asset uploads only
# before a release is published, so every asset must go out in the one
# `action-gh-release` call that creates it. Nothing is published unless
# the image job's lint + test re-run passes.
#
# Versioning convention: `backend/vX.Y.Z`. Path-prefixed tags are
# the Go-module convention for non-root modules in a monorepo.

name: Backend Release

on:
  push:
    tags:
      - 'backend/v*'

permissions:
  contents: write    # create release + upload assets
  packages: write    # push to ghcr.io
  id-token: write    # cosign keyless signing via GitHub OIDC

jobs:
  binaries:
    name: Build and sign fishhawkd binaries
    runs-on: ubuntu-latest
    # Narrower than the workflow default: this job pushes no image and
    # creates no release.
    permissions:
      contents: read
      id-token: write   # cosign keyless signing via GitHub OIDC
    steps:
      - name: Validate release tag (final or -rc.N only)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A published release locks its tag (immutable releases), so the
          # tag must read unambiguously: a final release or a release
          # candidate. -alpha, -beta and any other suffix are refused.
          if ! printf '%s\n' "$TAG" | grep -Eq '^(backend|runner|mcp|cli)/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::release tag '$TAG' must be <component>/vX.Y.Z or <component>/vX.Y.Z-rc.N (no -alpha, -beta or other suffix)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Compute version and build binaries
        run: |
          set -eu
          # refs/tags/backend/v0.1.0 → v0.1.0
          version="${GITHUB_REF#refs/tags/backend/}"
          # One stamping source (#4117). Fail closed if it is absent rather
          # than ship an unstamped `dev` binary.
          if [ ! -x scripts/release-ldflags ]; then
            echo "::error::scripts/release-ldflags is missing at this commit; it lands with #4117" >&2
            exit 1
          fi
          stamp="$(scripts/release-ldflags fishhawkd "${version}" "${GITHUB_SHA}")"
          mkdir -p dist
          # CGO disabled, as in backend/Dockerfile, so the static binary
          # works against any libc.
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            out="dist/fishhawkd-${version}-${target}"
            (
              cd backend
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
                -ldflags="-s -w ${stamp}" \
                -o "../${out}" \
                ./cmd/fishhawkd
            )
            echo "built ${out}"
          done
          # No exec check: fishhawkd reports its version through /healthz,
          # which needs a database to serve. #4117's per-binary test pins
          # the stamp's package path.

      - name: Compute checksums
        run: |
          set -eu
          cd dist
          # `./*` keeps shellcheck happy: filenames starting with `-`
          # would otherwise be interpreted as flags. Covers the binaries;
          # the image SBOM is produced later, by the image job.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          set -eu
          cd dist
          # Verify downstream with:
          #
          #   cosign verify-blob \
          #     --certificate-identity-regexp 'https://github.com/kuhlman-labs/fishhawk/\.github/workflows/backend-release\.yml@.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --signature SHA256SUMS.sig \
          #     --certificate SHA256SUMS.pem \
          #     SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Hand the binaries to the release job
        uses: actions/upload-artifact@v7
        with:
          name: fishhawkd-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build, sign, and publish fishhawkd release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag (final or -rc.N only)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A published release locks its tag (immutable releases), so the
          # tag must read unambiguously: a final release or a release
          # candidate. -alpha, -beta and any other suffix are refused.
          if ! printf '%s\n' "$TAG" | grep -Eq '^(backend|runner|mcp|cli)/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::release tag '$TAG' must be <component>/vX.Y.Z or <component>/vX.Y.Z-rc.N (no -alpha, -beta or other suffix)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install golangci-lint
        run: |
          # Pin install.sh to the v2.8.0 tag, NOT master: the master script
          # is unpinned and an upstream change to it broke CI (exit 1 right
          # after resolving v2.8.0) with no change on our side. The tagged
          # script matches the version it installs and is reproducible.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.8.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0

      - name: Verify the tagged commit passes lint + tests
        run: |
          set -eu
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"
          (
            cd backend
            "$GOLANGCI_LINT" run ./...
            go build ./...
            go test -race ./...
          )

      - name: Compute version
        id: ver
        run: |
          set -eu
          # refs/tags/backend/v0.1.0 → v0.1.0
          version="${GITHUB_REF#refs/tags/backend/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kuhlman-labs/fishhawkd
          tags: |
            type=match,pattern=backend/(v.+),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=fishhawkd
            org.opencontainers.image.description=Fishhawk backend control plane.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "ghcr.io/kuhlman-labs/fishhawkd@${DIGEST}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/kuhlman-labs/fishhawkd@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ./fishhawkd-${{ steps.ver.outputs.version }}.sbom.spdx.json

      - name: Fetch the fishhawkd binaries
        uses: actions/download-artifact@v8
        with:
          name: fishhawkd-binaries
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: fishhawkd ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body_path: .github/release-notes/backend.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            ./fishhawkd-${{ steps.ver.outputs.version }}.sbom.spdx.json
            dist/fishhawkd-${{ steps.ver.outputs.version }}-darwin-arm64
            dist/fishhawkd-${{ steps.ver.outputs.version }}-darwin-amd64
            dist/fishhawkd-${{ steps.ver.outputs.version }}-linux-amd64
            dist/fishhawkd-${{ steps.ver.outputs.version }}-linux-arm64
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
