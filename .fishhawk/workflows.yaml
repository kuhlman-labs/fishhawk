# Fishhawk's own development workflow.
#
# Fishhawk is built using Fishhawk: every change to this repository is
# proposed, reviewed and merged through one of the workflows declared
# below. This file is therefore both the live configuration and the
# reference example — if you are reading it to learn the spec, start
# with docs/spec/workflow-v2.md, which is the complete grammar.
#
# The shape of a workflow is: a routing predicate that decides which
# changes it accepts, a delegation policy that decides how much the
# operator agent may do unattended, and an ordered list of stages, each
# of which may declare an executor, reviewers, constraints, a budget and
# gates. A gate is where the run stops and waits for a decision.
#
# The workflows are declared in the order a development cycle runs
# them, so the file reads top to bottom as one turn of the loop:
#
#   backlog_grooming   decide what to build
#   upkeep_scan        find upkeep work: flakes, pin drift, advisories
#   feature_change    build it — plan, implement, verify, approve
#   hotfix_change      the same at emergency cadence, for an incident fix
#   routine_change     the low-risk variant the agent carries alone
#   human_led_change   the variant a human writes and the log records
#   release            record the release and gate its environment deploy
#
# Key order in a YAML mapping carries no meaning to the parser, so this
# ordering is for the reader. Stage order within a workflow is a
# different matter — stages run in the order they are declared, and a
# stage may only consume an artifact from one declared before it.

version: "2"
# Repository review conventions (ADR-068). The security convention lists
# this repository's load-bearing controls, trust boundaries and token model,
# which the generic security remit defers to. It attaches only to a change
# touching the sensitive paths below (the same set the security persona's
# escalations match), so a review elsewhere is byte-identical to one with no
# convention declared. The standard reviewers of a matching change see it too:
# a persona sees exactly the conventions its stage's reviewers see.
review_conventions:
  security_conventions:
    path: docs/review/security-conventions.md
    applies_to:
      paths:
        - "backend/internal/spec/**"
        - "cli/internal/spec/**"
        - "backend/internal/audit/**"
        - "backend/internal/policy/**"
        - "backend/internal/auth/**"
        - "backend/internal/githubapp/**"
        - "verifier/**"
        - "backend/internal/prompt/**"
        - "backend/internal/agentpaths/**"
        - "runner/internal/constraint/**"
        - "runner/internal/agentenv/**"
        - "runner/cmd/fishhawk-runner/gateenv*.go"
        - "credstore/**"
    severity_cap: medium

# Reviewer personas (ADR-084). Each runs as one extra reviewer invocation with
# its own remit, in addition to the stage's standard reviewers and under their
# authority. The model and severity caps match the catch-rate evidence the
# personas were measured under (docs/compliance/planreview-catchrate-evidence.md,
# baseline d624cd36): claude-sonnet-5-5, medium cap.
reviewer_personas:
  # The architect (E78.6 #3757): checks a plan against the in-repo decision
  # record, cites ADRs verbatim, and flags undeclared new architectural
  # direction. Attached statically to feature_change's plan review. Measured
  # at 118/138 catch with 24/138 false alarms — expect roughly one advisory
  # decision_record false alarm in six plans; its cap keeps it at medium.
  architect:
    agent:
      provider: claudecode
      model: claude-sonnet-5-5
      reasoning_effort: high
    remit:
      path: docs/review/architect-remit.md
      severity_cap: medium
    decision_record:
      index: docs/adr/index.json
  # The security persona (E80.5 #3762): a threat-model lens attached by
  # feature_change's escalations to a change touching a sensitive path, at
  # plan and implement review. Measured at 204/204 catch with 1/136 false
  # alarms (7/136 with no repository convention).
  security:
    agent:
      provider: claudecode
      model: claude-sonnet-5-5
      reasoning_effort: high
    remit:
      path: docs/review/security-remit.md
      severity_cap: medium

# The repository's merge-candidate verdict-transfer surface (ADR-124 v2.1): pasted verbatim from
# backend/internal/basedelta/testdata/fishhawk-verdict-transfer.yaml (whose rationale comments it
# keeps). Tier I under ADR-121 (it decides whether a verify pass runs): changing it needs the
# Captain's adoption, recorded on the PR that lands it.
verdict_transfer:
  global_surface:
    - "go.work"  # every Go leg (lint, test loops, release-ldflags builds), `_verify_scope_buckets`, check-gate-image
    - "**/go.mod"  # every Go leg; check-gate-image reads `*/go.mod` go directives
    - "**/go.sum"  # every Go leg (module checksums)
    - "scripts/**"  # every leg and harness is a script here; check-pipefail-grep scans `scripts/*`
    - ".golangci.yml"  # `cmd_lint`
    - "deploy/gate-image/**"  # check-gate-image, test-in-gate-image read the Dockerfile ARG pins
    - ".fishhawk/**"  # the workflow spec read by the product and its spec tests (#4292)
    - "docs/spec/**"  # sync-schemas sources; test-site-reference (docgen) reads the schemas and examples
    - "docs/api/**"  # test-site-reference (docgen) reads `v0.openapi.yaml`
    - "site/**"  # check-site-voice, check-site-ia, test-site-reference rewrites the reference pages
    - "docs/adr/**"  # check-adr
    - "docs/ARCHITECTURE.md"  # `_verify_doc_line_budget`
    - "backend/internal/postgres/migrations/**"  # migration numbering is a whole-tree invariant (#4292)
    - "backend/internal/audit/categories.go"  # the audit-category registry checked against every emitter (#4292)
    - "testdata/**"  # root cross-module parity fixtures read by tests outside the dir (widened from `testdata/wire/**`); test-dev reads `testdata/wire/restart_blockers.json`
    - "deploy/helm/**"  # test-helm-render renders `deploy/helm/fishhawk`
    - "backend/cmd/fishhawkd/**"  # test-helm-render greps fishhawkd's source as data
    - "backend/Dockerfile"  # test-dev checks TARGETARCH and the release-ldflags stanza
    - "Makefile"  # test-dev greps the s3-init target
    - ".github/workflows/**"  # check-gate-image reads go-version and golangci-lint pins
    - "cli/internal/docgen/**"  # test-site-reference regenerates the site reference with it
    - "cli/internal/cmdinfo/**"  # test-site-reference (the CLI page is rendered from cmdinfo)
    - "cli/cmd/fishhawk-docgen/**"  # test-site-reference runs `go run ./cmd/fishhawk-docgen` (C6)
    - "backend/internal/version/**"  # test-release-ldflags and test-dev read `version.go` as data
    - "cli/internal/version/**"  # test-release-ldflags and test-dev read `version.go` as data
    - "runner/internal/version/**"  # test-release-ldflags and test-dev read `version.go` as data
    - "backend/internal/plan/schemas/**"  # sync-schemas mirror
    - "backend/internal/spec/schemas/**"  # sync-schemas mirror
    - "backend/internal/crewmessage/schemas/**"  # sync-schemas mirror
    - "backend/internal/specialistjob/schemas/**"  # sync-schemas mirror
    - "backend/internal/operatorrole/schemas/**"  # sync-schemas mirror
    - "backend/internal/workmgmt/schemas/**"  # sync-schemas mirror
    - "backend/internal/operatorrole/defaults/**"  # sync-schemas mirror
    - "backend/internal/workmgmt/defaults/**"  # sync-schemas mirror
    - "backend/internal/spec/presets/**"  # sync-schemas mirror
    - "cli/internal/spec/schemas/**"  # sync-schemas mirror
    - "cli/internal/spec/presets/**"  # sync-schemas mirror
    - "runner/internal/plan/schemas/**"  # sync-schemas mirror
    - "backend/internal/spec/testdata/predicate-fixtures.json"  # sync-schemas mirror
    - "backend/internal/spec/testdata/review-conventions-fixtures.json"  # sync-schemas mirror
    - "backend/internal/spec/testdata/tier-expansion-fixtures.json"  # sync-schemas mirror
    - "cli/internal/spec/testdata/predicate-fixtures.json"  # sync-schemas mirror
    - "cli/internal/spec/testdata/review-conventions-fixtures.json"  # sync-schemas mirror
    - "cli/internal/spec/testdata/tier-expansion-fixtures.json"  # sync-schemas mirror
    - "backend/internal/server/testdata/acceptance-verdict-fixtures.json"  # sync-schemas mirror
    - "runner/cmd/fishhawk-runner/testdata/acceptance-verdict-fixtures.json"  # sync-schemas mirror
  shared_artifact_dirs:
    - "docs/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - "frontend/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - "infra/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - "acceptance/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - "auth/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - ".github/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - ".agents/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - ".claude/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - ".githooks/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
    - "deploy/"  # non-Go tree whose consumers the import graph cannot see (ADR-096 D1(d))
  doc_check_inputs: []  # the doc paths stay in global_surface until #4317 (ADR-124 Consequences)
  inert_paths:
    - "README.md"  # root README: narrative prose no verify leg reads
    - "**/README.md"  # module and directory READMEs; under a Go package the graph decides first
    - "AGENTS.md"  # agent instruction prose
    - "CLAUDE.md"  # agent instruction prose
    - "CODE_OF_CONDUCT.md"  # community prose
    - "CONTRIBUTING.md"  # community prose
    - "SECURITY.md"  # community prose
    - "LICENSE"  # licence text
    - "NOTICE"  # licence notice
    - ".dockerignore"  # image build context filter; no verify leg reads it
    - ".editorconfig"  # editor settings
    - ".env.example"  # local env template
    - ".gitignore"  # git ignore rules
    - "docker-compose.yml"  # local dev stack; no verify leg reads it
    - "docs/**"  # documentation outside G (G precedence keeps docs/spec, docs/api, docs/adr and ARCHITECTURE.md verdict-wide)
    - "frontend/**"  # Web UI; its CI gates run outside scripts/test verify
    - ".agents/**"  # operator-authored skills
    - ".claude/**"  # operator-authored harness config
    - ".githooks/**"  # opt-in local hooks
    - ".github/**"  # outside workflows/, which G keeps verdict-wide
    - "infra/**"  # terraform; no verify leg reads it
    - "acceptance/**"  # acceptance scenarios; no verify leg reads them
    - "auth/**"  # composite action; no verify leg reads it
    - "deploy/**"  # outside helm and gate-image, which G keeps verdict-wide
    - "backend/sqlc.yaml"  # sqlc config; generated db code is committed
    - "runner/action.yml"  # action metadata; no verify leg reads it
  opaque_paths: []  # nothing here is opaque
  completeness_check: "go test ./backend/internal/basedelta -run 'TestVerifyLegsCoveredByDeclaration|TestSchemaSyncDestinationsCoveredByDeclaration|TestDeclarationKeepsADR096D3Floor|TestThisRepository_EveryTrackedPathClassified'"

workflows:
  # ---------------------------------------------------------------------------
  # backlog_grooming — decide what to build.
  #
  # The cycle starts before any code: what is worth doing next, and in
  # what order? This workflow reads the backlog against a checked-in
  # charter, proposes a ranking, and applies the approved mutations to
  # the tracker. It produces no code at any stage.
  #
  # Nothing here can auto-close an issue, and that is structural rather
  # than a default: `ordering`, `dedup` and `scoping` are registered as
  # non-delegable classes carrying no condition at all, so `mode: auto` on
  # any of them is refused when this file is parsed. Widening one is not a
  # configuration edit, it is a grammar change.
  #
  # The charter is mandatory. Starting a run on this workflow in a
  # repository whose work-management conventions declare no charter is
  # refused before any run exists. The charter is what every proposed
  # ranking must cite, and it is what keeps the approval gate from
  # degrading into a rubber stamp.
  #
  # No ordinary issue run can select this workflow: its routing predicate
  # is the non-diff trigger form, and every issue and webhook trigger
  # normalizes to `diff`. That is a safety property rather than a gap. Runs
  # come from the scheduler (`scheduled`) or an operator- or event-started
  # non-diff run (`on_demand`).
  #
  # SCHEDULE. Weekly, Tuesday 09:00 UTC, the day after upkeep_scan, so the
  # two scheduled runs never share a window. Every scheduled run is
  # anchored to #3112, the standing grooming anchor issue, which feeds the
  # groom stage's required issue input. The schedule starts runs only when
  # fishhawkd runs with --enable-scheduler and this repository in
  # --scheduler-repos (scripts/dev passes both, with --scheduler-runner-kind
  # local). A local scheduled run parks at awaiting_host_dispatch until a
  # host dispatches its groom stage, so it spends nothing until then, and
  # it still stops at the approval gate below: nothing is mutated until a
  # human approves the report. The first tick after the scheduler sees this
  # declaration starts one run for the most recent Tuesday window; there is
  # never a backfill.
  #
  # No gate in this workflow declares an `sla`. A missed SLA FAILS the run
  # (category D), so with one eligible approver a gate left over a weekend
  # would fail instead of waiting. The SLA timer is also off on this
  # deployment, so an `sla` here would state a deadline nothing enforces.
  # ---------------------------------------------------------------------------
  backlog_grooming:
    description: >-
      Propose a backlog grooming report against the checked-in charter, gate it on a human approval, then apply the approved mutations. Produces no code diff at any stage.
    auto_advance: true

    applies_to:
      trigger: [scheduled, on_demand]

    schedule:
      cron: "0 9 * * 2"
      issue: 3112

    # The five run-driving classes: nothing delegated.
    autonomy: low

    # The four grooming classes, a disjoint set from the tier above.
    # `hygiene` is the only one that may act unattended, and only because
    # its mutations are objective and reversible — a missing label, an
    # absent parent link, a stale status. The other three change what work
    # exists or in what order it happens, and cannot be widened here.
    actions:
      hygiene:
        mode: auto
        when: objective_reversible
      ordering:
        mode: gated
      dedup:
        mode: gated
      scoping:
        mode: report

    stages:
      # Propose. This stage emits a grooming report, not a plan. Every
      # ordering entry must cite a charter rubric line by id or the artifact
      # fails validation — that citation requirement is what makes the gate
      # below reviewable.
      #
      # The approval gate on this stage is also the apply trigger: approving
      # it executes the report's hygiene-class mutations and audits each
      # one. Approving is a write, not a filing decision — read the report
      # before approving it.
      - id: groom
        type: plan
        executor:
          agent: claude-code
          # A long ranking pass over a few hundred items. `high` rather than
          # `xhigh` keeps the pass well inside the 45m cap below.
          reasoning_effort: high
          # 45m, from measurement rather than estimate: a real pass over
          # this backlog scans a few hundred items, reads the charter and
          # writes a report with a rubric citation per ordering entry, and
          # took roughly 24 minutes. Overrunning is not a cheap failure, so
          # the margin is deliberate.
          timeout: 45m
        inputs:
          - source: github_issue
            required: true
        produces:
          - artifact: grooming_report
            schema: grooming_report_v1
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              not: [author, agent]

      # There is deliberately no apply stage between these two, and adding
      # one back would be a regression. The mutations are executed when the
      # operator approves the gate above, so an apply stage would spawn an
      # agent with nothing left to do.
      #
      # Putting the apply behind the gate rather than in an agent stage is
      # the design: an agent stage between the operator's decision and the
      # tracker write would place an agent inside the very step this
      # workflow exists to keep human. The gate decision is the
      # authorization, and the apply layer's containment rules are what
      # enforce it.

      # Confirm. A human checks that the mutations actually landed.
      #
      # This is not a second rubber stamp. The apply reports its own outcome
      # per entry, but an audit row saying `applied` is a different claim
      # from the tracker actually carrying the change — a run can truthfully
      # report eight mutations applied while every applied value is
      # malformed. This gate is where an operator records that they checked
      # the tracker, not the summary.
      - id: confirm
        type: review
        executor:
          human: true
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              not: [agent]

  # ---------------------------------------------------------------------------
  # upkeep_scan — find what needs fixing before anyone asks.
  #
  # A propose-only scan for repository upkeep: recorded-run flakes,
  # toolchain-pin drift, deprecations and dependency vulnerability
  # advisories (govulncheck reachability per Go module, pnpm audit per
  # lockfile; E80.2 / #3750). The scan stage emits an upkeep_report and
  # stops at a human approval. Nothing is filed until that gate is
  # approved: approving it settles the per-finding dispositions and files
  # each captain-approved finding that no open issue or open Dependabot
  # pull request already covers. Rejecting it files nothing. The run
  # never creates another run and produces no code diff.
  #
  # Modelled on docs/spec/examples/workflow-v2-upkeep-scan.yaml, minus
  # that example's `file` implement stage: since #3924 the filing runs on
  # the scan gate's decision, server-side, with no agent stage between
  # the decision and the tracker write, so an apply stage would spawn an
  # agent with nothing left to do (the same reasoning as
  # backlog_grooming above). The one-stage shape matches the newer
  # user-report scan example.
  #
  # The advisory source has no switch: the scan prompt always asks for it.
  # It needs network egress to the advisory databases; without egress the
  # report names `advisory` in `source_degrades` rather than reporting an
  # empty clean scan. No charter is required (that keys on
  # grooming_report only).
  #
  # SCHEDULE. Weekly, Monday 09:00 UTC (05:00 US Eastern), outside
  # campaign hours. The schedule starts runs only when fishhawkd runs
  # with --enable-scheduler and this repository in --scheduler-repos
  # (scripts/dev passes both, with --scheduler-runner-kind local). A local
  # scheduled run parks at awaiting_host_dispatch until a host dispatches
  # its scan stage, so it holds no host-dispatch slot and spends nothing
  # until then. The first tick after the scheduler is enabled starts one
  # run for the most recent Monday window; there is never a backfill. The
  # gate declares no `sla`, for the reason given on backlog_grooming.
  # ---------------------------------------------------------------------------
  upkeep_scan:
    description: >-
      Scan for repository upkeep work — recorded-run flakes, toolchain-pin drift, deprecations and dependency vulnerability advisories (govulncheck reachability, pnpm audit) — propose it as an upkeep report, gate the report on a human approval, and file the approved findings as issues on that approval. Produces no code diff at any stage.
    auto_advance: true

    applies_to:
      trigger: [scheduled, on_demand]

    schedule:
      cron: "0 9 * * 1"

    # Nothing delegated: the gate below always stops for a human.
    autonomy: low

    stages:
      - id: scan
        type: plan
        executor:
          agent: claude-code
          timeout: 20m
        produces:
          - artifact: upkeep_report
            schema: upkeep_report_v1
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # as on every other gate in this file.
              members: ["github:kuhlman-labs"]
              not: [author, agent]

  # ---------------------------------------------------------------------------
  # feature_change — build it. The default workflow for product work.
  #
  # One turn of the development cycle, in the order the work actually
  # happens:
  #
  #   plan       propose an approach; agent reviewers advise, a human approves
  #   implement  write the code, verify it, open a pull request
  #   acceptance validate the running candidate against the plan's criteria
  #   review     a human approves the change, verdict already in hand
  #
  # Verification precedes approval on purpose. The acceptance verdict is
  # evidence the reviewer needs, so producing it before the gate means the
  # human decides once, with the result, rather than approving and then
  # waiting to learn whether the change actually worked.
  # ---------------------------------------------------------------------------
  feature_change:
    # No `applies_to` on purpose. This is the catch-all workflow — where
    # anything that does not fit a narrower one belongs — so any routing
    # envelope would either be wide enough to say nothing or would refuse
    # legitimate work. An absent `applies_to` accepts any change, which is
    # the accurate statement of intent.
    description: >-
      Default workflow for feature work and non-trivial changes. The agent plans and implements; an acceptance agent validates the running candidate against the approved plan's acceptance criteria; a human approves the plan up front and the pull request at the end.
    # Auto-advance mechanical transitions (review settlement, fix-up
    # re-park, derived merge-readiness) instead of parking on each one, and
    # surface the next action. Judgment points still stop for a decision.
    auto_advance: true
    # Delegation tier for the operator agent. `high` lets it approve on a
    # clean dual review, route a fix-up on convergent concerns, retry an
    # infrastructure flake, waive a lone low-severity concern, and merge
    # once gates are resolved and CI is green. Anything outside those
    # conditions still pages a human, as does every event in the tier's
    # page list (a gating reviewer reject, a plan rejection, a scope
    # amendment, a budget or policy override, an exception request, a
    # requirement arbitration).
    autonomy: high
    # Per-path escalations: a change touching a listed path gets a stricter
    # policy than the workflow's own. These are the surfaces where a defect
    # is hardest to detect after the fact — the spec parser and validator,
    # the audit log, the policy engine, and the auth surfaces — so agent
    # autonomy is clamped for them.
    #
    # `max_autonomy: medium` keeps approve, fix-up and retry delegated but
    # returns waive and merge to a human: an agent may not waive a concern
    # or merge its own change on this code. An escalation may only ever
    # raise the bar, never lower it, and one that would change nothing is
    # refused at validation.
    #
    # Deliberately no `approvals` raise alongside it. Raising the count to
    # two would be honest about intent and dishonest about capability: this
    # repository has one eligible approver, so a count of two is
    # unsatisfiable and every escalated run would stop at a gate no one can
    # clear. A control that cannot be satisfied is not a stricter control,
    # it is an outage. Add `approvals: {count: 2}` here once a second
    # approver exists.
    #
    # `match.paths` is evaluated against the approved plan's declared file
    # scope at the approval gate, so it is only meaningful on a workflow
    # that declares a plan stage. Declaring it on one that does not is
    # refused at validation rather than silently never firing.
    escalations:
      - match:
          paths:
            - "backend/internal/spec/**"
            - "cli/internal/spec/**"
            - "backend/internal/audit/**"
            - "backend/internal/policy/**"
            - "backend/internal/auth/**"
            - "backend/internal/githubapp/**"
            - "verifier/**"
        require:
          max_autonomy: medium
          reviewers: [security]
      # Further security-sensitive surfaces that get the security persona but
      # keep the workflow's own autonomy: the prompt quarantine envelopes, the
      # agent-instruction path class, the runner's gate env allow-list and
      # agent env, and credential storage.
      - match:
          paths:
            - "backend/internal/prompt/**"
            - "backend/internal/agentpaths/**"
            - "runner/internal/constraint/**"
            - "runner/internal/agentenv/**"
            - "runner/cmd/fishhawk-runner/gateenv*.go"
            - "credstore/**"
        require:
          reviewers: [security]
    policy:
      max_stage_runtime: "30m"
    # Periodic cost ceiling. Advisory: it emits an alert to the audit log
    # and the originating issue at the warn threshold and again at 100%,
    # and never blocks a run. Set `enforcement: blocking` to refuse new
    # runs once the period limit is exhausted.
    budgets:
      - period: weekly
        limit_usd: 1000
        warn_at: 0.8
        enforcement: advisory
    # Re-dispatch the implement stage once if a required CI check fails.
    # A routine test or lint regression is the agent's to fix; one retry
    # is resilience to a flaky check without spinning on a real bug.
    on_ci_failure:
      max_retries: 1
    stages:
      # 1. Plan — propose an approach before writing anything.
      - id: plan
        type: plan
        executor:
          agent: claude-code
          # The plan stage is the cheapest agent stage and plan quality is
          # the strongest lever on downstream rework, so it pins the current
          # Opus rather than taking the deployment default. Effort is pinned
          # at `xhigh` for the same reason: the extra thinking is cheap here
          # and pays back across every later stage.
          model: claude-opus-5-5
          reasoning_effort: xhigh
        # Advisory plan review: agent reviewers surface verdicts before the
        # human gate below, which stays authoritative (agent reviewers plus
        # a human reviewer resolves to advisory authority). Two providers
        # review concurrently — independent models disagree in useful ways,
        # and a concern only one of them raises is still surfaced.
        reviewers:
          agents:
            - provider: claudecode
              model: claude-fable-5-1
              reasoning_effort: high
            - provider: codex
              model: gpt-6-astra
              reasoning_effort: high
          human: 1
          # Hand the security convention to this stage's reviewers when the
          # plan's scope touches a sensitive path, and run the architect on
          # every plan.
          conventions: [security_conventions]
          personas: [architect]
        inputs:
          - source: github_issue
            required: true
        produces:
          - artifact: plan
            schema: standard_v1
            # The plan is rendered as a comment on the originating issue so
            # it can be read in context, and written to the audit log as the
            # canonical copy the later stages are checked against.
            persistence:
              - target: originating_issue
                mode: rendered_comment
                update_on_change: true
              - target: fishhawk_audit_log
                mode: canonical
        # limit_usd is the one enforced per-stage lever (#2328), set at about
        # three times the largest observed spend for this stage type so it never
        # fires on a normal stage. Basis, 2026-10-16: the per-stage sum of every
        # feature_change plan stage's cost_recorded entries (agent passes,
        # fix-ups and the reviews billed to the stage, deduped by content hash
        # as the enforcement sums them) over 1502 stages: max $20.97, p99 $14.72,
        # median $3.66. Advisory: a breach records stage_budget_exceeded and
        # the run proceeds.
        budget:
          limit_usd: 65
          max_tokens: 200000
          max_runtime: 15m
          enforcement: advisory
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              # Exclude the change's author and any agent identity. Taking
              # part in the loop — answering a clarification, attaching
              # approval conditions, driving a stage — is not authorship, so
              # this does not lock out the sole approver; it bites only on a
              # real authorship signal such as an operator-vouched commit.
              not: [author, agent]

      # 2. Implement — write the code against the approved plan and open
      #    the pull request.
      - id: implement
        type: implement
        # Two local implements may run at once (ADR-087 / #3964). Safe since
        # the ADR-063 container gate path went live (#4040/#4061): each gate
        # gets a private verify lock, golangci-lint cache and Postgres
        # service. Measured: one container verify peaks at ~4.2 GiB / ~12 of
        # 14 cores, so Docker Desktop memory must be >= 16 GiB. Still
        # serialized elsewhere: acceptance (below), and the operator rule of
        # never merging an overlapping PR under a live implement (#4083).
        concurrency:
          limit: 2
        executor:
          agent: claude-code
          # Pinned so the implement model is reproducible and priced rather
          # than whatever the host's claude CLI defaults to. A plan
          # model_recommendation or an operator override at the gate still
          # takes precedence over this pin.
          model: claude-opus-5-5
          # `xhigh` is Anthropic's recommended level for agentic coding and
          # the claude CLI's documented default, so this pin should make
          # today's effective effort explicit rather than change it. If
          # runtime_observed keeps running long against the 60m budget, drop
          # to `high` before raising the budget.
          reasoning_effort: xhigh
          # Execution-grounded verifier. After the agent exits, run the
          # project's test command against the committed, scope-only tree
          # (not the working tree). On failure, feed the captured output
          # back to the agent for a bounded fix loop and re-verify, all
          # before the pull request opens — so a defect is fixed while the
          # agent is still live rather than red-lining CI after it is gone.
          #
          # `scripts/test verify` runs lint before the race-detector test
          # loop, so a formatting or lint defect fails here too.
          # max_iterations: 1 allows a single fix attempt; 0, or removing
          # this block, makes the stage single-shot.
          #
          # timeout was 15m and is now 40m (#3383). The runner enforces this
          # cap on BOTH the per-iteration gate and the #960 strict full
          # re-verify of the committed SHA, and on expiry it SIGKILLs the
          # command's process group. A full `scripts/test verify` on this
          # repo already exceeds 10 minutes on clean main; a slice whose
          # changed-package set makes the patch-coverage loop instrument a
          # large package (e.g. backend/internal/server) runs well past 15m,
          # so the gate was killed mid-run. That surfaces as a verify FAILURE
          # whose captured output contains no failing test at all — it simply
          # stops where the process died — which cost run bafae5d7 slice 2
          # four full-verify attempts and two category-A failures.
          # Raise the cap so the gate measures the tree rather than the clock.
          # Making a killed gate self-describing (and retryable as infra
          # rather than agent-output-invalid) is tracked separately in #3383.
          verify:
            command: "scripts/test verify"
            timeout: "40m"
            max_iterations: 1
        # Advisory implement review: the same two providers read the diff
        # against the approved plan and surface verdicts, including a
        # scope-drift flag when the diff exceeds what the plan declared.
        # Verdicts land shortly after the stage's trace is uploaded.
        reviewers:
          agents:
            - provider: claudecode
              model: claude-fable-5-1
              reasoning_effort: high
            - provider: codex
              model: gpt-6-astra
              reasoning_effort: high
          human: 1
          # The security convention, on a diff touching a sensitive path.
          conventions: [security_conventions]
        inputs:
          - artifact: plan
            from_stage: plan
        produces:
          - artifact: pull_request
        constraints:
          # The product's built-in agent-instruction constraint (#3942) refuses
          # `.agents/`, `.claude/`, `.codex/` and the auto-loaded instruction files
          # (AGENTS.md, AGENTS.override.md, CLAUDE.md, CLAUDE.local.md) at any depth
          # and in any letter case on every implement stage. This stage relaxes it
          # for exactly ONE path, the root AGENTS.md (exact case), which the
          # conventions require updating; the forbidden_paths globs below stay as
          # defence in depth and because the campaign admission screen and the
          # forbidden-criterion sweep read only forbidden_paths (dropping them waits
          # on teaching those surfaces the built-in).
          agent_instruction_paths:
            writable: ["AGENTS.md"]
          # Post-hoc diff constraints, checked against the produced pull
          # request. A change larger than this cap fails the stage rather
          # than merging unreviewably wide; if a change is genuinely
          # irreducible past it, raise the cap here as a tracked, reverted
          # exception rather than leaving it loose. An approval-time scope
          # override does not reach this constraint — the spec is the only
          # lever that moves it.
          max_files_changed: 45
          # Paths the stage may not rewrite. The CI workflow directory is
          # what executes the agent and this spec directory is what governs
          # it, so neither is the agent's to edit — an agent able to change
          # them could widen its own permissions inside the very change it
          # is proposing. The agent-instruction directories are the same
          # class: a skill or setting committed there is loaded as
          # instructions by every later agent session, runner agents
          # included, so an agent editing them could rewrite its successors'
          # instructions; skill and settings upkeep is operator-authored
          # (AGENTS.md, Documentation surfaces). They are matched at any
          # depth and in any letter case (see the entries below). The legal files are neither,
          # but are likewise not the agent's to edit.
          forbidden_paths:
            - ".github/workflows/**"
            - ".fishhawk/**"
            # Agent-config directories at ANY depth and in ANY letter case:
            # codex finds .agents/skills at every level, and on a
            # case-insensitive filesystem (macOS) a CLI opening `.agents`
            # resolves to a tracked `.Agents`. doublestar has no
            # case-insensitive mode, so each name is spelled as character
            # classes. Pinned by runner/internal/constraint's
            # TestRepoSpecForbidsAgentInstructionPaths.
            - "**/.[aA][gG][eE][nN][tT][sS]/**"
            - "**/.[cC][lL][aA][uU][dD][eE]/**"
            - "**/.[cC][oO][dD][eE][xX]/**"
            # The instruction files every CLI auto-loads, except the ROOT
            # AGENTS.md: the repo's conventions require updating it in the
            # change that adds a trap or workflow, and this workflow has human
            # plan approval and review. Nothing requires an agent to write a
            # nested AGENTS.md (`*/**/` needs at least one directory), the
            # codex AGENTS.override.md (read BEFORE AGENTS.md), or either
            # CLAUDE file.
            - "*/**/[aA][gG][eE][nN][tT][sS].[mM][dD]"
            - "**/[aA][gG][eE][nN][tT][sS].[oO][vV][eE][rR][rR][iI][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[lL][oO][cC][aA][lL].[mM][dD]"
            # Root-level letter-case VARIANTS of AGENTS.md (`agents.md`,
            # `Agents.MD`, ...): each pattern forces ONE letter to differ from
            # the exact `AGENTS.md` (a lowercase name letter, or an uppercase
            # extension letter), so the eight together match every spelling but it.
            # On a case-insensitive checkout such a file collides with AGENTS.md.
            - "a[gG][eE][nN][tT][sS].[mM][dD]"
            - "[aA]g[eE][nN][tT][sS].[mM][dD]"
            - "[aA][gG]e[nN][tT][sS].[mM][dD]"
            - "[aA][gG][eE]n[tT][sS].[mM][dD]"
            - "[aA][gG][eE][nN]t[sS].[mM][dD]"
            - "[aA][gG][eE][nN][tT]s.[mM][dD]"
            - "[aA][gG][eE][nN][tT][sS].M[dD]"
            - "[aA][gG][eE][nN][tT][sS].[mM]D"
            # The operator-only skill guard (.agents/skills/*) and its harness:
            # a run must not merge a weakened run-agent check.
            - "scripts/is-run-agent"
            - "scripts/test-is-run-agent"
            - "LICENSE"
            - "NOTICE"
          required_outcomes:
            - tests_added_or_updated
            - ci_green
        # limit_usd is the one enforced per-stage lever (#2328), set at about
        # three times the largest observed spend for this stage type so it never
        # fires on a normal stage. Basis, 2026-10-16: the per-stage sum of every
        # feature_change implement stage's cost_recorded entries (agent passes,
        # fix-ups and the reviews billed to the stage, deduped by content hash
        # as the enforcement sums them) over 2024 stages: max $68.23, p99 $45.58,
        # median $6.64. Advisory: a breach records stage_budget_exceeded and
        # the run proceeds.
        budget:
          limit_usd: 210
          max_tokens: 500000
          max_runtime: 30m
          enforcement: advisory

      # 3. Acceptance — does the change actually do what the plan promised?
      #
      # The acceptance agent exercises the running candidate against the
      # approved plan's acceptance criteria and submits a signed verdict
      # with evidence. It runs before the review gate so the reviewer
      # decides with that verdict in hand.
      #
      # A failing verdict does not fail the stage — it routes to the right
      # remedy instead (a fix-up for a code defect, a re-run for a flaky
      # check, a page for anything the loop cannot classify), and merge
      # stays conditioned on a passing or explicitly arbitrated result.
      - id: acceptance
        type: acceptance
        # One acceptance at a time on this host: every local acceptance
        # validates against the single shared preview (localhost:8090,
        # fishhawk_preview DB), so two would clobber each other's target.
        # Interim safety net until per-run previews (#4063).
        concurrency:
          group: local-acceptance
          limit: 1
        executor:
          # An acceptance stage must run under an agent or human executor.
          agent: claude-code
          # Acceptance drives scripted HTTP checks against the criteria, not
          # open-ended reasoning, so it runs the current Opus at `medium`.
          model: claude-opus-5-5
          reasoning_effort: medium
        inputs:
          - artifact: plan
            from_stage: plan
          - artifact: pull_request
            from_stage: implement
        # The acceptance agent's network egress is default-deny. This is the
        # one allowance the workflow declares: the host serving the preview
        # instance under test. The model API endpoint and the Fishhawk
        # backend are added by the runner and are not declarable here.
        # Hosts, not URLs — no scheme and no path.
        egress:
          target_hosts:
            - localhost:8090
        # A durable record of the verdict, the per-criterion results, and
        # content-hash references to the captured evidence. Valid only on an
        # acceptance stage.
        produces:
          - artifact: acceptance
        # limit_usd is the one enforced per-stage lever (#2328), set at about
        # three times the largest observed spend for this stage type so it never
        # fires on a normal stage. Basis, 2026-10-16: the per-stage sum of every
        # feature_change acceptance stage's cost_recorded entries (agent passes,
        # fix-ups and the reviews billed to the stage, deduped by content hash
        # as the enforcement sums them) over 461 stages: max $29.80, p99 $14.80,
        # median $2.15. Advisory: a breach records stage_budget_exceeded and
        # the run proceeds.
        budget:
          limit_usd: 90
          max_tokens: 200000
          max_runtime: 20m
          enforcement: advisory

      # 4. Review — the last gate before merge. By the time a human reads
      #    this, the plan was approved, the diff was reviewed by two agent
      #    reviewers, the test command ran against the committed tree, and
      #    the acceptance verdict is recorded. The decision is whether to
      #    ship, not whether it works.
      - id: review
        type: review
        executor:
          human: true
        inputs:
          - artifact: pull_request
            from_stage: implement
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              # Same predicate as the plan gate: one approval, excluding the
              # author and any agent identity.
              not: [author, agent]

  # ---------------------------------------------------------------------------
  # hotfix_change — the same cycle at emergency cadence (ADR-053, E35.5).
  #
  # feature_change's in-run shape (plan -> implement -> preview acceptance ->
  # human review) with tighter stage budgets, a smaller diff cap, a 20m
  # stage-runtime policy and delegation NARROWER than feature_change. Copied
  # from docs/spec/examples/workflow-v2-hotfix-change.yaml, which is the
  # contract (docs/spec/workflow-v2.md § "Incident hotfix preset"); only the
  # repository-specific knobs are adapted to match feature_change above:
  # executor models, efforts and concurrency, reviewer models, conventions,
  # personas and escalations, the verify command and its timeout, the full
  # forbidden_paths list, and the approver members.
  #
  # The alert ingress auto-starts this workflow by default for an alert
  # source, but only when that source sets `auto_start: true`; none here
  # does. It does NOT deploy or verify the deploy: post-deploy verification
  # is a follow-on `release` run the operator starts after merge.
  # ---------------------------------------------------------------------------
  hotfix_change:
    description: >-
      Incident hotfix: feature_change's shape at emergency cadence. The agent plans and implements; a human approves the plan and the PR. Tighter budgets, a smaller diff cap, and no delegated approve, waive or merge.
    # The alert ingress (E35.4 / #1601) routes an `alert` run as the `diff`
    # trigger form (appliesto.TriggerFormForSource), so `diff` is required for
    # an auto-started incident run to be admitted. No `labels` predicate: the
    # alert path hydrates issue context best-effort, and a labels criterion
    # fails closed on an empty snapshot.
    applies_to:
      trigger: [diff]
    auto_advance: true
    # Delegation: start from the medium tier (fixup under convergent_concerns
    # and retry under infra_flake stay delegated — the mechanical, reversible
    # moves), then pin approve, waive and merge to `gated` EXPLICITLY. An
    # explicit entry wins over the tier for that class, so raising the tier to
    # `high` can never widen these three. Do NOT declare an autonomy or
    # actions block on any gate below: a gate-level block replaces this one
    # wholesale.
    autonomy: medium
    actions:
      approve:
        mode: gated
      waive:
        mode: gated
      merge:
        mode: gated
      # The full closed set: the tier's seven events plus
      # advisory_reviewer_reject (any reviewer reject pages during an
      # incident) and clarification_request.
      page_human_on:
        - advisory_reviewer_reject
        - gating_reviewer_reject
        - plan_rejection
        - scope_amendment
        - budget_override
        - policy_override
        - exception_request
        - requirement_arbitration
        - clarification_request
    # The same per-path security-persona escalations as feature_change.
    # feature_change's `max_autonomy: medium` clamp on the first set is NOT
    # carried: this workflow already resolves at medium with approve, waive
    # and merge explicitly gated, so the clamp would change nothing and the
    # validator refuses a no-op escalation. Raising this workflow's tier
    # would mean restoring it.
    escalations:
      - match:
          paths:
            - "backend/internal/spec/**"
            - "cli/internal/spec/**"
            - "backend/internal/audit/**"
            - "backend/internal/policy/**"
            - "backend/internal/auth/**"
            - "backend/internal/githubapp/**"
            - "verifier/**"
        require:
          reviewers: [security]
      - match:
          paths:
            - "backend/internal/prompt/**"
            - "backend/internal/agentpaths/**"
            - "runner/internal/constraint/**"
            - "runner/internal/agentenv/**"
            - "runner/cmd/fishhawk-runner/gateenv*.go"
            - "credstore/**"
        require:
          reviewers: [security]
    # Enforced: the wall-clock envelope of every agent stage, and the plan
    # gate's implement budget — a plan predicting more than ~20 minutes is
    # pushed to decompose.
    policy:
      max_stage_runtime: "20m"
    on_ci_failure:
      max_retries: 1
    # No periodic `budgets`: advisory would change nothing for the run, and
    # blocking would refuse an incident fix at admission.
    stages:
      - id: plan
        type: plan
        executor:
          agent: claude-code
          # Same pins as feature_change's plan stage.
          model: claude-opus-5-5
          reasoning_effort: xhigh
        # Dual advisory review runs concurrently, so it costs no wall-clock;
        # the human gate below decides. Same reviewers, conventions and
        # persona as feature_change's plan stage.
        reviewers:
          authority: advisory
          agents:
            - provider: claudecode
              model: claude-fable-5-1
              reasoning_effort: high
            - provider: codex
              model: gpt-6-astra
              reasoning_effort: high
          human: 1
          conventions: [security_conventions]
          personas: [architect]
        inputs:
          - source: github_issue
            required: true
        produces:
          - artifact: plan
            schema: standard_v1
            persistence:
              - target: originating_issue
                mode: rendered_comment
                update_on_change: true
              - target: fishhawk_audit_log
                mode: canonical
        # limit_usd is the enforced ceiling; max_tokens and max_runtime are
        # declared but calibration-pending (#2328). The preset's values are
        # kept as-is. Advisory: a breach records stage_budget_exceeded and the
        # run proceeds.
        budget:
          max_tokens: 150000
          max_runtime: 10m
          limit_usd: 3
          enforcement: advisory
        # Retained: alert text is untrusted input, and this gate puts the plan
        # derived from it in front of a human before any code is written.
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity, as on feature_change.
              members: ["github:kuhlman-labs"]
              not: [author, agent]

      - id: implement
        type: implement
        # Same concurrency as feature_change's implement (ADR-087 / #3964).
        concurrency:
          limit: 2
        executor:
          agent: claude-code
          model: claude-opus-5-5
          reasoning_effort: xhigh
          verify:
            command: "scripts/test verify"
            # NOT tightened: equal to feature_change's verify timeout. A full
            # `scripts/test verify` on this repo can run past 15m, and a gate
            # killed by its timeout reads as a verify failure with no failing
            # test (#3383).
            timeout: "40m"
            max_iterations: 1
        reviewers:
          authority: advisory
          agents:
            - provider: claudecode
              model: claude-fable-5-1
              reasoning_effort: high
            - provider: codex
              model: gpt-6-astra
              reasoning_effort: high
          human: 1
          conventions: [security_conventions]
        inputs:
          - artifact: plan
            from_stage: plan
        produces:
          - artifact: pull_request
        constraints:
          # A hotfix is a narrow change; a wider one is a feature_change.
          max_files_changed: 15
          # No `agent_instruction_paths` relaxation: the built-in constraint
          # (#3942) stays at its default, so unlike feature_change the ROOT
          # AGENTS.md is not writable either. An incident fix has no reason to
          # edit agent instructions. The globs below are routine_change's
          # agent-instruction set plus feature_change's remaining entries and
          # the preset's GitLab CI paths. Pinned by the twin
          # TestRepoSpecForbidsAgentInstructionPaths tests.
          forbidden_paths:
            - ".github/workflows/**"
            - ".gitlab-ci.yml"
            - ".gitlab/ci/**"
            - ".gitlab/agents/**"
            - ".fishhawk/**"
            # Agent-config directories at ANY depth and in ANY letter case.
            - "**/.[aA][gG][eE][nN][tT][sS]/**"
            - "**/.[cC][lL][aA][uU][dD][eE]/**"
            - "**/.[cC][oO][dD][eE][xX]/**"
            # The instruction files every CLI auto-loads, at any depth and in
            # any letter case, the root AGENTS.md included.
            - "**/[aA][gG][eE][nN][tT][sS].[mM][dD]"
            - "**/[aA][gG][eE][nN][tT][sS].[oO][vV][eE][rR][rR][iI][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[lL][oO][cC][aA][lL].[mM][dD]"
            # The operator-only skill guard and its harness.
            - "scripts/is-run-agent"
            - "scripts/test-is-run-agent"
            - "LICENSE"
            - "NOTICE"
          required_outcomes:
            - tests_added_or_updated
            - ci_green
        budget:
          max_tokens: 300000
          max_runtime: 20m
          limit_usd: 8
          enforcement: advisory

      # Pre-merge acceptance against the PREVIEW instance, as in
      # feature_change. Not post-deploy verification — see the header.
      - id: acceptance
        type: acceptance
        # Same serialization as feature_change's acceptance: every local
        # acceptance shares the single preview (localhost:8090).
        concurrency:
          group: local-acceptance
          limit: 1
        executor:
          agent: claude-code
          model: claude-opus-5-5
          reasoning_effort: medium
        inputs:
          - artifact: plan
            from_stage: plan
          - artifact: pull_request
            from_stage: implement
        egress:
          target_hosts:
            - localhost:8090
        produces:
          - artifact: acceptance
        budget:
          max_tokens: 150000
          max_runtime: 10m
          limit_usd: 3
          enforcement: advisory

      # The merge gate. A human executor, and an approval excluding the
      # change's author and any agent identity. No gate-level autonomy or
      # actions block (see the workflow-level comment).
      - id: review
        type: review
        executor:
          human: true
        inputs:
          - artifact: pull_request
            from_stage: implement
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity, as on feature_change.
              members: ["github:kuhlman-labs"]
              not: [author, agent]

  # ---------------------------------------------------------------------------
  # routine_change — the same cycle, compressed.
  #
  # Documentation, dependency bumps, formatting fixes and tests for existing
  # behavior: changes where the cost of a mistake is contained and CI is a
  # sufficient check. No plan stage and no human approval gate — implement,
  # then let branch protection decide.
  # ---------------------------------------------------------------------------
  routine_change:
    # This is the workflow that permits an agent merge, so what may be
    # routed here is a real governance question rather than a habit. The
    # label envelope is enforced at run admission on every entry point: a
    # change must be filed as a chore to be routed here, and anything else
    # is refused before any work begins. Expect it to refuse something
    # eventually — that is the control working, and the fix is amending
    # this file rather than reaching for a routing override.
    #
    # No `paths` envelope here. A path predicate is evaluated at the plan
    # gate and this workflow declares no plan stage, so it could never be
    # evaluated and is refused at validation. The path envelope for this
    # workflow is the implement stage's `allowed_paths` below, which is a
    # post-hoc diff constraint: it catches a violation after the agent has
    # run rather than refusing it at routing.
    applies_to:
      labels: ["type:chore"]
    description: >-
      Workflow for documentation, dependency bumps, lint and format fixes, and tests for existing behavior. The agent may merge once all gates pass.
    auto_advance: true
    # The agent carries the change to merge unattended. Nothing was
    # human-approved upstream, so the delegation has to cover the whole
    # path: approve, fix-up, retry, waive a lone low-severity concern, and
    # merge once CI is green. The `allowed_paths` constraint below, not a
    # human, is what bounds the blast radius.
    autonomy: high
    # Self-healing is the point here: nothing was human-approved, so the
    # agent's job is to keep the change merging cleanly. One retry balances
    # resilience to a flaky check against spinning on a real bug.
    on_ci_failure:
      max_retries: 1
    stages:
      # 1. Implement — no plan stage: for work this small the diff is the
      #    proposal, and the allow-list below is what bounds it.
      - id: implement
        type: implement
        # Two local implements may run at once (ADR-087 / #3964). Safe since
        # the ADR-063 container gate path went live (#4040/#4061): each gate
        # gets a private verify lock, golangci-lint cache and Postgres
        # service. Measured: one container verify peaks at ~4.2 GiB / ~12 of
        # 14 cores, so Docker Desktop memory must be >= 16 GiB. Still
        # serialized elsewhere: acceptance (below), and the operator rule of
        # never merging an overlapping PR under a live implement (#4083).
        concurrency:
          limit: 2
        executor:
          agent: claude-code
          # Routine work (docs, tests, dependency bumps) holds up at `medium`.
          reasoning_effort: medium
        produces:
          - artifact: pull_request
        constraints:
          max_files_changed: 20
          # An allow-list, not a deny-list: on a workflow that merges
          # without human approval, anything not named here fails the stage.
          allowed_paths:
            - "docs/**"
            - "**/*.md"
            - "go.mod"
            - "go.sum"
            - "**/*_test.go"
          # `**/*.md` and `docs/**` above would otherwise admit agent
          # instructions on a workflow that merges without human approval:
          # skills and settings under the agent-config directories, and the
          # instruction files every CLI auto-loads (AGENTS.md,
          # AGENTS.override.md, CLAUDE.md, CLAUDE.local.md) at any depth. All
          # are loaded as instructions by later agent sessions, so on this
          # workflow they are not the agent's to write, the root AGENTS.md
          # included. (feature_change keeps only the root AGENTS.md
          # writable: the conventions require updating it, and that workflow
          # has human plan approval and review.)
          forbidden_paths:
            # Agent-config directories at ANY depth and in ANY letter case:
            # codex finds .agents/skills at every level, and on a
            # case-insensitive filesystem (macOS) a CLI opening `.agents`
            # resolves to a tracked `.Agents`. doublestar has no
            # case-insensitive mode, so each name is spelled as character
            # classes. Pinned by runner/internal/constraint's
            # TestRepoSpecForbidsAgentInstructionPaths.
            - "**/.[aA][gG][eE][nN][tT][sS]/**"
            - "**/.[cC][lL][aA][uU][dD][eE]/**"
            - "**/.[cC][oO][dD][eE][xX]/**"
            - "**/[aA][gG][eE][nN][tT][sS].[mM][dD]"
            - "**/[aA][gG][eE][nN][tT][sS].[oO][vV][eE][rR][rR][iI][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[mM][dD]"
            - "**/[cC][lL][aA][uU][dD][eE].[lL][oO][cC][aA][lL].[mM][dD]"
            # The operator-only skill guard and its harness. allowed_paths above
            # already excludes scripts/, but forbidding them here pins that
            # independently of how the allow-list may later widen.
            - "scripts/is-run-agent"
            - "scripts/test-is-run-agent"
          required_outcomes:
            - ci_green
      # 2. Review — the gate, held by CI rather than a person.
      - id: review
        type: review
        executor:
          agent: claude-code
          # Same level as the feature_change reviewers.
          reasoning_effort: high
        gates:
          # A `check` gate carries no approval predicate: it lets the run
          # advance once the forge's own branch protection is satisfied.
          # Merge readiness is owned there rather than restated here, so the
          # two cannot disagree.
          - type: check

  # ---------------------------------------------------------------------------
  # human_led_change — the cycle inverted: a human writes the code, and the
  # workflow records it.
  #
  # For load-bearing surfaces (cryptography, the policy engine, audit
  # integrity, forge app authentication) where the author is a person, not
  # an agent. There is no plan or implement stage because neither is the
  # agent's to run; what remains is the gate and the audit trail.
  # ---------------------------------------------------------------------------
  human_led_change:
    # No `applies_to` on purpose. This workflow is the escape hatch for the
    # riskiest surfaces, and a routing envelope would refuse a change that
    # belongs here for a bookkeeping reason — refusing the safest route is
    # the wrong failure direction. A path envelope would express the intent
    # exactly, but paths are evaluated at a plan gate and this workflow
    # declares no plan stage.
    description: >-
      Workflow for human-authored changes to load-bearing surfaces (cryptography, policy engine, audit integrity, forge app authentication). The audit log records what was changed and who approved it.
    # Advance the mechanical transitions automatically. Nothing is delegated
    # here — with no `autonomy` declared, every action class defaults to
    # gated — so this only removes bookkeeping stops, not decisions.
    auto_advance: true
    stages:
      # The only stage: a gate on a pull request a person already wrote.
      - id: review
        type: review
        executor:
          human: true
        inputs:
          - source: pull_request
            required: true
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              not: [author, agent]

  # ---------------------------------------------------------------------------
  # release — the last step of the cycle, and a separate run.
  #
  # The run does two things. It anchors the release record (E33): the
  # operator drives `fishhawk release prepare/preview/cut/publish` against
  # it, producing evidence-linked release notes and the `release_cut` /
  # `release_published` audit entries. And it gates environment deploys
  # through the delegated `deploy.yml`, which is still a validation stub
  # until #1418 points it at a real target.
  #
  # It does NOT cut or build binary tags. A `<component>/vX.Y.Z` tag push
  # runs the tag-driven `.github/workflows/*-release.yml` workflows, which
  # build, sign and publish the binaries and the fishhawkd image on their
  # own; this run never triggers them.
  #
  # Fishhawk holds no deploy logic and no deploy credentials. The deploy
  # stage triggers `deploy.yml`, passing the run and stage identifiers the
  # pipeline echoes back for correlation, then monitors it to a terminal
  # state and records a deployment artifact and audit trail.
  #
  # It is deliberately its own workflow rather than a fifth stage on
  # feature_change: a release usually ships several merged changes at once,
  # and tying the deploy to one feature run would force a one-to-one that
  # does not hold. The operator triggers it once the changes have merged.
  #
  # `required_upstream` is likewise omitted: it evaluates the current run's
  # own implement and review state, which a deploy-only release run does not
  # have, so declaring it would fail closed on every release. The approval
  # gate below is the control point, and the operator confirms the changes
  # merged before triggering.
  # ---------------------------------------------------------------------------
  release:
    # No `applies_to`. The natural envelope is a trigger predicate, but
    # every trigger source in use today normalizes to `diff`, so a trigger
    # declaration cannot yet distinguish an operator-triggered release from
    # anything else — it would match nothing and refuse every real run.
    description: >-
      Release record and deploy gate: anchors the E33 release record (fishhawk release prepare/preview/cut/publish, evidence-linked notes, release_cut/release_published audit) and gates environment deploys through the delegated deploy.yml (a stub until #1418). It does not cut or build binary tags; the tag-driven *-release.yml workflows do that. Fishhawk holds no deploy logic or credentials. Operator-triggered after the corresponding feature_change runs merge.
    auto_advance: true
    # No `autonomy` and therefore no delegation: an environment deploy always
    # pages a human at the gate below, whatever the rest of the file allows.
    policy:
      max_stage_runtime: "30m"
    stages:
      - id: deploy
        type: deploy
        # A deploy stage must delegate — it takes no agent or human
        # executor. Fishhawk dispatches the named pipeline and watches it.
        executor:
          delegate:
            target: github_actions
            workflow_ref: deploy.yml
            git_ref: main
        # Pre-flight constraints, evaluated at the gate before anything is
        # dispatched. Staging only: `deploy.yml` is a stub until #1418, and
        # no production target exists to deploy to. `change_freeze: false`
        # declares the surface without blocking; set it to true to hold
        # releases.
        constraints:
          allowed_environments: [staging]
          change_freeze: false
        produces:
          - artifact: deployment
        gates:
          - type: approval
            approvals:
              count: 1
              # Forge-verified approver identity (provider-qualified subject),
              # enforced since #4116: an MCP approval must come from a `fishhawk
              # token login` (GitHub device-flow) credential; the static MCP
              # token is refused.
              members: ["github:kuhlman-labs"]
              not: [author, agent]
