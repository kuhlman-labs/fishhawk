id: scenario:issue-5212/runbook-carries-fixup-routing-judgement
statement: The MCP runbook resource carries a fix-up routing section. It covers per-pass sizing, defer vs fix-up after acceptance, the trigger-anchored post-fix-up wait, re-routing a dropped item, closing operator_evidence concerns, confirmed-is-not-a-reproduction, fresh-run recovery, and the refund rule split by shape (no-commit vs death). It also covers git-auth setup failures, naming the minted-token and ambient-fallback credential paths and saying the pass is refunded only when it died category A or C. Nowhere does the runbook still claim a no-op fix-up burns the budget.
verify_hint: 'MCP resources/read of the Fishhawk runbook resource on the localhost preview: find the ''Fix-up routing: sizing, cost and recovery'' section, and search the whole text for ''still burns the''.'
