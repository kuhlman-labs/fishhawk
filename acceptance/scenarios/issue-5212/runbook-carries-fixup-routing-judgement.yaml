    observed_at_record: The section covers sizing, defer vs fix-up, the trigger-anchored three-category wait, dropped-item re-route, closing operator_evidence concerns, confirmed-is-not-a-reproduction, the no-commit vs died refund split (refunded only when it died category A or C), and fresh-run recovery. It covers git-auth fixup_base_git_auth, naming installation_token_received (minted token, source field) and base_auth_token_unavailable (ambient fallback). 'still burns the' is absent.
