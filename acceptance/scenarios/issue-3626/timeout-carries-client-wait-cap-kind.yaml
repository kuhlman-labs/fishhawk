id: scenario:issue-3626/timeout-carries-client-wait-cap-kind
statement: When fishhawk_await_stage's wait cap expires while the awaited stage is still unsettled and within its agent budget, the tool result carries status "timeout" together with timeout_kind "client_wait_cap", so a caller learns from a structured field — not from the message prose — that nothing has failed.
verify_hint: Against the localhost preview's MCP surface, call the fishhawk_await_stage tool on a run whose awaited stage has not been dispatched (still pending) with a small timeout_seconds; the returned MCP tool result JSON carries status "timeout" and timeout_kind "client_wait_cap".
steps: POST /v0/dev/fixtures {"scenario":"trace-upload-target"} (run d842e631-3768-4b43-a14b-c735c716ae06, plan stage state dispatched). POST /v0/runs/{run}/signing-key, POST /v0/dev/sign over '{}', and POST /v0/runs/{run}/mcp-token to get an fhm_ bearer. POST /mcp tools/call fishhawk_await_stage {run_id, stage:'plan', timeout_seconds:5}.
assertions:
    expected: status timeout with timeout_kind client_wait_cap.
    observed_at_record: status=timeout, timeout_kind=client_wait_cap, terminal=false, waited_seconds 5.02. The message says the caller's wait cap expired and that a health read shows 895s of budget remaining.
    repro_handle: POST http://localhost:8090/mcp tools/call fishhawk_await_stage {"run_id":"<trace-upload-target run>","stage":"plan","timeout_seconds":5}
