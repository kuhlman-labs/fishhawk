id: scenario:issue-4234/hold-dispatch-operator-only
statement: hold_dispatch true is refused 403 for a run-bound token (run_token_forbidden) and for a delegated operator-agent token (operator_agent_forbidden); the same verb without hold_dispatch is not refused for the operator-agent token.
verify_hint: 'HTTP: POST the hotfix route with hold_dispatch true using each token kind; observe the two 403 codes. Decided in-suite by the per-token tests in campaign_hotfix_test.go if the preview cannot mint those tokens.'
steps: 'Target: called the MCP fishhawk_campaign_hotfix tool with hold_dispatch true using the run-bound fhm_ token; it was refused at the scope check (insufficient_scope). Posture B, in the sanctioned checkout: go test ./internal/server/ -run ''TestCampaignHotfix_(RunTokenForbidden|OperatorAgentForbidden)''.'
