id: scenario:issue-5489/heartbeat-route-refuses-unauthenticated
statement: 'The heartbeat route exists and is guarded: an unauthenticated POST /v0/host-dispatchers/heartbeat with a well-formed heartbeat body answers 401 with error code authentication_required.'
verify_hint: 'HTTP: POST /v0/host-dispatchers/heartbeat with no Authorization header and a body such as {"interval_seconds":30,"started_at":"2026-11-23T00:00:00Z","last_tick_at":"2026-11-23T00:00:00Z","paused":false,"spawns_today":0,"in_flight":0}; expect status 401 and error.code authentication_required (a 404 means the route is not registered).'
steps: 'POST http://localhost:8090/v0/host-dispatchers/heartbeat with no Authorization header, Content-Type application/json and body {"interval_seconds":30,"started_at":"2026-11-23T00:00:00Z","last_tick_at":"2026-11-23T00:00:00Z","paused":false,"spawns_today":0,"in_flight":0}. Control: the same POST to /v0/host-dispatchers/heartbeatx, a path that is not registered.'
assertions:
    expected: 401 authentication_required, not 404
    observed_at_record: 401 {"error":{"code":"authentication_required","message":"an authenticated token is required"}}; the control returned 404. Separately, a dispatcher built from this tree with a fictional token logged 'heartbeat publish failed ... HTTP 401 (authentication_required)'.
    repro_handle: 'curl -s -X POST -H ''Content-Type: application/json'' -d ''{"interval_seconds":30,"started_at":"2026-11-23T00:00:00Z","last_tick_at":"2026-11-23T00:00:00Z","paused":false,"spawns_today":0,"in_flight":0}'' http://localhost:8090/v0/host-dispatchers/heartbeat'
