id: scenario:issue-5554/held-oversized-line-reports-running
statement: A signed trace upload for a running implement stage, with a readable bundle whose manifest sets push_and_open_pr, one event line over 4 MiB and a non-empty git_diff, returns 202 with stage_state running and no stage_failure_kind. The stage stays running, held for its pull-request report, rather than advancing or failing.
verify_hint: Use the same dev-fixture signing recipe as trace-time-failure-names-verify-pin, with a repetitive ~5 MiB event line that gzips small and stays under the sign route's cap. Check the 202 body and GET /v0/runs/{run_id}/stages.
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"implement-running"}; read run_id and stages.implement. 2) POST /v0/runs/{run_id}/signing-key {}. 3) Built a gzip bundle (5,528 bytes compressed) with three lines. Line 1: a manifest {bundle_schema v1, run_id, stage_id, agent claude-code, push_and_open_pr:true}. Line 2: {"seq":1,"kind":"agent_output","data":{"text":"A"*5242880}}, 5,242,966 bytes. Line 3: a git_diff {files:[{path:README.md,status:M}], patch:<one-line README diff>}. 4) Signed it via POST /v0/dev/sign with X-Fishhawk-Dev-Private-Key. 5) POST /v0/runs/{run_id}/trace?stage_id={implement}&variant=raw with X-Fishhawk-Signature. 6) GET /v0/runs/{run_id}/stages.'
