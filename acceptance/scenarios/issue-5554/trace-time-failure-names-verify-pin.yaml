id: scenario:issue-5554/trace-time-failure-names-verify-pin
statement: 'A signed trace upload for a running implement stage whose bundle manifest declares verify_pin_head_sha as a 40-hex SHA, and whose second line is malformed, returns 202 with stage_state failed and stage_failure_kind trace_rejected. The stage reads back failed category C with a failure_reason that starts with bundle_unreadable: and ends with ''; verified head <sha> pinned at refs/fishhawk/checkpoints/<run_id>/<stage_id>-verify''.'
verify_hint: Seed the implement-running dev fixture, then POST /v0/runs/{run_id}/signing-key. Sign a hand-built gzip bundle (valid manifest line with verify_pin_head_sha, malformed line 2) via POST /v0/dev/sign and POST it to /v0/runs/{run_id}/trace?stage_id=…&variant=raw. Read the 202 body's stage_state and stage_failure_kind, then GET /v0/runs/{run_id}/stages for state, failure_category and failure_reason.
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"implement-running"}; read run_id and stages.implement from the 201. 2) POST /v0/runs/{run_id}/signing-key {} and read private_key. 3) Built a gzip JSONL bundle. Line 1: {"seq":0,"ts":"2026-11-28T00:00:00Z","kind":"manifest","data":{"bundle_schema":"v1","run_id":<run>,"stage_id":<implement>,"agent":"claude-code","push_and_open_pr":true,"verify_pin_head_sha":"a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"}}. Line 2, malformed: ''{"seq":1,"ts":"2026-11-28T00:00:01Z","kind":"git_diff","data":{THIS IS NOT JSON''. 4) POST /v0/dev/sign with the bundle bytes as the body and header X-Fishhawk-Dev-Private-Key; read signature. 5) POST /v0/runs/{run_id}/trace?stage_id={implement}&variant=raw with X-Fishhawk-Signature and the bundle bytes. 6) GET /v0/runs/{run_id}/stages and read the implement item.'
assertions:
    expected: '202 with stage_state failed and kind trace_rejected; the stage failed C; the reason starts with bundle_unreadable: and ends with the verify-pin clause naming <run_id>/<stage_id>-verify'
    observed_at_record: 'The trace answered 202 {"stage_state":"failed","stage_failure_kind":"trace_rejected"}. The implement stage reads failed, category C. Its failure_reason starts ''bundle_unreadable: the implement trace bundle could not be read (bundle: parse line: invalid JSON)...'' and ends ''; verified head a1b2c3d4e5f60718293a4b5c6d7e8f9012345678 pinned at refs/fishhawk/checkpoints/2e528941-50dc-4dd0-b4a3-16574fef6831/e5fc643e-fa5f-452a-827d-a639805dff9e-verify''. Both the startswith and endswith checks returned True.'
    repro_handle: python3 -I /tmp/fhacc5554/main.py
