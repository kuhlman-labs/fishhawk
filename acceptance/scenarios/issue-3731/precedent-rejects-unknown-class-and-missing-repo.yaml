id: scenario:issue-3731/precedent-rejects-unknown-class-and-missing-repo
statement: A request omitting the repository, or naming a decision class outside the closed nine-member set, is refused with 400 and an error naming the offending parameter and the accepted values.
verify_hint: 'HTTP: GET /v0/precedent without repo returns 400; GET /v0/precedent?repo=<r>&decision_class=not_a_class returns 400 with a body naming the accepted class values.'
steps: GET /v0/precedent?decision_class=plan_approval (no repo); GET /v0/precedent?repo=kuhlman-labs/fishhawk&decision_class=not_a_class; GET /v0/precedent?repo=kuhlman-labs/fishhawk (no class).
assertions:
    expected: 400 naming the offending parameter and the accepted values.
    observed_at_record: 'No repo: 400 validation_failed ''repo is required …'', details.field=repo. Unknown class: 400 validation_failed, details {field: decision_class, got: not_a_class, accepted: [acceptance_arbitration, clarification, concern_addressed_by_condition, concern_defer, concern_waive, grooming_disposition, merge_verdict, plan_approval, scope_amendment]}. Missing class: 400 with the same accepted list.'
    repro_handle: curl -s 'http://localhost:8090/v0/precedent?repo=kuhlman-labs/fishhawk&decision_class=not_a_class'
