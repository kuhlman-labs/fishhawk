id: scenario:issue-3731/precedent-route-serves-ranked-set
statement: A GET request to /v0/precedent naming a repository and a valid decision class returns 200 with a body carrying resolved_context, a summary block (count, human, delegated, agreement_ratio, doctrine_versions) and a results array, each result citing its source_sequence and entry_hash.
verify_hint: 'HTTP: GET /v0/precedent?repo=<owner/name>&decision_class=plan_approval on the localhost preview returns 200 and the body carries resolved_context, summary and results.'
steps: GET http://localhost:8090/v0/precedent?repo=kuhlman-labs/fishhawk&decision_class=plan_approval with no bearer. Also tried POST /v0/stages/{plan}/approvals on a seeded plan-gate-parked run to get a live indexed decision; it returned 401 because an operator bearer is required and could not be minted.
assertions:
    expected: 200 with resolved_context, a summary block and a results array.
    observed_at_record: 200 with resolved_context{repo, decision_class, touched_paths, touched_paths_total, escalation_keys, escalation_keys_total}, summary{count, human, delegated, agreement_ratio, doctrine_versions, hard_filter_only}, results [], truncated false, degraded [no_indexed_decisions]. The live index is empty, so no result item was available for checking source_sequence/entry_hash citations. The MCP tool's outputSchema and the in-repo tests declare them.
    repro_handle: curl 'http://localhost:8090/v0/precedent?repo=kuhlman-labs/fishhawk&decision_class=plan_approval'
