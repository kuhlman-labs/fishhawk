id: scenario:issue-5214/start-run-description-pins-spec-and-capture
statement: In the MCP tools/list result, the fishhawk_start_run description states that the workflow spec is fixed for the run's life and that the issue context, comments included, is captured at creation and never re-read. It names cancelling and restarting the run for a late comment before the plan is dispatched, and fishhawk_reject_plan or fishhawk_revise_plan once a plan exists.
verify_hint: 'MCP tool result: the tools/list response from a fishhawk-mcp stdio session (the hermetic equivalent is the in-process ListTools harness in backend/internal/mcpserver/tools_test.go).'
steps: Built fishhawk-mcp from the sanctioned tree (cd backend && go build -o /tmp/fhacc5214/ ./cmd/fishhawk-mcp). Ran it over stdio with env -i PATH, an empty HOME, FISHHAWK_API_TOKEN=fictional-acceptance-token-not-real and FISHHAWK_BACKEND_URL=http://127.0.0.1:9. Sent initialize, notifications/initialized and tools/list as JSON-RPC lines, then read the fishhawk_start_run description.
assertions:
    expected: The description states the spec is fixed for the run's life and that issue context, comments included, is captured at creation and never re-read. It names cancel-and-restart before plan dispatch, and reject_plan or revise_plan once a plan exists.
    observed_at_record: 'The description says: ''The workflow spec bytes are pinned at creation and fixed for the run''s life, so a later .fishhawk/workflows.yaml edit needs a new run. The issue title, body and comments are captured into issue_context at this call, and later stages read that snapshot, never re-reading the issue. A comment posted after this call never reaches the planner: cancel and restart the run before dispatching the plan. Once a plan exists, steer with fishhawk_reject_plan or fishhawk_revise_plan instead.'''
    repro_handle: printf initialize/initialized/tools/list | env -i PATH=/usr/bin:/bin HOME=$(mktemp -d) FISHHAWK_API_TOKEN=fictional FISHHAWK_BACKEND_URL=http://127.0.0.1:9 fishhawk-mcp
