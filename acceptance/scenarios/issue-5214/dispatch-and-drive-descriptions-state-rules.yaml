id: scenario:issue-5214/dispatch-and-drive-descriptions-state-rules
statement: 'In the MCP tools/list result, the fishhawk_dispatch_stage description states that plan stages join no concurrency group by default and may overlap. The fishhawk_drive_run description states that a refused or errored tool call mid-drive is a state signal: re-read run status and keep driving.'
verify_hint: 'MCP tool result: the tools/list response from a fishhawk-mcp stdio session (in-process ListTools harness in dispatch_stage_test.go and drive_run_test.go).'
steps: Built fishhawk-mcp from the sanctioned tree and ran a stdio tools/list (env -i, fictional token, closed backend port). Read the descriptions of fishhawk_dispatch_stage and fishhawk_drive_run.
assertions:
    expected: 'Plan stages join no concurrency group by default and may overlap; an error mid-drive is a state signal: re-read status and keep driving.'
    observed_at_record: 'dispatch_stage says: ''Only a local implement stage joins a default group: plan, review and acceptance stages join no concurrency group unless the workflow spec declares a stage concurrency block, so plan stages may overlap each other and a running implement (#5214).'' drive_run says: ''A refused or errored tool call mid-drive (this verb''s own error, or a 409 from a verb you call between drives) is a STATE signal, not a stop condition: re-read fishhawk_get_run_status and act on its next_actions before ending the turn (#5214).'''
    repro_handle: fishhawk-mcp stdio tools/list
