id: scenario:issue-2787/null-reason-on-undecidable-row-refused
statement: '`POST /v0/runs/{run_id}/acceptance?stage_id={acceptance_stage_id}` with `{"verdict":"passed","criteria":[{"id":"c1","result":"undecidable","undecidable_reason":null}]}` returns HTTP 400 `acceptance_invalid` and the error details name that `undecidable_reason` must be a JSON string.'
verify_hint: 'HTTP: POST the body; assert status 400, `acceptance_invalid` in the body, and the details/message mentioning ''must be a JSON string''.'
steps: 'Same run/stage/signing key as above. POST /v0/dev/sign over the exact bytes {"verdict":"passed","criteria":[{"id":"c1","result":"undecidable","undecidable_reason":null}]}; POST /v0/runs/{run}/acceptance?stage_id={acc} with X-Fishhawk-Signature and that body. Control on a separate fresh acceptance-dispatched seed: the same row with undecidable_reason:''the instrument needed is unavailable'' -> 201 effective_verdict undecidable.'
assertions:
    expected: HTTP 400 acceptance_invalid; details name that undecidable_reason must be a JSON string.
    observed_at_record: HTTP 400 {error:{code:acceptance_invalid, message:'acceptance body missing or malformed fields', details:{error:'criteria[0].undecidable_reason must be a JSON string when result is undecidable, got null'}}}.
