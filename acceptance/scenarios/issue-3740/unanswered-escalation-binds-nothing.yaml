id: scenario:issue-3740/unanswered-escalation-binds-nothing
statement: While a crew escalation is still open, no rendered stage prompt carries its text as binding instruction; once the captain decides it, the same prompt carries the captain's decision and reason as captain-authored binding text.
verify_hint: 'A rendered prompt: GET /v0/stages/{stage_id}/prompt for the plan stage contains NO "Captain''s ruling on an escalated disagreement" section and none of the escalation''s payload text while the escalation is open; after POST /v0/crew-messages/{sequence}/escalation-decision the same route''s body contains that section carrying the captain''s decision and reason. Decided by TestPlanPrompt_OpenEscalationRendersNoBindingText and TestPlanPrompt_DecidedEscalationRendersCaptainRuling.'
steps: 'POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"} -> run R, plan stage P. Mint the fhm_ run token (signing-key, /v0/dev/sign over ''{}'', mcp-token) and an operator bearer (write:stages) via psql. fhm_ POST /v0/crew-messages root escalation 18 with payload summary/tradeoffs/recommended_default marked ACC3740-SUMMARY / ACC3740-TRADEOFFS / ACC3740-RECDEFAULT. While it is open: POST /v0/dev/sign over ''prompt:P'', then GET /v0/stages/P/prompt with X-Fishhawk-Signature. Operator POST /v0/crew-messages/18/escalation-decision {decision accepted, reason ''ACC3740-CAPTAIN-REASON keep the retry cap at two''}. Re-sign and GET /v0/stages/P/prompt.'
assertions:
    expected: No binding section or payload text while open; after the decision, the section carries the captain's decision and reason.
    observed_at_record: 'Before: 200, no "Captain''s ruling on an escalated disagreement" section and none of the ACC3740 payload strings (prompt sha256 6b93eb4b...). Decide -> 200 state accepted, disposition_sequence 23. After: 200 with ''### Captain''s ruling on an escalated disagreement (binding)'' and ''- crew message 18: **accepted** — ACC3740-CAPTAIN-REASON keep the retry cap at two''. The agent-authored summary, tradeoffs and recommended default still do not appear (sha256 1e23c954...).'
    repro_handle: signed GET localhost:8090/v0/stages/<P>/prompt before and after POST /v0/crew-messages/<seq>/escalation-decision
