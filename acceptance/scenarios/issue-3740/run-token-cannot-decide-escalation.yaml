id: scenario:issue-3740/run-token-cannot-decide-escalation
statement: A run-bound agent token cannot decide a crew escalation, and a refused attempt leaves the escalation still open.
verify_hint: 'An HTTP route/response/status code: POST /v0/crew-messages/{sequence}/escalation-decision with a run-bound token returns 403 self_decision, and a subsequent GET /v0/crew-messages/{sequence} still reports state open. Decided by TestDecideCrewEscalation_RunTokenRefusedAndRecordsNothing (the state read after the refusal is the part error identity alone cannot prove).'
steps: POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"} -> run R. Mint the fhm_ run token (signing-key, /v0/dev/sign over '{}', mcp-token) and an operator bearer via psql. fhm_ POST /v0/crew-messages root escalation (seq 18). GET /v0/crew-messages/18 (operator); fhm_ POST /v0/crew-messages/18/escalation-decision {decision accepted, reason} and {decision rejected, reason}; GET /v0/crew-messages/18; GET /v0/runs/R/audit.
