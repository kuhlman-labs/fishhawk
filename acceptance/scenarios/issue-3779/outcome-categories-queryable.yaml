id: scenario:issue-3779/outcome-categories-queryable
statement: The audit read surface accepts both new categories as known. GET /v0/runs/{run_id}/audit?category=run_merge_reverted and ?category=run_merge_ci_observed, without allow_unknown, return 200 rather than the 400 validation_failed unknown-category refusal.
