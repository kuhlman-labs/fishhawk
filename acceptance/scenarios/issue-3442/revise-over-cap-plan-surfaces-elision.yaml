id: scenario:issue-3442/revise-over-cap-plan-surfaces-elision
statement: Revising a plan stage whose stored plan artifact serializes to more than 60000 bytes returns 200 with a `revision_base` object whose `elided` is true, `mode` is `digest` (or `digest_shrunk`), `cap_bytes` is 60000, `original_bytes` exceeds the cap, `rendered_bytes + elided_bytes == original_bytes`, and `elisions` names at least one field with its byte accounting; the run's audit log carries a `plan_revised` entry whose payload has the same `revision_base` object.
verify_hint: POST /v0/stages/{stage_id}/revise on a run whose plan stage is parked at awaiting_approval with a >60000-byte standard_v1 plan artifact; inspect the 200 body's revision_base, then GET /v0/runs/{run_id}/audit?category=plan_revised and read payload.revision_base. The fishhawk_revise_plan MCP tool result exposes the same object under revision_base plus a warnings line.
steps: 'REST leg: POST /v0/runs (feature_change, runner_kind local, three-stage spec) with an operator bearer minted via `fishhawkd token issue` on the preview DB; POST /v0/runs/{run}/signing-key; signed GET /v0/stages/{plan}/prompt (running); signed POST /v0/runs/{run}/plan?stage_id={plan} with a standard_v1 plan of 30 approach steps (~2600 bytes each), a ~3200-byte summary and a ~3400-byte test_strategy — 87249 bytes serialized, sha256 83704f57… — -> 201; waited for awaiting_approval. POST /v0/stages/{plan}/revise {constraint: ''Keep every approach step but fold steps 3 and 10 into one; ...''} with the bearer. GET /v0/runs/{run}/audit?category=plan_revised. After the re-dispatch, GET /v0/stages/{plan}/prompt-render. MCP leg: parked a second identical 87249-byte plan on a fresh run and called POST /mcp tools/call fishhawk_revise_plan {run_id, constraint} (headers Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/call, Mcp-Name fishhawk_revise_plan); GET that run''s audit?category=plan_revised.'
assertions:
    expected: 200 with revision_base.elided true, mode digest or digest_shrunk, cap_bytes 60000, original_bytes > cap, rendered_bytes + elided_bytes == original_bytes, elisions naming at least one field with byte accounting; plan_revised audit payload carries the same revision_base; fishhawk_revise_plan exposes the same object plus a warnings line.
    observed_at_record: 'REST: 200 with revision_base {original_bytes 87249, cap_bytes 60000, elided true, mode digest_shrunk, rendered_bytes 265, elided_bytes 86984 (265+86984==87249), elisions [summary 120 shown/3075 dropped, approach step 1..N body 0 shown/2608-2609 dropped, ...] plus unrendered_keys}; the single plan_revised audit entry''s payload.revision_base is deep-equal to the response object; the re-dispatched prompt says ''The prior plan is 87249 bytes — over the 60000-byte revision-base cap — so it is NOT inlined whole. What follows is a STEP-COMPLETE DIGEST'' and instructs recording the gap in risks_and_assumptions. MCP: structuredContent.revision_base has the identical shape/figures (elided true, digest_shrunk, 87249/265/86984, named elisions), structuredContent.warnings = [''WARNING — revision base elided: the prior plan is 87249 bytes, over the 60000-byte revision-base cap; the re-plan agent receives a SHRUNKEN step-complete digest with step and criterion bodies withheld (265 rendered / 86984 elided bytes) ... Named elisions: summary: 120 of 3195 bytes shown; approach step 1 body: 0 of 2608 bytes shown; ... 27 more. Top-level keys not rendered: generated_by, ticket_reference ...''], the same text is a WARNING text content item, and that run''s plan_revised payload.revision_base equals it.'
    repro_handle: ship an 87 KB standard_v1 plan to a parked plan stage, then POST /v0/stages/{plan}/revise {"constraint":"..."} (bearer with write:approvals); GET /v0/runs/{run}/audit?category=plan_revised; POST /mcp tools/call fishhawk_revise_plan {run_id, constraint}
