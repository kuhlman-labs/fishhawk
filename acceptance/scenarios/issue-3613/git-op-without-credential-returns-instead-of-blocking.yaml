id: scenario:issue-3613/git-op-without-credential-returns-instead-of-blocking
statement: A git operation run with the non-interactive environment this change ships, against a loopback endpoint that offers no usable credential, TERMINATES on its own with a non-zero exit status and a diagnostic naming git's refusal to prompt for a terminal credential, well inside a generous wall-clock ceiling — it does not block waiting for input and leaves no stopped process behind. No live forge, network egress, or deployed environment is required.
verify_hint: 'CLI exit code + stderr, on the localhost sandbox, no forge needed. Read the two variables the shipped gitops.NonInteractiveEnv() returns out of runner/internal/gitops/commit.go (follow the code, do not hardcode a copy), then run a remote git read against an endpoint that cannot grant credentials — either a loopback HTTP listener answering 401, or a loopback port with no listener — with exactly those variables set and no credential helper configured (GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM pointed at an empty file). Observe: the command exits non-zero, its stderr names the terminal-prompt refusal (git''s `terminal prompts disabled` wording) or an immediate connection failure, and it returns well within a generous ceiling (on the order of a minute; do not assert a tight duration). Then re-run the same command with the non-interactive variables UNSET against the 401 endpoint only if no tty is attached — if one is, skip that arm and say so, because an unpinned git will block on the prompt by design.'
steps: 'This is a repository-local sandbox check, as the verify_hint prescribes; the running target has no surface for a git subprocess. (1) Read the pins by running the shipped function: a go -overlay main (the overlay file lives in /tmp, so the checkout is unmodified) in the runner module of the sanctioned checkout (HEAD 2491128b) printed gitops.NonInteractiveEnv() = GIT_TERMINAL_PROMPT=0, GIT_ASKPASS=/bin/false. (2) The sandbox forbids direct loopback TCP, so a plain 127.0.0.1 listener gave connection refused. I observed that arm and discarded it per approval condition 1. Instead, a Python SOCKS5 responder on unix socket /tmp/fh3613/c1/s.sock answers every HTTP request with 401 + `WWW-Authenticate: Basic`, and git reaches it via http_proxy=socks5h://localhost/tmp/fh3613/c1/s.sock. (3) Environment: GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM point at an empty file, GIT_CONFIG_NOSYSTEM=1, no credential helper, inherited GIT_ASKPASS/SSH_ASKPASS/GIT_TERMINAL_PROMPT unset, and exactly the two pins exported. With that, I ran `git ls-remote`, `git fetch` and `git push` against http://git.fh3613.test/gl-demo-ultimate-bkuhlman/feedback-agent, each under a 60 s alarm ceiling. (4) Variants: GIT_TERMINAL_PROMPT=0 alone, and GIT_ASKPASS set to a missing program. (5) Unpinned arm: `tty` reports ''not a tty'', so I ran it. (6) Supporting: `go test ./internal/gitops -run TestRunOutEnv_PinsNonInteractive` and, with FISHHAWK_FORGE_WRITES unset, the per-forge remote URL tests and the no-hardcode tripwire in ./cmd/fishhawk-runner.'
assertions:
    expected: 'Against a listener that challenges for credentials: non-zero exit promptly, stderr naming ''terminal prompts disabled'', and no stopped process.'
    observed_at_record: 'The responder log shows every git op reached the 401 challenge (info/refs for git-upload-pack and git-receive-pack, no Authorization header). Pinned ls-remote, fetch and push each exited 128 in 28-30 ms with `fatal: could not read Username for ''http://git.fh3613.test'': terminal prompts disabled`. That line was preceded by `cannot exec ''/bin/false''` because this macOS host has no /bin/false; the load-bearing GIT_TERMINAL_PROMPT=0 carried it, as the doc comment says. GIT_TERMINAL_PROMPT=0 alone exited 128 in 26 ms with the same refusal. Unpinned with no tty exited 128 in 30 ms with ''Device not configured''. No lingering git processes. All runner tests passed. The four hardcoded github.com sites are replaced by remoteurl.go, and the commit.go assumption comment is gone.'
    repro_handle: cd /tmp/fh3613/c1 && python3 socks401.py $PWD/s.sock & http_proxy=socks5h://localhost/tmp/fh3613/c1/s.sock GIT_CONFIG_GLOBAL=empty.gitconfig GIT_CONFIG_SYSTEM=empty.gitconfig GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git ls-remote http://git.fh3613.test/gl-demo-ultimate-bkuhlman/feedback-agent main; echo $?
