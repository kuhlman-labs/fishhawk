id: scenario:issue-5402/status-cli-reports-run-refusals
statement: '`fishhawk-mcp host-dispatch --status --state-dir <dir>`, run against a status.json whose last_tick_at and last_complete_tick_at are current and whose run_refusals holds two entries, exits 0 and prints a single stdout line containing `state=live` and `run_refusals=2`.'
verify_hint: 'CLI: write <dir>/status.json (mode 0600, dir 0700) with last_tick_at and last_complete_tick_at = now, interval_seconds 30 and a two-entry run_refusals object, then run the binary and read its exit code and stdout.'
steps: Built fishhawk-mcp from the sanctioned checkout (cd backend && go build ./cmd/fishhawk-mcp). Created dir /tmp/fhacc5402/s1 (mode 0700). Wrote status.json (mode 0600) with pid 7, last_tick_at and last_complete_tick_at = now, interval_seconds 30, spawns_today 1, spawns_day today, and run_refusals with two entries keyed by run id (codes cap_reached:daily and working_dir_absent, each with stage_id, first_at and last_at). Ran fishhawk-mcp host-dispatch --status --state-dir /tmp/fhacc5402/s1.
assertions:
    expected: exit 0; one line containing state=live and run_refusals=2
    observed_at_record: 'exit 0; one stdout line: state=live pid=7 host= last_tick_at=... paused=false in_flight=0 spawns_today=1 (2026-11-21) last_complete_tick_at=... run_refusals=2'
    repro_handle: fishhawk-mcp host-dispatch --status --state-dir /tmp/fhacc5402/s1
