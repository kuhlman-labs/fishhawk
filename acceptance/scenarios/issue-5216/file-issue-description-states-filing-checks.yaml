id: scenario:issue-5216/file-issue-description-states-filing-checks
statement: The fishhawk_file_issue tool description served by tools/list states that a degraded intake (or scanned_items 0) means duplicate detection was not performed and the operator must search manually, names fishhawk_get_campaign_status for a running campaign's items, tells the operator to search existing decision records and epics before filing an adr or epic, says to create the successor epic before the parent reaches the child cap, and says the default delegation-tier label is not a triage decision.
