id: scenario:issue-4046/runner-startup-records-credential-posture
statement: The startup gate_isolation_configured stderr line carries credentials anonymous when the variable is unset, and operator_config when it names a valid config dir.
verify_hint: CLI stderr gate_isolation_configured line.
steps: Using the same runner binary, ran env -u FISHHAWK_FORGE_WRITES -u DOCKER_CONFIG fishhawk-runner --run-id 11111111-2222-3333-4444-555555555555 --backend-url http://127.0.0.1:1 --workflow feature_change --stage plan, (a) with FISHHAWK_GATE_DOCKER_CONFIG unset and (b) with FISHHAWK_GATE_DOCKER_CONFIG=/tmp/fh4046/good, a dir holding config.json {"auths":{}}. Grepped the gate_isolation_configured stderr line.
assertions:
    expected: credentials anonymous when unset, operator_config when it names a valid config dir
    observed_at_record: (a) {"event":"gate_isolation_configured","mode":"auto","profile":"local",...,"credentials":"anonymous",...}; (b) the same line with "credentials":"operator_config".
    repro_handle: FISHHAWK_GATE_DOCKER_CONFIG=/tmp/fh4046/good fishhawk-runner ... 2>&1 | grep gate_isolation_configured
