id: scenario:issue-4046/audit-row-records-credentials
statement: A signed raw trace bundle whose gate_evidence.gate_isolation member carries credentials yields a gate_isolation_recorded audit row whose payload carries the same value.
verify_hint: |-
    Persisted audit row, driven through HTTP:
    1. POST /v0/dev/fixtures with trace-upload-target.
    2. POST /v0/runs/{run_id}/signing-key.
    3. Build a gzipped JSONL bundle with a gate_evidence line carrying credentials operator_config.
    4. Sign it with POST /v0/dev/sign.
    5. POST /v0/runs/{run_id}/trace?variant=raw and expect 202.
    6. GET /v0/runs/{run_id}/audit and read the gate_isolation_recorded payload's credentials.
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"} -> run 29e1a46b-5502-407a-8892-de806c226396, plan stage 65f7a627-9816-4d6e-8beb-dde6b1b39eaa. 2) POST /v0/runs/{run}/signing-key. 3) Built a gzipped JSONL bundle: line 1 {seq:1, kind:manifest, data:{bundle_schema:v1}}; line 2 {seq:2, kind:gate_evidence, data:{gate_isolation:<testdata/wire/gate_isolation_evidence.json container_declared member, credentials operator_config>}}. Built a second bundle from the ''container'' member (credentials anonymous). 4) Signed each via POST /v0/dev/sign with X-Fishhawk-Dev-Private-Key. 5) POST /v0/runs/{run}/trace?stage_id={plan}&variant=raw with X-Fishhawk-Signature, once per bundle. 6) GET /v0/runs/{run}/audit?category=gate_isolation_recorded with an operator bearer.'
assertions:
    expected: gate_isolation_recorded audit row payload carries the same credentials value
    observed_at_record: 'Both uploads returned 202 (content hashes 149fa94e... and 4a1239b4...). The audit has two gate_isolation_recorded rows: payload.credentials=operator_config (class container, image_source stage, content_hash 149fa94e...) and payload.credentials=anonymous (content_hash 4a1239b4...).'
    repro_handle: GET http://localhost:8090/v0/runs/29e1a46b-5502-407a-8892-de806c226396/audit?category=gate_isolation_recorded
