id: scenario:issue-4526/host-dispatch-status-reports
statement: '`fishhawk-mcp host-dispatch --status` reports paused state, last tick time, last refusal code and spawns today from the dispatcher''s status file, and exits non-zero when no live dispatcher status exists.'
verify_hint: 'CLI: --status against an empty --state-dir exits non-zero naming no dispatcher; after `--pause` and one dispatcher start against that state dir (it writes a paused status and keeps ticking), --status exits 0 and prints paused and the tick time.'
steps: Built fishhawk-mcp from the sanctioned tree. mkdir -m700 /tmp/fhacc4526/emptysd. Every call used env -i PATH=/usr/bin:/bin HOME=/tmp/fhacc4526/home FISHHAWK_BACKEND_URL=http://localhost:8090 FISHHAWK_API_TOKEN=fictional-acceptance-token-not-real fishhawk-mcp host-dispatch --allowed-roots /tmp/fhacc4526/roots --state-dir /tmp/fhacc4526/emptysd. 1) --status. 2) --pause. 3) Started a dispatcher in the background with --interval 2s --runner-binary <stub that logs invocations>; after ~6s ran --status. 4) Started a second dispatcher on the same state dir. 5) --resume, waited 5s, ran --status again; then killed the dispatcher.
assertions:
    expected: non-zero with no status; exit 0 printing paused and the tick time after a pause and a start
    observed_at_record: '1) exit 1, ''no dispatcher status in /tmp/fhacc4526/emptysd (not running?)''. 3) exit 0, ''state=paused pid=37020 host=... last_tick_at=2026-11-13T05:12:35Z paused=true in_flight=0 spawns_today=0''. 4) exit 1, ''state_dir_locked: another dispatcher (pid 37020) holds .../lock''. 5) ''state=live ... paused=false spawns_today=0 (2026-11-13)''. The stub runner was never invoked. No refusal occurred, so no last_refusal field was printed; the status output prints last_refusal=<code> whenever one is recorded.'
    repro_handle: fishhawk-mcp host-dispatch --allowed-roots /tmp/r --state-dir /tmp/s --status
