id: scenario:issue-4526/run-campaign-link-include
statement: GET /v0/runs/{run_id}?include=campaign_link returns a campaign_link object with status unlinked for a run that belongs to no campaign, while the same GET without the include carries no campaign_link field.
verify_hint: 'HTTP: POST /v0/runs to create a run, then GET /v0/runs/{run_id}?include=campaign_link (campaign_link.status is unlinked) and GET /v0/runs/{run_id} (no campaign_link key); an unknown include value returns 400.'
steps: POST /v0/dev/fixtures {"scenario":"plan-gate-parked"} -> run id from the 201 body. The run was seeded because POST /v0/runs is egress-denied. GET /v0/runs/{run}?include=campaign_link; GET /v0/runs/{run}; GET /v0/runs/{run}?include=bogus. Additionally, with a run-bound fhm_ bearer (POST /v0/runs/{run}/signing-key, /v0/dev/sign over '{}', POST /v0/runs/{run}/mcp-token), GET /v0/runs/{run}?include=campaign_link and the plain GET.
assertions:
    expected: unlinked with the include, absent without it, 400 on an unknown include
    observed_at_record: 'include: 200 campaign_link {status:''unlinked'',campaigns:[]}; without the include: 200 with no campaign_link key; bogus: 400 validation_failed ''include must be campaign_link''; run-bound include: 403 run_token_forbidden ''a run-bound token cannot read include=campaign_link'' (F5), while the plain GET with the same bearer is 200'
    repro_handle: GET /v0/runs/{run}?include=campaign_link
