id: scenario:issue-3718/charter-skeleton-carries-no-direction-text
statement: 'In a fresh temporary git repository, after `fishhawk init`, every section and rubric-row body in the written .fishhawk/charter.md is a fill-me-in marker: the file contains no substantive north-star, phase, non-goal or rubric direction text, and its header states it is human-authored.'
