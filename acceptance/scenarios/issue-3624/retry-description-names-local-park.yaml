id: scenario:issue-3624/retry-description-names-local-park
statement: 'The fishhawk_retry_stage tool advertised by the running server describes the runner_kind local outcome honestly: its description names the awaiting_host_dispatch park and the follow-on dispatch verb, while still naming workflow_dispatch for the CI execution channels.'
verify_hint: 'On the localhost preview, list the MCP tool registry over the /mcp route (a tools/list request to POST /mcp) and read the fishhawk_retry_stage entry''s description: it must contain ''awaiting_host_dispatch'', must name fishhawk_dispatch_stage (or fishhawk_run_stage) as the runner_kind local follow-on, and must still mention workflow_dispatch for github_actions / gitlab_ci.'
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"} -> 201 (run b84d9c51-4991-4235-86d1-6b6d0dae7572). 2) POST /v0/runs/{run}/signing-key -> private_key. 3) POST /v0/dev/sign with body ''{}'' and header X-Fishhawk-Dev-Private-Key -> signature. 4) POST /v0/runs/{run}/mcp-token with body ''{}'' and X-Fishhawk-Signature -> fhm_ bearer. 5) POST /mcp with Authorization: Bearer <fhm_>, Accept: application/json, text/event-stream, Mcp-Protocol-Version: 2026-07-28, Mcp-Method: tools/list, body {jsonrpc:''2.0'',id:1,method:''tools/list'',params:{_meta:{''io.modelcontextprotocol/protocolVersion'':''2026-07-28'',''io.modelcontextprotocol/clientCapabilities'':{},''io.modelcontextprotocol/clientInfo'':{name:''acc'',version:''1''}}}}. 6) Read the fishhawk_retry_stage entry''s description and outputSchema.'
assertions:
    expected: The description contains awaiting_host_dispatch, names fishhawk_dispatch_stage/fishhawk_run_stage as the local follow-on, and still names workflow_dispatch for github_actions/gitlab_ci.
    observed_at_record: '57 tools, served by fishhawk-mcp v0.1.0+b3551866. The description says: ''runner_kind github_actions / gitlab_ci: the orchestrator fires a fresh workflow_dispatch and the stage lands dispatched''. For runner_kind local it says: ''there is NO workflow to dispatch ... the re-opened stage normally parks at awaiting_host_dispatch and NOTHING is driving it until you make a separate fishhawk_dispatch_stage (or fishhawk_run_stage) call — fishhawk_run_children for a decomposition child''. It also lists the pending, awaiting_approval and awaiting_children outcomes, says ''DISPATCH ONLY on awaiting_host_dispatch (or pending)'', and contains no ''always'' claim, as approval condition 2 requires. The outputSchema declares parked (boolean) and next_step (nullable object).'
    repro_handle: POST http://localhost:8090/mcp tools/list (headers above) | jq '.result.tools[]|select(.name=="fishhawk_retry_stage").description'
