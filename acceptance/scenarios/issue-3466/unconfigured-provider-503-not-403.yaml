id: scenario:issue-3466/unconfigured-provider-503-not-403
statement: On a fishhawkd started without any identity provider (no FISHHAWKD_OAUTH_CLIENT_ID and no GitLab identity config), submitting an approval to a stage whose gate declares min_permission or member_of returns HTTP 503 with error code forge_unavailable and details.reason identity_provider_unconfigured (details.retryable false, details.forge naming the run's forge), and the run's audit log carries NO approval_predicate_rejected entry for that submission.
verify_hint: POST /v0/stages/{stage_id}/approvals on the localhost preview; then GET /v0/runs/{run_id}/audit and confirm no approval_predicate_rejected category entry
steps: 'Confirmed the preview `fishhawkd serve` (pid 9402) environment carries only FISHHAWKD_DATABASE_URL, FISHHAWKD_ADDR, FISHHAWKD_DEV_FIXTURES, FISHHAWKD_DEV_STUB_FORGE — no FISHHAWKD_OAUTH_CLIENT_ID and no FISHHAWKD_GITLAB_* (NoOp identity default). With an operator bearer minted via `/tmp/fh-acc-fishhawkd token issue -db <preview db> -subject bootstrap -scopes read:runs,read:audit,write:runs,write:approvals,write:stages,write:retries,write:deploy,write:fixups,write:campaigns`: POST /v0/runs {repo kuhlman-labs/fishhawk, workflow_id feature_change, workflow_sha 523d2790…, trigger_source cli, trigger_ref issue:3, runner_kind local, inline v2 spec whose plan gate is [{type approval, approvals {count 1, min_permission: write}}]} -> 201 run 49a841ea-502c-4251-88b8-66e6640577cb (plan 43a147d7-cfb0-4caa-bc1b-7287b89e9df4); POST /v0/runs/{run}/signing-key; signed GET /v0/stages/{plan}/prompt; signed POST /v0/runs/{run}/plan?stage_id={plan} with a README.md-scoped standard_v1 plan -> 201; polled GET /v0/stages/{plan} to awaiting_approval; GET /v0/runs/{run} (installation_ref null -> github forge). POST /v0/stages/{plan}/approvals {decision approve}. GET /v0/runs/{run}/audit?limit=100 and GET /v0/runs/{run}/audit?category=approval_predicate_rejected; GET /v0/stages/{plan}. Repeated on a second run d275a856-3991-4a13-8509-7d9d3d27ec18 whose gate declares approvals {count 1, member_of: kuhlman-labs/maintainers}.'
assertions:
    expected: HTTP 503 forge_unavailable with details.reason identity_provider_unconfigured, details.retryable false, details.forge naming the run's forge; no approval_predicate_rejected audit entry for the submission.
    observed_at_record: 'min_permission run: 503 {error {code forge_unavailable, message ''no identity provider is configured for the run''s forge, so the gate''s permission/membership predicate cannot be evaluated; the approval gate failed closed'', details {forge github, reason identity_provider_unconfigured, retryable false, predicate min_permission, ref null, stage_id …, next_actions [''Set FISHHAWKD_OAUTH_CLIENT_ID (plus GitHub App credentials for authenticated permission reads) so fishhawkd constructs the GitHub identity provider'']}}}; run audit categories [issue_context_unresolved, plan_generated, plan_scope_precheck, plan_surface_sweep, plan_warnings] — no approval_predicate_rejected (filtered query returned 0 items); stage still awaiting_approval. member_of run: same 503 shape with predicate member_of, ref kuhlman-labs/maintainers, reason identity_provider_unconfigured, retryable false, forge github; 0 approval_predicate_rejected entries; stage still awaiting_approval.'
    repro_handle: POST /v0/stages/43a147d7-cfb0-4caa-bc1b-7287b89e9df4/approvals {"decision":"approve"} with a write:approvals bearer on the NoOp-provider preview; GET /v0/runs/49a841ea-502c-4251-88b8-66e6640577cb/audit?category=approval_predicate_rejected
