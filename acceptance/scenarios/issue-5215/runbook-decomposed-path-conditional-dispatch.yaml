id: scenario:issue-5215/runbook-decomposed-path-conditional-dispatch
statement: The fishhawk://runbook resource's decomposed-parent path says consolidate runs only while the parent is awaiting_children, routes a 409 not_awaiting_children to fishhawk_get_run_status, tells the operator to dispatch a re-opened fan-in verify implement stage (pending or awaiting_host_dispatch) on a local runner before the consolidated review, and warns against hand-pushing a union merge onto the consolidated branch.
verify_hint: 'MCP tool result: read the fishhawk://runbook resource and find the conditional dispatch step, the 409 routing and the union-merge warning in the decomposed-parent section.'
steps: POST /v0/dev/fixtures {"scenario":"trace-upload-target"}; signing-key; dev/sign '{}'; mcp-token -> fhm_; POST /mcp resources/read {uri:fishhawk://runbook} with Mcp-Method resources/read and Mcp-Name fishhawk://runbook. Read the decomposed-parent steps.
assertions:
    expected: conditional consolidate, 409 routing, fan-in verify dispatch and union-merge warning
    observed_at_record: 'Step 3 says to call fishhawk_consolidate_slices only while the stage is still awaiting_children. A ''409 not_awaiting_children ... does not by itself mean success: read fishhawk_get_run_status''. Step 4, ''Dispatch the fan-in verify-only pass when the parent was re-opened for it'', covers a parent reading pending or awaiting_host_dispatch on a local runner, and says to dispatch the pass and await it before the consolidated review. It is followed by ''**Never hand-push a union merge of slice branches onto the consolidated branch and vouch it.**'''
    repro_handle: POST http://localhost:8090/mcp resources/read fishhawk://runbook
