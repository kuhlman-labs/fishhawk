id: scenario:issue-5215/consolidate-description-routes-through-run-status
statement: The fishhawk_consolidate_slices description says the server's event-driven fan-in normally settles the parent. It says a 409 not_awaiting_children does not by itself mean the fan-in succeeded (a slice-conflict failure returns it too), and tells the operator to read fishhawk_get_run_status and dispatch the parent implement stage only when it is pending or awaiting_host_dispatch, naming fishhawk_drive_run as an alternative. It also says a 502 slice_integration_error leaves the parent awaiting_children and is safe to re-invoke.
verify_hint: 'MCP tool result: the served fishhawk_consolidate_slices description carries ''not_awaiting_children'', ''fishhawk_get_run_status'', ''awaiting_host_dispatch'', ''fishhawk_drive_run'' and ''re-invoke'' beside ''slice_integration_error''.'
steps: POST /v0/dev/fixtures {"scenario":"trace-upload-target"}; signing-key; dev/sign '{}'; mcp-token -> fhm_; POST /mcp tools/list (2026-07-28 headers and io.modelcontextprotocol _meta). Read the fishhawk_consolidate_slices description.
assertions:
    expected: all named elements present
    observed_at_record: The description says the server's event-driven fan-in normally integrates and settles the parent. It says not_awaiting_children (409) 'does NOT by itself mean the fan-in succeeded' because a slice-conflict failure returns it too, followed by 'Read fishhawk_get_run_status on the parent'. It says to dispatch the implement stage (fishhawk_dispatch_stage, or let fishhawk_drive_run do it) only when it is pending or awaiting_host_dispatch. On slice_integration_error (502) it says the parent stays awaiting_children and to re-invoke.
