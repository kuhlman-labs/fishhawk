id: scenario:issue-3449/hosted-refusal-single-shot-is-category-c
statement: With a runner started under FISHHAWK_DEPLOYMENT_PROFILE=hosted, no FISHHAWK_GATE_IMAGE, DOCKER_HOST and CONTAINER_HOST pinned to a remote tcp endpoint, and an implement stage whose workflow verify has max_iterations 0 (the default single-shot committed gate), the stage fails with failure category C — not B — and the runner's log carries a gate_isolation_selected event with path refused, a verify_run with outcome failed whose output opens with the gate-isolation-refused signature, and a runner_completed line with category C; the verify command itself never executes.
verify_hint: Observe the runner process's stderr (runner_completed category, gate_isolation_selected path=refused, verify_run outcome=failed) and the stage's failure category on GET /v0/runs/{run_id} / the stage_failed audit row on GET /v0/runs/{run_id}/audit; a marker-writing verify command must leave no marker.
steps: 'Built the runner from the sanctioned checkout (cd runner && go build -o /tmp/fh-acc-runner ./cmd/fishhawk-runner; preview and checkout both serve head c00c4dc5; checkout untouched). Stub agent /tmp/fh-stub-agent (appends a line to README.md in cwd, prints minimal stream-json init+result, exit 0). Throwaway working clone /tmp/fh-acc-work of a local bare origin. DIRECT INVOCATION (precondition): run 81ad0a74-f786-4718-bf40-8e96622e6e90 created via POST /v0/runs with an inline plan(approval)+implement+review spec, plan host-dispatched, signed prompt + README.md-scoped plan shipped, approved; implement 544e880f-e947-4871-94b9-0a27138b4ebc dispatched, spec verify unset. Ran: env -i PATH=$PATH HOME=$HOME FISHHAWK_DEPLOYMENT_PROFILE=hosted DOCKER_HOST=tcp://10.0.0.5:2376 CONTAINER_HOST=tcp://10.0.0.5:2376 FISHHAWK_AGENT_BIN=/tmp/fh-stub-agent ANTHROPIC_API_KEY=dummy /tmp/fh-acc-runner --run-id 81ad0a74-… --backend-url http://localhost:8090 --workflow feature_change --stage implement --stage-id 544e880f-… --working-dir /tmp/fh-acc-work --fetch-prompt --upload-trace --github-repo kuhlman-labs/fishhawk --base-branch main --verify-cmd ''touch /tmp/fh-acc-marker-c1; true'' --verify-max-iterations 0 --bundle-out /tmp/fh-acc-c1-bundle.gz (no FISHHAWK_GATE_IMAGE). REAL DISPATCH PATH: run 43741029-20f9-4dfc-ba1e-33f7f566c6eb whose spec implement executor.verify is {command: ''touch /tmp/fh-acc-marker-hosted; true''} with NO max_iterations; plan approved the same way; POST /mcp tools/call fishhawk_dispatch_stage {run_id, stage_id 6d3e4ee8-3db5-4126-8832-95fe69d79810, workflow feature_change, stage implement, working_dir /tmp/fh-acc-work, github_repo kuhlman-labs/fishhawk, base_branch main, runner_binary /tmp/fh-hosted-runner} (wrapper execs /tmp/fh-acc-runner under the same hosted env); polled GET /v0/stages/{implement}; read the dispatcher log /tmp/fishhawk-runner-43741029-…-6d3e4ee8-….log; GET /v0/runs/{run}/audit?category=dispatch_reaper_failed.'
assertions:
    expected: Stage fails category C (not B); runner log carries gate_isolation_selected path=refused, verify_run outcome=failed whose output opens with the gate-isolation-refused signature, and runner_completed category C; the verify command never executes (no marker).
    observed_at_record: 'Both invocations: runner exit 1; stderr gate_isolation_selected selection.path=refused, profile=hosted, mode=auto, image="", runtime docker safe=false endpoint tcp://10.0.0.5:2376 (reason names the tcp scheme and empty FISHHAWK_GATE_IMAGE); runner_completed {outcome: failed, category: C, reason: ''gitops: verify command failed for an infrastructure reason: gate isolation refused: committed tree verify command "…" was refused by gate isolation: gate isolation refused: profile=hosted refuses every non-container path and the container path is unavailable: …''}. Trace bundle (/tmp/fh-acc-c1-bundle.gz): verify_run {outcome failed, exit_code -1, output opens with ''gate isolation refused: profile=hosted refuses every non-container path…''}; gate_evidence.verify_runs[0] the same. Marker files never created — the verify command never executed. Backend on the dispatch run: GET /v0/stages/6d3e4ee8… -> failed, failure_category C; audit dispatch_reaper_failed {failure_category C, exit_code 1}. Caveat: on the host-dispatch path the backend category is stamped C by the dispatch reaper for ANY non-zero runner exit (pre-existing #1747; also C for the red-tree control), so the backend record does not itself discriminate B from C; the runner''s runner_completed line and the bundle''s verify_run are the discriminating instruments and they say C. The direct-invocation run has no reaper and advanced to succeeded on the no-diff trace path — a bypass artifact, not a category signal.'
    repro_handle: env -i PATH=$PATH HOME=$HOME FISHHAWK_DEPLOYMENT_PROFILE=hosted DOCKER_HOST=tcp://10.0.0.5:2376 CONTAINER_HOST=tcp://10.0.0.5:2376 FISHHAWK_AGENT_BIN=/tmp/fh-stub-agent ANTHROPIC_API_KEY=dummy /tmp/fh-acc-runner --run-id <run> --backend-url http://localhost:8090 --workflow feature_change --stage implement --stage-id <implement> --working-dir /tmp/fh-acc-work --fetch-prompt --upload-trace --github-repo kuhlman-labs/fishhawk --base-branch main --verify-cmd 'touch /tmp/fh-acc-marker-c1; true' --verify-max-iterations 0 --bundle-out /tmp/fh-acc-c1-bundle.gz 2>/tmp/fh-acc-c1-stderr.log; grep runner_completed /tmp/fh-acc-c1-stderr.log; ls /tmp/fh-acc-marker-c1
