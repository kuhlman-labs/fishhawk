id: scenario:issue-3449/red-tree-single-shot-stays-category-b
statement: A genuine verify failure on the single-shot committed gate (a verify command exiting non-zero with ordinary test-failure output, no infra signature, no refusal) still fails the stage with category B.
verify_hint: Observe the runner stderr runner_completed line category B and the stage failure category on GET /v0/runs/{run_id} for a stage whose verify command fails with plain test output on max_iterations 0.
steps: 'DIRECT INVOCATION: fresh run 6443350d-7dfd-4a5c-9f63-06052cb5feba (inline spec; plan driven to approved as in criterion 1; implement f1e79dc9-ee1c-4712-9b20-e5d091662146 dispatched): env -i PATH=$PATH HOME=$HOME FISHHAWK_AGENT_BIN=/tmp/fh-stub-agent ANTHROPIC_API_KEY=dummy /tmp/fh-acc-runner --run-id 6443350d-… --backend-url http://localhost:8090 --workflow feature_change --stage implement --stage-id f1e79dc9-… --working-dir /tmp/fh-acc-work --fetch-prompt --upload-trace --github-repo kuhlman-labs/fishhawk --base-branch main --verify-cmd ''printf -- "--- FAIL: TestAcceptanceRedTree (0.01s)\n    red_test.go:12: expected 2, got 3\nFAIL\nFAIL\texample.com/acc\t0.020s\n"; exit 1'' --verify-max-iterations 0 --bundle-out /tmp/fh-acc-c3-bundle.gz (default local profile, no hosted env). DISPATCH PATH: run 8335492e-aa9c-48ed-93fa-3253941ba613 whose spec implement executor.verify.command is the same printf/exit 1 (no max_iterations); fishhawk_dispatch_stage with runner_binary /tmp/fh-local-runner (stub agent, no hosted env), stage 045810d9-e29d-4df4-a3ff-057223a936a8; read stderr, GET /v0/stages/{implement}, audit dispatch_reaper_failed. (An earlier dispatch attempt, run 43fa5fd7, used an unquoted-paren command whose sh syntax error also yielded runner_completed category B; superseded by the properly quoted runs.)'
assertions:
    expected: runner_completed category B (and the stage's failure category B) for a plain test-failure on max_iterations 0.
    observed_at_record: 'Both: gate_isolation_selected path=clone profile=local (the gate EXECUTED); bundle verify_run {outcome failed, exit_code 1, output ''--- FAIL: TestAcceptanceRedTree (0.01s)\n    red_test.go:12: expected 2, got 3\nFAIL\nFAIL\texample.com/acc\t0.020s\n''}; runner_completed {outcome failed, category B, reason ''gitops: committed tree tests failed: committed tree verify command "…" failed; 0 file(s) outside scope are build/test-required: --- FAIL: TestAcceptanceRedTree …''}. Backend on the dispatch run: failed, failure_category C from the dispatch reaper (unconditional C for a non-zero runner exit — identical stamp to the hosted run; pre-existing #1747 backstop, not a runner-side category); the direct-invocation run advanced to succeeded on the no-diff trace path. The runner-side category — the surface this change touches — is B.'
    repro_handle: 'env -i PATH=$PATH HOME=$HOME FISHHAWK_AGENT_BIN=/tmp/fh-stub-agent ANTHROPIC_API_KEY=dummy /tmp/fh-acc-runner --run-id <run> --backend-url http://localhost:8090 --workflow feature_change --stage implement --stage-id <implement> --working-dir /tmp/fh-acc-work --fetch-prompt --upload-trace --github-repo kuhlman-labs/fishhawk --base-branch main --verify-cmd ''printf -- "--- FAIL: TestAcceptanceRedTree (0.01s)\nFAIL\n"; exit 1'' --verify-max-iterations 0 2>/tmp/fh-acc-c3-stderr.log; grep runner_completed /tmp/fh-acc-c3-stderr.log'
