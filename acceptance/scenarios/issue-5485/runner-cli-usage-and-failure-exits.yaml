id: scenario:issue-5485/runner-cli-usage-and-failure-exits
statement: '`fishhawk-runner lineage-lock-status` exits 2 with nothing on stdout when --run-id or --working-dir is missing, and exits 1 with nothing on stdout and a lineage_lock_status_failed event on stderr when --working-dir is not a git checkout.'
