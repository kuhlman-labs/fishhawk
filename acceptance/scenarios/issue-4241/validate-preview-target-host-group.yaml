id: scenario:issue-4241/validate-preview-target-host-group
statement: 'fishhawk validate accepts a stage declaring concurrency.groups [{group: preview-target, scope: host}]. It refuses the same entry carrying limit 1, and the refusal carries the REWORDED host-limit message: it says host-scoped limits belong to the host operator and the capacity group is sized by FISHHAWK_HOST_CAPACITY, and it no longer contains ''until host-declared capacity (#4241)''. This is the corrected operator follow-up form from the first officer''s carry-forward item 2.'
verify_hint: 'CLI surface: fishhawk validate on two temporary spec files; observe exit 0, then a non-zero exit with stderr containing FISHHAWK_HOST_CAPACITY and not containing ''until host-declared capacity''.'
steps: 'Wrote pt.yaml (implement stage, concurrency.groups [{group: preview-target, scope: host}]) and ptl.yaml (the same entry with limit: 1). Ran fishhawk validate (built from the sanctioned checkout) on each.'
assertions:
    expected: exit 0; then non-zero with FISHHAWK_HOST_CAPACITY wording and no 'until host-declared capacity'
    observed_at_record: 'pt.yaml exit 0 OK. ptl.yaml exit 1: ''.../groups/0/limit: concurrency.groups entry (scope "host", group "preview-target") declares a limit: a host-scoped group is shared by every repository on the host, so its limit belongs to the host operator, not to a repository''s spec; ... the host capacity group is sized by FISHHAWK_HOST_CAPACITY, and preview-target and any other host-scoped group is held at limit 1...''. It does not contain ''until host-declared capacity''.'
    repro_handle: fishhawk validate /tmp/fhacc4241/specs/pt.yaml; fishhawk validate /tmp/fhacc4241/specs/ptl.yaml
