id: scenario:issue-4241/validate-refuses-capacity-entry
statement: 'The fishhawk validate CLI exits non-zero on a workflow-v2 spec whose stage declares the concurrency.groups entry {group: capacity, scope: host}, and its stderr names the reserved host capacity group. The same spec without that entry validates (exit 0).'
verify_hint: 'CLI surface: run fishhawk validate against a temporary workflow-v2 spec file with and without the capacity entry; observe the exit codes and stderr.'
steps: 'Built fishhawk from the sanctioned checkout. Wrote cap.yaml: v2, workflows.w.stages[0] {id apply, type implement, executor.agent claude-code, concurrency.groups [{group: capacity, scope: host}]}, and base.yaml, the same stage without the concurrency block. Ran fishhawk validate on each.'
assertions:
    expected: non-zero exit naming the reserved host capacity group; same spec without the entry exits 0
    observed_at_record: 'cap.yaml: exit 1, stderr ''concurrency.groups entry (scope "host", group "capacity") is reserved: host:<host>:capacity is the host capacity group every host-dispatched stage already holds, sized by the host operator through FISHHAWK_HOST_CAPACITY (default 3), so a spec cannot declare it...''. base.yaml: exit 0 OK.'
    repro_handle: /tmp/fhacc4241/bin/fishhawk validate /tmp/fhacc4241/specs/cap.yaml
