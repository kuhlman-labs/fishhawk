id: scenario:issue-3394/auto-preview-tool-description-names-teardown
statement: The fishhawk_dispatch_stage tool's auto_preview parameter description, as returned in the MCP tool listing, states that the dispatch sets both FISHHAWK_ACCEPTANCE_PREVIEW_CMD and FISHHAWK_ACCEPTANCE_PREVIEW_TEARDOWN_CMD (scripts/dev preview-down) on the spawned runner and that an operator-set value of either wins.
verify_hint: 'MCP tool result: list tools against the preview''s /mcp route and read the fishhawk_dispatch_stage input schema''s auto_preview description for `FISHHAWK_ACCEPTANCE_PREVIEW_TEARDOWN_CMD` and `scripts/dev preview-down`.'
steps: Confirmed target identity (/healthz git_sha 49073640 == sanctioned checkout HEAD 49073640). /mcp requires a bearer token and no dev route mints one, so I issued a bootstrap token with the preview's own binary (`fishhawkd token issue` against the preview's isolated fishhawk_preview DB). Called sessionless tools/list (protocol 2026-07-28 with _meta) and read fishhawk_dispatch_stage.inputSchema.properties.auto_preview.description.
assertions:
    expected: auto_preview description names both env vars, `scripts/dev preview-down`, and states an operator-set value of either wins.
    observed_at_record: 'Description: ''It sets FISHHAWK_ACCEPTANCE_PREVIEW_CMD="scripts/dev preview" AND FISHHAWK_ACCEPTANCE_PREVIEW_TEARDOWN_CMD="scripts/dev preview-down" on the SPAWNED RUNNER ... tears the preview down on every exit path ... An operator-set value of EITHER variable in this process ALWAYS wins and is passed through unchanged; the teardown default is injected only when the provision default is''. All four needles present (both env names, `scripts/dev preview-down`, operator-wins clause).'
    repro_handle: 'curl -X POST http://localhost:8090/mcp -H ''Authorization: Bearer <fhk_token>'' -H ''Mcp-Protocol-Version: 2026-07-28'' -H ''Mcp-Method: tools/list'' -H ''Accept: application/json, text/event-stream'' -d ''{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'' | grep -o ''FISHHAWK_ACCEPTANCE_PREVIEW_TEARDOWN_CMD'''
