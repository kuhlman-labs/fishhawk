id: scenario:issue-3394/auto-preview-tool-description-names-teardown
statement: The fishhawk_dispatch_stage tool's auto_preview parameter description, as returned in the MCP tool listing, states that the dispatch sets both FISHHAWK_ACCEPTANCE_PREVIEW_CMD and FISHHAWK_ACCEPTANCE_PREVIEW_TEARDOWN_CMD (scripts/dev preview-down) on the spawned runner and that an operator-set value of either wins.
