id: scenario:issue-5497/stall-watch-flags-on-serve-help
statement: The fishhawkd serve command's help output lists --enable-stall-watch, whose usage text describes it as off by default, and lists --stall-watch-threshold, --stall-watch-interval and --stall-watch-lookback with their defaults shown (30m, 5m and 168h, which the flag package prints as 30m0s, 5m0s and 168h0m0s).
verify_hint: 'CLI stdout/stderr: run the fishhawkd binary''s serve subcommand with -h and read the four flags, their defaults and the enable flag''s usage text. Placement next to the --dispatch-watchdog-* flags is a source-order note only (the help output sorts flags), not part of this check.'
steps: 'Posture B against the same commit the target serves: built fishhawkd from the sanctioned checkout 84f0e6132 (target /healthz git_sha 84f0e6132) with cd backend && go build -o /tmp/fhacc5497/bin/ ./cmd/fishhawkd. Ran /tmp/fhacc5497/bin/fishhawkd serve -h and grepped for stall-watch.'
assertions:
    expected: All four flags listed, the enable flag described as off by default, and defaults of 30m0s, 5m0s and 168h0m0s.
    observed_at_record: '-enable-stall-watch: ''start the stall watch ticker (#5497); pages the operator when a failed stage, or a dispatchable decomposition child, has seen no operator or driver act past --stall-watch-threshold. Page-only: it never retries, revives or dispatches. Off by default''. -stall-watch-interval duration ''(default 5m0s)''. -stall-watch-lookback duration ''(default 168h0m0s)''. -stall-watch-threshold duration ''(default 30m0s)''. The help output''s sha256 is 2414ac6b….'
    repro_handle: cd backend && go build -o /tmp/bin/ ./cmd/fishhawkd && /tmp/bin/fishhawkd serve -h 2>&1 | grep -A1 stall-watch
