id: scenario:issue-4101/concerns-route-lists-existing-run
statement: GET /v0/runs/{run_id}/concerns for an existing run returns HTTP 200 with a JSON body carrying run_id, state open, include_children false, a count, and an items array (an empty array, not null, when the run has no open concerns).
verify_hint: 'HTTP: GET /v0/runs to pick a run id, then GET /v0/runs/{that id}/concerns with an operator token; observe 200 and the listed fields, items being a JSON array.'
