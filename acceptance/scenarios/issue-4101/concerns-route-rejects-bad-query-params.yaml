id: scenario:issue-4101/concerns-route-rejects-bad-query-params
statement: GET /v0/runs/{run_id}/concerns refuses an unrecognised state value or an unparseable include_children value with HTTP 400 and a JSON validation_failed error naming the offending field.
verify_hint: 'HTTP: GET /v0/runs/<any UUID>/concerns?state=opne and ?include_children=maybe on the localhost preview; each returns 400 with error validation_failed and details.field state / include_children.'
