id: scenario:issue-3747/per-workflow-delegation-readable-without-a-run
statement: GET /v0/repos/{owner}/{name}/delegation?source=run_cache returns 200 and the body carries one entry per workflow declared in the spec, each with its autonomy tier, a matrix array whose entries carry action, mode and source, a must_page_human list, and a content_hash — read without starting a run.
verify_hint: 'HTTP route: GET /v0/repos/{owner}/{name}/delegation?source=run_cache on the localhost preview returns 200 and the decoded body carries workflows[].autonomy, workflows[].matrix[].{action,mode,source} and workflows[].content_hash.'
steps: 'POST http://localhost:8090/v0/dev/fixtures with {"scenario":"plan-gate-parked"}, then trace-upload-target, plan-gate-criteria and acceptance-dispatched, so kuhlman-labs/fishhawk has runs with a cached spec. GET http://localhost:8090/v0/repos/kuhlman-labs/fishhawk/delegation?source=run_cache with no bearer, and decode the body. Also GET /v0/runs/{acceptance-dispatched run_id}, the newest run, to compare its workflow_id and delegation block. Negative controls: ?source=bogus, and nobody/none with source=run_cache.'
assertions:
    expected: 200 with workflows[] each carrying autonomy, matrix[].{action,mode,source}, a must_page_human list and content_hash.
    observed_at_record: '200: {repo, source:''run_cache'', workflow_sha:''9ab15ef1…'', spec_version:''2'', schema_major:2, content_hash:''d7ccbf91…'', workflows:[{id:''feature_change'', autonomy:''low'', matrix:[approve,fixup,waive,retry,merge each {mode:''gated'', source:''tier''}], content_hash:''329fabc2…''}]}. That is one entry, matching the single workflow in the cached spec (the run detail shows workflow_id feature_change and the same workflow_sha). must_page_human is omitted: the low tier has an empty page list (spec/v2autonomy.go, ''TierLow … implies no page_human_on list''), and the run''s delegation block omits it identically. Controls: source=bogus returned 400 validation_failed with accepted [ref, run_cache]; the unknown repo returned 404 workflow_spec_not_found. No run was started.'
    repro_handle: curl -s 'http://localhost:8090/v0/repos/kuhlman-labs/fishhawk/delegation?source=run_cache' | jq .
