id: scenario:issue-3589/http-path-input-refused-when-no-roots-configured
statement: Over the HTTP MCP transport with no checkout roots configured, an MCP tool call that supplies a filesystem path input is refused, and the refusal text names path_outside_allowed_roots while reporting nothing about the named path's contents or whether it exists.
verify_hint: 'MCP tool result: call fishhawk_validate over the preview''s POST /mcp with a working_dir argument and no configured roots; the tool result is an error whose text carries path_outside_allowed_roots. Marked non-blocking because the loopback-listener and bearer preconditions may not hold in the sandbox; the same behaviour is pinned hermetically by TestPathConfinement_EveryPathTakingVerb.'
steps: '1) Mint an fhm_ bearer: POST http://localhost:8090/v0/dev/fixtures {"scenario":"plan-gate-parked"}; POST /v0/runs/{run}/signing-key {}; POST /v0/dev/sign with body ''{}'' and X-Fishhawk-Dev-Private-Key; POST /v0/runs/{run}/mcp-token with X-Fishhawk-Signature. 2) POST http://localhost:8090/mcp (preview fishhawkd /mcp route, loopback) tools/call fishhawk_validate with {working_dir:''/etc''}, {working_dir:''/nonexistent/xyz''}, {spec_file:''/etc/hosts''} and {spec_file:''/nonexistent/abc.yaml''}. Headers: Authorization Bearer, Accept ''application/json, text/event-stream'', Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/call, Mcp-Name fishhawk_validate; params._meta io.modelcontextprotocol/protocolVersion + clientCapabilities. 3) Byte-compare the existing and nonexistent responses.'
assertions:
    expected: Refusal naming path_outside_allowed_roots with no content/existence information.
    observed_at_record: 'Every call returned isError:true with ''path_outside_allowed_roots: no allowed checkout root is configured, so <working_dir|spec_file> is refused over the HTTP MCP transport (fail closed); configure the allow-list with fishhawkd --mcp-allowed-roots / FISHHAWKD_MCP_ALLOWED_ROOTS, or fishhawk-mcp --allowed-roots / FISHHAWK_MCP_ALLOWED_ROOTS''. The /etc and /nonexistent responses are byte-identical (sha256:acb220f7...), so neither content nor existence leaks. The server reports version v0.1.0+1c1c1a9a, matching the merge-candidate HEAD. start_run and run_stage could not be driven: the sandbox egress proxy denies run-minting/dispatch tool calls.'
    repro_handle: POST http://localhost:8090/mcp tools/call fishhawk_validate {working_dir:'/etc'}
