id: scenario:issue-3589/http-path-input-refused-when-no-roots-configured
statement: Over the HTTP MCP transport with no checkout roots configured, an MCP tool call that supplies a filesystem path input is refused, and the refusal text names path_outside_allowed_roots while reporting nothing about the named path's contents or whether it exists.
verify_hint: 'MCP tool result: call fishhawk_validate over the preview''s POST /mcp with a working_dir argument and no configured roots; the tool result is an error whose text carries path_outside_allowed_roots. Marked non-blocking because the loopback-listener and bearer preconditions may not hold in the sandbox; the same behaviour is pinned hermetically by TestPathConfinement_EveryPathTakingVerb.'
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"plan-gate-parked"} returned run 8bdfd987-370e-4f2c-91c4-ad86213fa08f. Then POST /v0/runs/{run}/signing-key {}, POST /v0/dev/sign over ''{}'' with X-Fishhawk-Dev-Private-Key, and POST /v0/runs/{run}/mcp-token with X-Fishhawk-Signature, which returned an fhm_ bearer. 2) POST http://localhost:8090/mcp with a JSON-RPC tools/call to fishhawk_validate. Headers: Authorization Bearer, Accept ''application/json, text/event-stream'', Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/call, Mcp-Name fishhawk_validate; params._meta carried protocolVersion and clientCapabilities. Four argument sets: {working_dir:''/etc''}, {working_dir:''/nonexistent/xyz''}, {spec_file:''/etc/hosts''}, {spec_file:''/nonexistent/abc.yaml''}.'
assertions:
    expected: A tool error naming path_outside_allowed_roots that says nothing about the path's content or whether it exists.
    observed_at_record: 'All four calls returned HTTP 200 with result.isError=true and the text ''path_outside_allowed_roots: no allowed checkout root is configured, so <working_dir|spec_file> is refused over the HTTP MCP transport (fail closed); configure the allow-list with fishhawkd --mcp-allowed-roots / FISHHAWKD_MCP_ALLOWED_ROOTS, or fishhawk-mcp --allowed-roots / FISHHAWK_MCP_ALLOWED_ROOTS''. The text is identical for existing and absent paths and quotes no file content.'
    repro_handle: 'curl -XPOST http://localhost:8090/mcp -H ''Authorization: Bearer <fhm_>'' -H ''Mcp-Method: tools/call'' -H ''Mcp-Name: fishhawk_validate'' -H ''Mcp-Protocol-Version: 2026-07-28'' -H ''Accept: application/json, text/event-stream'' -d ''{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"fishhawk_validate","arguments":{"spec_file":"/etc/hosts"},"_meta":{...}}}'''
