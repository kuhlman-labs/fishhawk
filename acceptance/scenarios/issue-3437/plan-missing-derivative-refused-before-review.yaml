id: scenario:issue-3437/plan-missing-derivative-refused-before-review
statement: 'A plan shipped to POST /v0/runs/{run_id}/plan that scopes docs/api/v0.openapi.yaml without site/src/content/docs/reference/api.md is refused before any plan review: the run''s audit stream carries a plan_generated_surface_retry entry naming the trigger, the missing derivative and scripts/gen-site-reference, no plan_review_started entry follows it, and the plan stage is re-opened rather than awaiting_approval.'
verify_hint: GET /v0/runs/{run_id}/audit?category=plan_generated_surface_retry returns one entry whose payload findings[0].trigger_path is docs/api/v0.openapi.yaml, missing_tests contains site/src/content/docs/reference/api.md and generator is scripts/gen-site-reference; GET /v0/runs/{run_id} shows the plan stage in pending or dispatched, not awaiting_approval.
steps: 'POST /v0/dev/fixtures {scenario:trace-upload-target} -> 201 (run e8490e88-6a33-4991-9448-0d31f6e34c49, plan stage 14e684b1-a121-4a02-b3ea-ad0314ec1afd). POST /v0/runs/{run}/signing-key -> private_key. Signed GET /v0/stages/{plan}/prompt (X-Fishhawk-Signature over prompt:{plan}) -> 200, which flips the stage dispatched -> running (verified via GET /v0/stages/{plan}). Built a standard_v1 plan whose scope.files is exactly [{path: docs/api/v0.openapi.yaml, operation: modify}] (approach step 1 edits it; ticket_reference kuhlman-labs/fishhawk#3; generated_by claude-code/claude-opus-4-8). POST /v0/dev/sign over the plan bytes; POST /v0/runs/{run}/plan?stage_id={plan} with X-Fishhawk-Signature -> 201 (content_hash edf867c5...). Then GET /v0/runs/{run}/audit, GET ...audit?category=plan_generated_surface_retry, GET ...audit?category=plan_review_started, GET /v0/stages/{plan}.'
assertions:
    expected: One plan_generated_surface_retry entry naming trigger docs/api/v0.openapi.yaml, missing derivative site/src/content/docs/reference/api.md and generator scripts/gen-site-reference; no plan_review_started after it; plan stage pending/dispatched, not awaiting_approval.
    observed_at_record: 'Audit after plan_generated: plan_scope_precheck (violations []), plan_surface_sweep (findings []), then plan_generated_surface_retry {attempt: 1, findings: [{generator: scripts/gen-site-reference, trigger_path: docs/api/v0.openapi.yaml, missing_tests: [site/src/content/docs/reference/api.md]}], required_scope_files: [site/src/content/docs/reference/api.md]} and nothing after it. category=plan_generated_surface_retry returns exactly 1 entry; category=plan_review_started returns 0 entries. Plan stage state: dispatched (re-opened from running), not awaiting_approval.'
    repro_handle: curl http://localhost:8090/v0/runs/e8490e88-6a33-4991-9448-0d31f6e34c49/audit?category=plan_generated_surface_retry
