statement: After a refusal, the re-dispatched plan stage's rendered prompt contains a 'Generated-surface scope restoration' section naming the trigger, the missing derivative path and the generator command, plus the refused plan to re-emit.
verify_hint: After the refusal above, GET /v0/stages/{plan_stage_id}/prompt-render; the prompt field contains '### Generated-surface scope restoration (binding — this plan was REFUSED)', site/src/content/docs/reference/api.md, scripts/gen-site-reference and 'Refused plan'.
