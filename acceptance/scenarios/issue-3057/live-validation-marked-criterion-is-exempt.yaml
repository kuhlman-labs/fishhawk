id: scenario:issue-3057/live-validation-marked-criterion-is-exempt
statement: 'The discrimination control: the same criterion marked requires_live_validation with a verify_hint (and the paired skip_expected plus expectation_basis the authoring contract requires) draws NO blocking_criterion_undecided finding.'
verify_hint: GET /v0/runs/{run_id}/audit returns a plan_acceptance_precheck entry whose findings array contains no object with rule blocking_criterion_undecided.
