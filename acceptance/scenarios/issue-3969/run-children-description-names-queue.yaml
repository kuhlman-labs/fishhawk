id: scenario:issue-3969/run-children-description-names-queue
statement: In the stdio MCP tools/list result, the fishhawk_run_children description states that a child whose dispatch is queued is marked queued, that this session's waiter spawns it on admission from the admitting response's base_branch, and that a queued child consumes the per-invocation budget. Its output schema exposes queued, concurrency_slot and queued_count.
steps: Built fishhawk-mcp from the sanctioned checkout (HEAD 2373d5b64, matching healthz git_sha). Ran it on stdio under env -i with FISHHAWK_BACKEND_URL=http://localhost:8090 and FISHHAWK_API_TOKEN set to an fhm_ bearer minted from trace-upload-target, sending initialize, notifications/initialized and tools/list. Cross-checked with POST /mcp tools/list, which was identical. Read fishhawk_run_children's description and outputSchema.
assertions:
    expected: The description states queued marking, the waiter spawn from the admitting base_branch, and the per-invocation budget consumption; the schema exposes queued, concurrency_slot and queued_count.
    observed_at_record: 'The description reads: ''A child the host-dispatch marker QUEUES for a local concurrency slot (409 concurrency_slot_queued, #3969) is NOT a failure: it is reported queued:true with its concurrency_slot block ... This session''s slot waiter re-POSTs the marker and spawns the child DETACHED exactly once on admission, against the ADMITTING response''s base_branch ... queued_count counts them.'' It also says: ''A child queued for a concurrency slot with a live waiter counts as in flight, and a child this call queues spends one unit exactly like a spawned one''. The outputSchema children items have queued and concurrency_slot, and the top level has queued_count.'
    repro_handle: stdio fishhawk-mcp tools/list
