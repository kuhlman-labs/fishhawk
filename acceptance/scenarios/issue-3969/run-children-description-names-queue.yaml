id: scenario:issue-3969/run-children-description-names-queue
statement: In the stdio MCP tools/list result, the fishhawk_run_children description states that a child whose dispatch is queued is marked queued, that this session's waiter spawns it on admission from the admitting response's base_branch, and that a queued child consumes the per-invocation budget. Its output schema exposes queued, concurrency_slot and queued_count.
steps: Built fishhawk-mcp from the sanctioned checkout (36e122cf3, same as the preview's healthz git_sha). Ran it on stdio under env -i with FISHHAWK_BACKEND_URL=http://localhost:8090 and FISHHAWK_API_TOKEN set to an fhm_ bearer minted from trace-upload-target, sending initialize, notifications/initialized and tools/list. Cross-checked with POST /mcp tools/list. Read fishhawk_run_children's description and outputSchema.
assertions:
    expected: The queued marking, the waiter spawn from the admitting base_branch, the budget consumption, and the three schema fields.
    observed_at_record: The description says a queued child is 'reported queued:true with its concurrency_slot block, and NO runner is spawned this call'. It says the waiter 'spawns the child DETACHED exactly once on admission, against the ADMITTING response's base_branch'. It says 'a child this call queues spends one unit exactly like a spawned one'. The outputSchema contains queued, concurrency_slot and queued_count. The stdio and HTTP digests are identical (sha256:e49cf418...).
    repro_handle: stdio fishhawk-mcp tools/list
