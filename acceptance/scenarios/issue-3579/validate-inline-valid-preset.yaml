    repro_handle: /tmp/fh3579/mcpj.sh tools/call "$(jq -cn --rawfile s /tmp/fh3579/init-med.yaml '{name:"fishhawk_validate",arguments:{workflow_spec:$s}}')" fishhawk_validate | jq .result.structuredContent
