id: scenario:issue-3579/validate-inline-valid-preset
statement: Calling fishhawk_validate with workflow_spec set to the workflow_yaml returned by fishhawk_init (medium) returns valid:true, source inline, an empty diagnostics list, a non-empty checked sentence and a not_checked list naming the charter rule and reviewer model ids.
verify_hint: 'MCP tools/call fishhawk_init {} then fishhawk_validate {workflow_spec: <workflow_yaml>}; read structuredContent.'
steps: 'POST http://localhost:8090/mcp tools/call fishhawk_init {preset: medium} (Mcp-Name fishhawk_init) → structuredContent.workflow_yaml (242 lines, sha256 fa3ff6fe…; byte-identical to fishhawk_init {} with no arguments). POST /mcp tools/call fishhawk_validate {workflow_spec: <that workflow_yaml>} (Mcp-Name fishhawk_validate); read structuredContent.'
assertions:
