id: scenario:issue-2245/with-arm-regression-fails
statement: Given an evidence record whose fingerprint matches the current render but whose with-conventions catch rate is more than the tolerance below the without-conventions rate, the gate command exits non-zero and names the regression; it does not warn and exit zero.
verify_hint: 'CLI exit code: from backend/, take the fingerprint from `go run ./internal/agenteval/catchrategate --print-fingerprint`, write a record with that fingerprint, 150 trials per arm, without-arm caught 120 and with-arm caught 90, then run `go run ./internal/agenteval/catchrategate --evidence <file>`: exit code 1 and stderr naming a regression.'
steps: 'Posture B: took the fingerprint from --print-fingerprint. Wrote a complete v1 record with 6 cases x 25 trials (150 per arm): without-arm caught 120, with-arm caught 90, plus a pinned baseline. Ran go run ./internal/agenteval/catchrategate --evidence /tmp/fhacc2245/regress.json.'
assertions:
    expected: Exit 1 naming the regression.
    observed_at_record: 'Exit 1. ''Verdict: REGRESSED''; stderr: ''the with-conventions arm is +0.200 below the without-conventions arm, more than the 0.10 tolerance''. The control record with equal arms exited 0.'
    repro_handle: cd backend && go run ./internal/agenteval/catchrategate --evidence /tmp/fhacc2245/regress.json
