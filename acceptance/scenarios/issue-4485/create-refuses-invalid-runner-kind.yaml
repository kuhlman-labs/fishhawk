id: scenario:issue-4485/create-refuses-invalid-runner-kind
statement: POST /v0/campaigns with an otherwise well-formed body whose runner_kind is not a known runner kind (e.g. "kubernetes") returns 400 with error code validation_failed and details.field = runner_kind, before any forge round-trip.
verify_hint: 'HTTP: POST /v0/campaigns with body {"repo":"acme/widgets","items":["1"],"runner_kind":"kubernetes"}; expect status 400, error code validation_failed, details.field runner_kind. Also decided in-repo by TestCreateCampaign_InvalidRunnerKind_Rejected.'
steps: '1) Live attempt: POST http://localhost:8090/v0/campaigns {"repo":"acme/widgets","items":["1"],"runner_kind":"kubernetes"}. The acceptance egress sandbox refused it with 403 (POST /v0/campaigns is a run-minting/dispatch verb under ADR-050 default-deny), and no operator write:campaigns token is available. 2) Posture B, as the verify_hint names: in the sanctioned checkout (HEAD 1600bb9f, which equals the target git_sha), ran cd backend && env -u FISHHAWK_TEST_PG_URL go test ./internal/server/ -count=1 -run TestCreateCampaign_InvalidRunnerKind_Rejected -v'
