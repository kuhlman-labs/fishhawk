id: scenario:issue-4699/headroom-floor-holds-and-fails-loud
statement: 'Issue #4699 AC4: the shipped index rendering''s headroom under repodoc.DefaultMaxBytes is at least 10 times its largest rendered line, and a floor set above the available headroom fails with a message naming #4699 and the tiering option. Check: `cd backend && GOFLAGS=-trimpath go test ./internal/decisionrecord/ -run ''HeadroomFloor'' -v` passes (TestAssemble_ShippedIndex_HeadroomFloor and TestAssemble_HeadroomFloor_IsCaught) and logs the rendering bytes, the largest line and the lines available.'
steps: 'Posture B in the sanctioned checkout (HEAD e0b26d7c). (1) Ran cd backend && GOFLAGS=-trimpath go test ./internal/decisionrecord/ -count=1 -run ''HeadroomFloor'' -v. (2) Read headroomFloorError and TestAssemble_HeadroomFloor_IsCaught in assemble_test.go (lines 730-845) to confirm the counterfactual: with a floor of available+1, the call must return an error containing ''#4699'' and ''tier the index''.'
assertions:
    expected: 'Headroom >= 10 x the largest line; a floor above the available headroom fails with a message naming #4699 and tiering; the numbers are logged'
    observed_at_record: 'Both tests pass. Logged: ''adr-index-lines-v2 rendering: 24200 bytes, cap 32768, headroom 8568 bytes, largest line 405 bytes, 21 lines available, floor 10 lines''. The IsCaught test asserts that floor 22 errors with a message naming #4699 and ''tier the index (collapse superseded or older records)'', and it passes.'
    repro_handle: cd backend && GOFLAGS=-trimpath go test ./internal/decisionrecord/ -count=1 -run 'HeadroomFloor' -v
