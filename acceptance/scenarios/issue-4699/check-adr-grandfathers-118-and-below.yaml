id: scenario:issue-4699/check-adr-grandfathers-118-and-below
statement: scripts/check-adr accepts a title over 100 characters on a record numbered 118 or lower, and accepts a title of exactly 100 characters on ADR-119. The committed docs/adr tree, whose existing titles run up to 252 characters, still checks clean.
verify_hint: 'CLI exit code: scripts/check-adr with no arguments on the merge candidate exits 0 naming the record count. A temp fixture whose ADR-118 has a 249-character title, and one whose ADR-119 has exactly 100 characters, both exit 0'
steps: Posture B in the sanctioned checkout (HEAD e0b26d7c). (1) Ran scripts/check-adr with no arguments. (2) Copied docs/adr and rewrote ADR-118's front-matter title and its index title to the same 249-character string, then ran scripts/check-adr on the copy. (3) Copied docs/adr, added a new ADR-119 record (accepted, with a Decision section) whose title is exactly 100 ASCII characters, appended a matching index entry, and ran check-adr. (4) Did the same with a title of exactly 100 'é' (200 bytes), under LC_ALL=C and under the default locale. (5) Ran scripts/test-adr under the default locale and under LC_ALL=C.
assertions:
    expected: exit 0 on the committed tree, on the ADR-118 249-character fixture and on the ADR-119 100-character fixtures
    observed_at_record: 'Committed tree: exit 0, ''113 record(s) consistent''. ADR-118 with a 249-character title: exit 0. ADR-119 with 100 ASCII characters: exit 0 (114 records). ADR-119 with 100 ''é'': exit 0 under both locales. test-adr: 67 passed, 0 failed under both locales. docs/adr/README.md line 58 states the rule.'
    repro_handle: scripts/check-adr; LC_ALL=C scripts/test-adr; scripts/test-adr
