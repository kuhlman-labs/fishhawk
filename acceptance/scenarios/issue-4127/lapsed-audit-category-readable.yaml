id: scenario:issue-4127/lapsed-audit-category-readable
statement: 'The audit read accepts the new category: GET /v0/runs/{run_id}/audit?category=scope_amendment_lapsed returns 200 with an items list (empty for a run that never lapsed an amendment) instead of the 400 validation_failed unknown-category refusal.'
verify_hint: 'HTTP: create or pick any run on the localhost preview, GET /v0/runs/{run_id}/audit?category=scope_amendment_lapsed with an operator bearer; expect 200 and no error.code; contrast with a nonsense category, which returns 400 validation_failed.'
