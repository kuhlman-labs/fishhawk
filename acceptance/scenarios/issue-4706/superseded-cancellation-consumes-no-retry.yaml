id: scenario:issue-4706/superseded-cancellation-consumes-no-retry
statement: 'Repository-local synthetic evidence at the final merge-candidate head. The webhook Dispatcher.Handle is driven in-process with in-memory GitHub, run and audit stubs; this is not a live webhook, forge or preview walk. A synthetic check_run concluded cancelled or stale, at a head that is not the run''s current recorded head, mints no CI-failure retry child and writes no ci_retry_exhausted row. It records exactly one ci_retry_skipped audit row with reason check_superseded_by_newer_head, both below and at the retry cap. A synthetic non-supersession failure conclusion is never refused by the head check, even when the head lookup errors: a retry child is minted, no ci_retry_skipped row is written, and the head ledger is never read. The observable is the exit code and verbose stdout of the named go test selector, run against the sanctioned acceptance tree.'
verify_hint: 'Posture B repository-local check (CLI exit code and stdout), run ONLY in the sanctioned merge-candidate tree the runner provisions: `cd /tmp/fishhawk-acceptance-tree-<run_id>-<stage_id> && GOCACHE="$(mktemp -d "${TMPDIR:-/tmp}/fh-acc-gocache.XXXXXX")" GOPROXY=off go test -buildvcs=false -count=1 -v -run ''^(TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting|TestHandle_CIFailureRetry_NonSupersessionFailure_HeadLookupError_StillRetries)$'' ./backend/internal/webhook/`. Pass = exit 0; stdout carries `--- PASS: TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting` and `--- PASS: TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting/<sub>` for each of the four subtests cancelled_uncapped, cancelled_capped, stale_uncapped and stale_capped, `--- PASS: TestHandle_CIFailureRetry_NonSupersessionFailure_HeadLookupError_StillRetries`, no `--- FAIL` or `--- SKIP` line, and a final `ok  github.com/kuhlman-labs/fishhawk/backend/internal/webhook` line. Record `git -C <tree> rev-parse HEAD`, `go version`, the raw stdout/stderr (content-hashed into evidence_hashes) and `git -C <tree> status --porcelain`, which must be empty, in steps_taken/observed. State in notes that this is synthetic repository-local evidence, not a live forge observation.'
steps: 'Posture B, synthetic repository-local evidence. Tree /tmp/fishhawk-acceptance-tree-53665a69-5fdb-4515-8254-f2695e55a317-e56db72c-d246-40e6-8dac-3973b6af8cb3; git rev-parse HEAD = 46cfe3e6ea6474bf3668f393be079887c4a2d3a2 (== preview git_sha). go version go1.26.9 darwin/arm64. Ran: cd <tree> && GOCACHE="$(mktemp -d "${TMPDIR:-/tmp}/fh-acc-gocache.XXXXXX")" GOPROXY=off go test -buildvcs=false -count=1 -v -run ''^(TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting|TestHandle_CIFailureRetry_NonSupersessionFailure_HeadLookupError_StillRetries)$'' ./backend/internal/webhook/. Raw output sha256:978589974f678df87af7d52302c0be2027ce5594fb377ca388297b4d550ac6f3. Afterwards, git status --porcelain was empty.'
assertions:
    expected: exit 0, all named PASS lines, no FAIL/SKIP, ok line, clean tree
    observed_at_record: 'Exit 0. --- PASS for TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting and its subtests /cancelled_uncapped, /cancelled_capped, /stale_uncapped and /stale_capped. --- PASS for TestHandle_CIFailureRetry_NonSupersessionFailure_HeadLookupError_StillRetries. No FAIL or SKIP line. Final line: ''ok  github.com/kuhlman-labs/fishhawk/backend/internal/webhook 0.248s''. Clean tree.'
    repro_handle: go test -run '^(TestHandle_CIFailureRetry_SupersededCancellation_RefusedBeforeRetryAccounting|TestHandle_CIFailureRetry_NonSupersessionFailure_HeadLookupError_StillRetries)$' ./backend/internal/webhook/
