    observed_at_record: 'stale + _REF: exit 75. Stderr has ''host_toolchain_mismatch: lint REFUSED ... (exit 75, EX_TEMPFAIL)'' and a line naming Dockerfile:74 GO_VERSION 1.27.4. It has ''gate_image_stale: the gate image fishhawk-gate:local carries the toolchain above'' and the ''docker buildx build --load --build-context frontend=./frontend -t fishhawk-gate:local deploy/gate-image'' command. stale + FISHHAWK_GATE_IMAGE: exit 75, image shown as ''<unnamed: the runner did not set FISHHAWK_GATE_IMAGE_REF>''. pinned: exit 0, no refusal.'
    repro_handle: env PATH=<stubdir>:/usr/bin:/bin GOTOOLCHAIN=local FISHHAWK_GATE_CONTAINER=1 FISHHAWK_GATE_IMAGE_REF=fishhawk-gate:local scripts/test lint; echo $?
