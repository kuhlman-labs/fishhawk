id: scenario:issue-5453/lint-leg-exits-tempfail-naming-image
statement: Running scripts/test lint with the same stale toolchain, FISHHAWK_GATE_CONTAINER=1 and FISHHAWK_GATE_IMAGE set to an image ref exits 75 and stderr carries host_toolchain_mismatch and a gate_image_stale line naming that image ref, the GO_VERSION pin and the docker buildx rebuild command; with the pinned toolchain it does not refuse.
verify_hint: CLI exit code (75) and stderr of scripts/test lint under the stub toolchain.
steps: 'Posture B in the sanctioned checkout aaae268a8, with stale stubs: go go1.26.9, golangci-lint 2.15.0 built with go1.27.4, gofmt exits 0. Ran env PATH=<stubs>:/usr/bin:/bin GOTOOLCHAIN=local FISHHAWK_GATE_CONTAINER=1 FISHHAWK_GATE_IMAGE_REF=fishhawk-gate:local XDG_CACHE_HOME=<tmp> scripts/test lint. Repeated with FISHHAWK_GATE_IMAGE in place of _REF, then with a pinned go1.27.4 stub and _REF.'
assertions:
