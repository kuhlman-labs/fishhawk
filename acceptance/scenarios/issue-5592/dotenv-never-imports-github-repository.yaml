id: scenario:issue-5592/dotenv-never-imports-github-repository
statement: Launched as in dotenv-host-settings-reach-doctor (fixture-minted fhm_ run token, shim under env -i with GITHUB_REPOSITORY and CI_PROJECT_PATH absent from its environment), with a .env that also sets GITHUB_REPOSITORY=kuhlman-labs/fishhawk. A fishhawk_doctor call with the repo argument omitted returns the 'repo is required' tool error, which proves the non-allowlisted GITHUB_REPOSITORY key was not imported into the child.
