id: scenario:issue-5592/dotenv-evaluated-by-zsh
statement: zsh evaluates the .env. One .env sets FISHHAWK_HOST_LABEL=acc-if-label inside an `if true; then` / `fi` block, then sets FISHHAWK_HOST_CAPACITY=5, then sets a multi-line double-quoted NOTE value with an inner line reading FISHHAWK_HOST_CAPACITY=9. Through the shim, fishhawk_doctor reports host_label.label acc-if-label with source override, and host_capacity.capacity 5. A second launch uses a .env that sets the label as an array, FISHHAWK_HOST_LABEL=(acc-array-label x), and reports a host_label.source other than override and a label other than acc-array-label, because zsh never exports an array.
verify_hint: MCP tool result. Use the dotenv-host-settings-reach-doctor launch (stdio, preview backend, fixture-minted fhm_ run token, zsh on PATH) twice, once with each .env. Read structuredContent.host_label.label, host_label.source and host_capacity.capacity from each fishhawk_doctor result.
