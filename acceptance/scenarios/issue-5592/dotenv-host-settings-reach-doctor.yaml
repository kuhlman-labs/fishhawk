id: scenario:issue-5592/dotenv-host-settings-reach-doctor
statement: fishhawk-mcp-shim runs over stdio with FISHHAWK_BACKEND_URL at the preview backend, a fixture-minted run token in FISHHAWK_API_TOKEN, and --env-file pointing at a .env that sets FISHHAWK_HOST_LABEL=acc-dotenv-label and FISHHAWK_HOST_CAPACITY=4. Neither variable is in the shim's own environment. The fishhawk_doctor tool result served through that shim reports host_label.label acc-dotenv-label with source override, and host_capacity.capacity 4 with source env.
verify_hint: 'MCP tool result. Mint a run token the way acceptance/scenarios/issue-4212/doctor-override-wins.yaml did: POST /v0/dev/fixtures {"scenario":"plan-gate-parked"}, then POST /v0/runs/{run}/signing-key, then POST /v0/dev/sign over ''{}'' with X-Fishhawk-Dev-Private-Key, then POST /v0/runs/{run}/mcp-token with X-Fishhawk-Signature. host_label and host_capacity are computed with no posture gate (onboard.go:954-959), so this fhm_ run token decides them. Build bin/fishhawk-mcp-shim and bin/fishhawk-mcp from the sanctioned checkout into one dir. Launch the shim from an empty temp cwd under env -i with only PATH (which must reach zsh), HOME, XDG_STATE_HOME and TMPDIR (each an empty temp dir), FISHHAWK_BACKEND_URL at the preview and FISHHAWK_API_TOKEN=<fhm_ token>. Pass --env-file <tmp>/.env and --state-dir <tmp>/state. Send initialize, notifications/initialized, then tools/call fishhawk_doctor {repo: kuhlman-labs/fishhawk}, and read structuredContent.host_label and host_capacity.'
steps: 'Built fishhawk-mcp-shim and fishhawk-mcp from the sanctioned checkout (cd backend && go build -o /tmp/fhacc5592/bin/ ./cmd/fishhawk-mcp-shim ./cmd/fishhawk-mcp). Minted an fhm_ run token: POST http://localhost:8090/v0/dev/fixtures {"scenario":"plan-gate-parked"}; POST /v0/runs/{run}/signing-key {}; POST /v0/dev/sign body ''{}'' with X-Fishhawk-Dev-Private-Key; POST /v0/runs/{run}/mcp-token body ''{}'' with X-Fishhawk-Signature. Launched /tmp/fhacc5592/bin/fishhawk-mcp-shim --env-file <tmp>/.env --state-dir <tmp>/state from an empty temp cwd with an exact environment of only PATH=/usr/bin:/bin:/usr/sbin:/sbin, HOME, XDG_STATE_HOME, TMPDIR (each an empty temp dir), FISHHAWK_BACKEND_URL=http://localhost:8090 and FISHHAWK_API_TOKEN=<fhm_>. .env mode 0600 owned by the current user. Sent initialize, notifications/initialized, tools/call fishhawk_doctor {repo: kuhlman-labs/fishhawk}. .env: FISHHAWK_HOST_LABEL=acc-dotenv-label / FISHHAWK_HOST_CAPACITY=4.'
assertions:
    expected: host_label.label acc-dotenv-label source override; host_capacity.capacity 4 source env
    observed_at_record: 'host_label {label acc-dotenv-label, source override, dispatcher_check not_applicable}; host_capacity {capacity 4, source env, capacity_group host:acc-dotenv-label:capacity}. Shim stderr: ''sourced FISHHAWK_HOST_CAPACITY, FISHHAWK_HOST_LABEL from <tmp>/.env''.'
    repro_handle: python3 -I /tmp/fhacc5592/scripts/case.py /tmp/fhacc5592/c1.json
