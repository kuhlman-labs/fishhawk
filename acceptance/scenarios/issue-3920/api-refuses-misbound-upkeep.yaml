id: scenario:issue-3920/api-refuses-misbound-upkeep
statement: 'POST /v0/runs with an inline workflow_spec that declares upkeep_report on an implement stage, or on a plan stage without schema: upkeep_report_v1, is refused with 400 validation_failed whose details.error carries the named binding message (''upkeep_report artifact is valid only on a plan stage'' / ''upkeep_report-producing stage must declare schema: upkeep_report_v1'').'
verify_hint: 'HTTP response: POST /v0/runs on the localhost preview with each mis-bound inline workflow_spec; read error.code and error.details.error.'
steps: POST /v0/runs was blocked by the sandbox egress proxy (403, run-minting verb). As approval condition 4 directs, ran the backend validator via the preview's MCP fishhawk_validate on v2 specs where (a) an implement stage produces upkeep_report schema upkeep_report_v1, (b) a plan stage produces upkeep_report with no schema, and (c) a plan stage produces upkeep_report with schema standard_v1.
assertions:
    expected: named binding messages
    observed_at_record: '(a) ''upkeep_report artifact is valid only on a plan stage — the PROPOSE stage per ADR-067 §2 — not a "implement" stage (E79.2)''. (b) ''upkeep_report-producing stage must declare schema: upkeep_report_v1, got ""''. (c) the same message with got "standard_v1". All are kind validation, valid false.'
    repro_handle: 'MCP tools/call fishhawk_validate {workflow_spec: <implement-stage upkeep spec>}'
