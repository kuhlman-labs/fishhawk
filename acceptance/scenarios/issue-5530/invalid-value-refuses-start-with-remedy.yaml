id: scenario:issue-5530/invalid-value-refuses-start-with-remedy
statement: When FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT, FISHHAWK_HOST_DISPATCH_PER_TICK_CAP or FISHHAWK_HOST_DISPATCH_DAILY_CAP is set to a value that is not a positive decimal integer (for example abc, 0, -1 or 010), the host-dispatcher start exits non-zero. It prints one stderr line that names the variable, the flag it sets and a remedy (set a whole number from 1, or unset it to keep the default), and starts no dispatcher process.
verify_hint: 'CLI exit code and stderr: in a zsh, `DEV_LIB_ONLY=1 source scripts/dev; set +e`, point HD_BIN at any executable file, set FISHHAWK_DEV_HOST_DISPATCH=1, FISHHAWK_DEV_HOST_DISPATCH_TOKEN=x and FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT=abc, then call `_host_dispatch_up`. Observe exit 1, a stderr line containing FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT, --max-in-flight and `unset`, and no .fishhawk/host-dispatch.pid written.'
steps: 'Posture B (the verify_hint is a repository-local zsh check). Copied scripts/dev byte-identically (cmp) from the sanctioned checkout (HEAD 7e9fba338) into a scratch repo, /tmp/fhacc5530/fake/scripts/dev, so that REPO_ROOT and the pid file resolve outside the read-only checkout. For each of FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT, _PER_TICK_CAP and _DAILY_CAP, and each value abc, 0, -1, 010, 1234567 and $''1\e[31m'', ran zsh -f: DEV_LIB_ONLY=1 source fake/scripts/dev; set +e; HD_BIN=<stub executable that appends to a marker file when run>; FISHHAWK_DEV_HOST_DISPATCH=1; FISHHAWK_DEV_HOST_DISPATCH_TOKEN=x; the other two variables unset; then _host_dispatch_up, capturing stderr. Afterwards checked for fake/.fishhawk/host-dispatch.pid and the stub''s marker. Re-ran the abc case as the real callers do (if ! _host_dispatch_up) to count stderr lines.'
assertions:
    expected: Exit non-zero, one stderr line naming the variable, the flag and an unset remedy, and no dispatcher started
    observed_at_record: 'All 18 cases returned rc 1, wrote no pid file and never ran the stub. Each refusal line names the variable, prints the value quoted via (qq), names the flag (--max-in-flight / --per-tick-cap / --daily-cap) and gives a remedy containing ''unset''. Example: "host dispatcher not started: FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT=''abc'' is not a positive integer (it sets --max-in-flight) — set it in .env to a whole number from 1 to 999999 with no sign or leading zero, or unset it to keep the default 2 (keep it at or below FISHHAWK_HOST_CAPACITY, default 3)". 1234567 gives ''is out of range (it sets --max-in-flight; allowed 1 to 999999)'' (L1). DAILY_CAP says ''unset it for no daily cap''. The control-character value prints as ''1^[[31m'' in single quotes (L6). With the guarded call, stderr has exactly 1 line. The unguarded hint form adds the script''s TRAPZERR line ''scripts/dev: command failed (exit 1)'', a library-mode artifact. Library-mode control: unset or empty values gave rc 0 and an empty _HD_CAP_ARGS.'
    repro_handle: zsh -f -c 'DEV_LIB_ONLY=1 source scripts/dev; set +e; HD_BIN=/bin/true FISHHAWK_DEV_HOST_DISPATCH=1 FISHHAWK_DEV_HOST_DISPATCH_TOKEN=x; export FISHHAWK_HOST_DISPATCH_MAX_IN_FLIGHT=abc; if ! _host_dispatch_up; then echo rc=1; fi'
