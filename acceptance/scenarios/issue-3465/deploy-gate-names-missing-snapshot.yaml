id: scenario:issue-3465/deploy-gate-names-missing-snapshot
statement: Approving a deploy stage whose workflow declares required_upstream ci_green on a run that carries no required-checks snapshot returns 422 deploy_upstream_not_satisfied whose message states that no required-checks snapshot was captured for the evaluated run and that ci_green cannot clear until one exists, and whose details carry branch=snapshot_absent, snapshot_present=false and required_upstream=ci_green.
verify_hint: POST /v0/stages/{deploy_stage_id}/approvals with {"decision":"approve"} on that stage; the response is 422 with code deploy_upstream_not_satisfied, a message containing 'no required-checks snapshot', and details.branch == snapshot_absent / details.snapshot_present == false. GET /v0/runs/{run_id}/audit then shows a deploy_preflight_refused entry whose refusal_field carries the same message.
steps: 'POST /v0/runs {repo kuhlman-labs/fishhawk, workflow_id release, trigger_source cli, runner_kind local, inline workflow_spec whose release.deploy stage has executor.delegate {target github_actions, workflow_ref deploy.yml}, constraints [{required_upstream: [ci_green]}] and an approval gate} with a write:deploy bearer -> 201, deploy stage parked at awaiting_deploy_approval; psql confirmed runs.required_checks_snapshot IS NULL; POST /v0/stages/{deploy}/approvals {decision approve}; GET /v0/runs/{run}/audit?category=deploy_preflight_refused; GET /v0/stages/{deploy}.'
assertions:
    expected: 422 deploy_upstream_not_satisfied naming the missing snapshot and that ci_green cannot clear; details branch=snapshot_absent, snapshot_present=false, required_upstream=ci_green; audit deploy_preflight_refused carries the same message.
    observed_at_record: '422 {code deploy_upstream_not_satisfied, message ''required upstream ci_green is not satisfied: no required-checks snapshot was captured for the evaluated run <run>, so there is nothing for ci_green to evaluate against and it cannot clear — retrying this approval will not change the verdict until the run carries a snapshot. A snapshot is captured only by the GitHub webhook run-creation path today; runs created via POST /v0/runs, the CLI or MCP carry none, and GitLab runs never receive one (tracked in #3490)'', details {branch snapshot_absent, snapshot_present false, required_upstream ci_green, evaluated_run_id, stage_id}}; one deploy_preflight_refused audit entry with refusal_code deploy_upstream_not_satisfied and refusal_field equal to that message; stage stays awaiting_deploy_approval.'
    repro_handle: 'curl -s -X POST http://localhost:8090/v0/stages/<deploy>/approvals -H ''Authorization: Bearer <write:deploy token>'' -H ''Content-Type: application/json'' -d ''{"decision":"approve"}'''
