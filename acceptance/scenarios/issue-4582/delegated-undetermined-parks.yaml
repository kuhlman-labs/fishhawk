id: scenario:issue-4582/delegated-undetermined-parks
statement: When the merge overlap guard answers 409 overlap_undetermined for a run whose delegation allows may_merge, the delegated arm does not merge, parks the run decision_required with a named overlap reason, and records the refusal.
steps: 'Posture B in the sanctioned checkout: env -u FISHHAWK_TEST_PG_URL go test ./internal/server/ -count=1 -run ''TestAutoDriveRunGate_MergeOverlap_UndeterminedParks'' (named under approval condition C4; needs no forge dial). On the target: GET /v0/runs/{run}/audit?category=delegated_merge_overlap_refused.'
assertions:
