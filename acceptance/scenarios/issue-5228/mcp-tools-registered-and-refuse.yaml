id: scenario:issue-5228/mcp-tools-registered-and-refuse
statement: The MCP tools fishhawk_waive_concern, fishhawk_waive_concerns, fishhawk_defer_concern and fishhawk_resolve_concerns stay registered.
verify_hint: 'MCP tool result: a tools/list call over POST /mcp with a bearer lists the four tool names. The refusal they return for a server-check concern is decided by concern_session_only_mcp_test.go.'
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"}; read runs.target-run.run_id. 2) POST /v0/runs/{run}/signing-key {}; POST /v0/dev/sign over ''{}'' with X-Fishhawk-Dev-Private-Key; POST /v0/runs/{run}/mcp-token body ''{}'' with X-Fishhawk-Signature -> fhm_ bearer. 3) POST /mcp with Authorization: Bearer <fhm_>, Accept application/json, text/event-stream, Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/list, body tools/list with params._meta io.modelcontextprotocol/protocolVersion, clientCapabilities and clientInfo. 4) Parsed the SSE data line and looked up the four tool names and their descriptions.'
assertions:
    expected: A tools/list call over POST /mcp with a bearer lists the four tool names (the refusal itself is decided by concern_session_only_mcp_test.go).
    observed_at_record: '200; 86 tools registered, including fishhawk_waive_concern, fishhawk_waive_concerns, fishhawk_defer_concern and fishhawk_resolve_concerns. Each description lists ''concern_requires_session (403: a server-check concern can be cleared only from the Fishhawk Web UI session; every MCP and CLI credential is refused, whatever its subject — ADR-143 D1 …)''.'
    repro_handle: POST http://localhost:8090/mcp tools/list with a run-bound fhm_ bearer (headers Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/list)
