id: scenario:issue-5613/dispatch-stage-description-states-capacity-bound
statement: 'The fishhawk_dispatch_stage tool description served by fishhawkd''s POST /mcp tools/list states that an earlier queued stage reserves a host capacity slot only while it is capacity-bound (every other group of its set would admit it), with the corrected example: at capacity 3 with implement limit 2, two holding implements and any number of queued implements leave one slot for a plan, acceptance or verify pass. It no longer says ''at capacity 4 one slot stays free'' or ''two holding implements plus one queued implement fill capacity''.'
verify_hint: On the localhost preview, POST /mcp initialize then tools/list (HTTP JSON-RPC with the preview bearer) and read the fishhawk_dispatch_stage description. TestDispatchStage_Description_HostCapacity decides the same text in-repo.
steps: POST http://localhost:8090/v0/dev/fixtures {"scenario":"trace-upload-target"} and read run_id from the 201. POST /v0/runs/{run}/signing-key {}. POST /v0/dev/sign over the bytes '{}' with X-Fishhawk-Dev-Private-Key. POST /v0/runs/{run}/mcp-token with X-Fishhawk-Signature to get an fhm_ bearer. POST /mcp tools/list (Authorization Bearer, Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/list, params._meta protocolVersion/clientInfo/clientCapabilities). Extracted the fishhawk_dispatch_stage description and grepped it for 'capacity 4', 'fill capacity', 'plus one queued' and 'one slot stays free'.
assertions:
    expected: The capacity-bound rule and the corrected capacity-3 example, with no capacity-4 or fill-capacity text
    observed_at_record: 'The description says: ''On capacity an earlier queued stage reserves a slot only while it is capacity-bound (every other group of its set would admit it now) and is never a FIFO barrier there... A stage queued only on another group reserves no capacity slot (ADR-094 A4). Example: at capacity 3 with implement limit 2, two holding implements and any number of queued implements leave one capacity slot for a plan, acceptance or verify pass.'' All four withdrawn phrases have 0 hits.'
    repro_handle: POST /mcp tools/list with a run-bound fhm_ bearer
