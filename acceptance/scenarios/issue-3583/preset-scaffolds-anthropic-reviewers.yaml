id: scenario:issue-3583/preset-scaffolds-anthropic-reviewers
statement: Scaffolding a repository with the CLI's init command at the default (medium) preset exits 0 and writes a workflow spec whose plan-stage and implement-stage reviewer agents both declare the anthropic provider, with no uncommented claudecode or codex reviewer entry.
verify_hint: 'CLI surface: run `fishhawk init --preset medium` in an empty git repository, observe exit code 0 on stdout/stderr, then read the scaffolded `.fishhawk/workflows.yaml` and confirm every uncommented `provider:` under a `reviewers.agents` list reads `anthropic`. Repeat with `--preset low`, `--preset high`, and `--shape config-only` for the same result.'
steps: '(1) Build the CLI from the sanctioned read-only merge-candidate checkout at /tmp/fishhawk-acceptance-tree-9c5ee36d-43d6-4a24-9803-71c3356f27b0-59da6531-309e-432d-b7ff-046778d46729 (HEAD f48ad97f, git status clean; the preview reports the same git_sha at GET /healthz): `cd cli && go build -o /tmp/fh3583/fishhawk ./cmd/fishhawk`. Nothing in the checkout was written to. (2) For each case in {no flags}, {--preset medium}, {--preset low}, {--preset high}, {--preset medium --shape config-only}, {--preset low --shape config-only}, {--preset high --shape config-only}: `mkdir -p /tmp/fh3583/m/<case> && cd /tmp/fh3583/m/<case> && git init -q . && /tmp/fh3583/fishhawk init <flags>` and record the exit status. (3) For each written .fishhawk/workflows.yaml: `grep -E ''^\s*-?\s*provider:'' <file> | sort | uniq -c` (this pattern cannot match a `#`-prefixed line) and `grep -cE ''^\s*#.*provider: (claudecode|codex)'' <file>`. (4) Parse each file with `yq -o=json <file> | python3` and, for every workflow and every stage carrying a `reviewers` block, print reviewers.agents, reviewers.human and reviewers.authority. (5) Corroborate on the running target: POST http://localhost:8090/mcp tools/call fishhawk_init with arguments {} (Mcp-Name: fishhawk_init, Mcp-Method: tools/call, Mcp-Protocol-Version: 2026-07-28, operator bearer) and inspect structuredContent.workflow_yaml the same way.'
assertions:
    expected: 'fishhawk init at the default (medium) preset exits 0 and writes a spec whose plan-stage and implement-stage reviewer agents both declare provider: anthropic, with no uncommented claudecode or codex reviewer entry; same for --preset low, --preset high and --shape config-only.'
    observed_at_record: 'All 7 scaffolds (default/no flags, --preset medium, --preset low, --preset high, and --shape config-only at each of medium/low/high) exited 0. In every written .fishhawk/workflows.yaml, every uncommented `provider:` line reads `anthropic` (4 per file: 2 on the plan stage, 2 on the implement stage) and there is no uncommented `provider: claudecode` or `provider: codex` anywhere. Parsed: workflows.feature_change plan stage reviewers.agents = [{provider:anthropic, model:claude-opus-4-8},{provider:anthropic, model:claude-sonnet-4-6}] and the implement stage carries the identical pair; both stages authority=advisory, human=1. The 4 remaining claudecode/codex mentions per file are all inside `#` comment lines, in a clearly-labelled ''A HOST deployment that has the agent CLIs on PATH can use the subprocess providers instead'' alternative block. Cross-checked against the RUNNING target: POST /mcp tools/call fishhawk_init {} returns workflow_yaml (sha256 ba86e2d9232bdf88838a2497609ae4c676910861c815c87ea6a839272a278c47) whose only uncommented reviewer providers are anthropic, and those bytes cmp-equal the shipped preset files at the PR head.'
    repro_handle: cd $(mktemp -d) && git init -q . && /tmp/fh3583/fishhawk init --preset medium && grep -E '^\s*-?\s*provider:' .fishhawk/workflows.yaml
