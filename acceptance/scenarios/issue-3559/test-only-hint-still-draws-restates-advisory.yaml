id: scenario:issue-3559/test-only-hint-still-draws-restates-advisory
statement: For a plan whose sole acceptance criterion carries a verify_hint naming only a _test.go path or a go test -run invocation, the plan gate's acceptance pre-check still records a criterion_restates_test finding and a restates_test_count of 1.
verify_hint: 'GET /v0/runs/{run_id}/audit on the localhost preview: the persisted audit row of category plan_acceptance_precheck carries restates_test_count 1 and a findings entry whose rule is criterion_restates_test.'
steps: 'Three independent fresh seeds, each: POST http://localhost:8090/v0/dev/fixtures {"scenario":"plan-gate-criteria"}; POST /v0/runs/{run}/signing-key; build plan-standard-v1-example.json with ONE acceptance criterion whose verify_hint is (a) ''go test -run TestAuditExport ./backend/internal/api/'', (b) ''Covered by backend/internal/plan/acceptance_check_test.go'', (c) ''TestTestOnlyCriteria in backend/internal/plan/acceptance_check_test.go passes''; sign via /v0/dev/sign; POST /v0/runs/{run}/plan?stage_id={plan} -> 201; GET /v0/runs/{run}/audit?category=plan_acceptance_precheck.'
assertions:
    expected: restates_test_count 1 and a criterion_restates_test finding
    observed_at_record: '(a) run 4ecf5eff-ea31-4a65-a62a-4ac3a9bb5df5: restates_test_count=1, findings criterion_restates_test (criterion exporter-filters-by-date) + no_observable_criterion; (b) run ae8832b7-e21b-42ef-9c0c-946f5e92df80: restates_test_count=1 + criterion_restates_test; (c) run e7c19d72-24f0-4715-9a5b-26b2804e13c9: restates_test_count=1 + criterion_restates_test. Note: _test.go hints whose path contains the substring ''audit_'' (e.g. audit_export_test.go) are silent because the pre-existing observable-surface marker ''audit_'' matches them — verified identical at HEAD~1, so not introduced by this change.'
    repro_handle: GET /v0/runs/ae8832b7-e21b-42ef-9c0c-946f5e92df80/audit?category=plan_acceptance_precheck
