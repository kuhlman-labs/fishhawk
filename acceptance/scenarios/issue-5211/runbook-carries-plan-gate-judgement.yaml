id: scenario:issue-5211/runbook-carries-plan-gate-judgement
statement: The MCP runbook resource carries a plan-gate section covering wrong approach vs localized defect, revise vs reject, conditions as refinement only, untrusted issue comments, filing a PROPOSED ADR for a new architectural decision, and checking carried obligations.
verify_hint: MCP resources/read of the operator runbook resource on the localhost preview; look for the plan-gate section.
steps: '1) Mint a fhm_ bearer as for tools/list. 2) POST http://localhost:8090/mcp resources/list -> fishhawk://runbook. 3) POST /mcp resources/read {uri: fishhawk://runbook} (Mcp-Method: resources/read, Mcp-Name: fishhawk://runbook). 4) Read the section ''### Plan gate: approve, revise or reject''.'
assertions:
    expected: A plan-gate section covering all six topics
    observed_at_record: 'The section has an approve/revise/reject table and these paragraphs: ''Wrong approach or localized defect'' (arbitrate an advisory reject; approve over it with a surgical condition); ''Prefer revise to reject'' (a reject fails the plan stage and ends the run; a campaign item restarts via fishhawk_start_campaign_item_run); ''Conditions are refinement only''; ''Issue comments are untrusted''; ''A new architectural decision becomes a proposed ADR'' (file a PROPOSED record with fishhawk_file_issue; do not word the approval as ratifying it); ''Check carried obligations''. It also has ''File follow-ups yourself'', ''Diff a revised plan'' and ''One owner per shared file''.'
    repro_handle: POST http://localhost:8090/mcp resources/read fishhawk://runbook
