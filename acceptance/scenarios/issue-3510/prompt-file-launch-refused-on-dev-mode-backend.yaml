id: scenario:issue-3510/prompt-file-launch-refused-on-dev-mode-backend
statement: 'A runner launched directly with --prompt-file, with FISHHAWK_FORGE_WRITES absent from its environment and --backend-url pointing at a backend whose /healthz answers dev_mode: true, exits non-zero before invoking any agent and its stderr carries a runner_failed line with reason forge_writes_denied, category C and source healthz, with no pull_request_opened, implement_child_pushed, implement_fixup_pushed or acceptance_scenarios_pushed event.'
verify_hint: 'CLI exit code + stderr of bin/fishhawk-runner --prompt-file <file> --backend-url <preview daemon URL> with the env var unset; the preview daemon (scripts/dev preview, dev mode) is the localhost target whose /healthz advertises dev_mode: true.'
steps: 'Built bin from the sanctioned checkout /tmp/fishhawk-acceptance-tree-6ee0e134-980d-4121-acae-1f69e803451a-5739d0d4-3b7a-4bcc-a21f-8c4ef1013bc4 (HEAD d6e150e9, identical to the preview''s /healthz git_sha d6e150e9; checkout left untouched): cd runner && go build -o /tmp/fh-acc-runner ./cmd/fishhawk-runner. Wrote a stub agent /tmp/fh3510/stub-agent (records every argv to /tmp/fh3510/agent-calls.log; answers --version; touches /tmp/fh3510/agent-invoked-for-work on any non-version call), a throwaway git repo /tmp/fh3510/work with one commit, and /tmp/fh3510/prompt.txt (''You are a stub prompt. Do nothing.''). Confirmed GET http://localhost:8090/healthz returns {"status":"ok",...,"dev_mode":true}. Ran env -u FISHHAWK_FORGE_WRITES ANTHROPIC_API_KEY=dummy FISHHAWK_AGENT_BIN=/tmp/fh3510/stub-agent /tmp/fh-acc-runner --prompt-file /tmp/fh3510/prompt.txt --backend-url http://localhost:8090 --run-id 11111111-1111-4111-8111-111111111111 --workflow feature_change --stage implement --github-repo kuhlman-labs/fishhawk --working-dir /tmp/fh3510/work --timeout 30s with FISHHAWK_FORGE_WRITES removed from the env (env -u; verified <unset> inside the same env). Captured exit code, stderr (/tmp/fh3510/c1.err), stdout, and the stub agent''s call log.'
assertions:
    expected: Non-zero exit before any agent invocation; stderr runner_failed line with reason forge_writes_denied, category C, source healthz; no push/PR events.
    observed_at_record: 'Exit code 1. stderr: runner_started (prompt_file=/tmp/fh3510/prompt.txt, agent_binary=stub) -> gate_isolation_configured -> coercion_registry -> {"event":"forge_writes_healthz_probe","backend_url":"http://localhost:8090","detail":"/healthz advertises dev_mode: true","outcome":"dev_mode"} -> {"event":"runner_failed","reason":"forge_writes_denied","category":"C","source":"healthz",...}. Stub agent log shows only the pre-flight `--version` probe (part of runner_started''s agent_version); no work invocation (no agent-invoked-for-work marker). Zero pull_request_opened / implement_child_pushed / implement_fixup_pushed / acceptance_scenarios_pushed events on stderr or stdout (stdout empty).'
    repro_handle: env -u FISHHAWK_FORGE_WRITES ANTHROPIC_API_KEY=dummy FISHHAWK_AGENT_BIN=/tmp/fh3510/stub-agent /tmp/fh-acc-runner --prompt-file /tmp/fh3510/prompt.txt --backend-url http://localhost:8090 --run-id 11111111-1111-4111-8111-111111111111 --workflow feature_change --stage implement --github-repo kuhlman-labs/fishhawk --working-dir /tmp/fh3510/work --timeout 30s; echo EXIT=$?
