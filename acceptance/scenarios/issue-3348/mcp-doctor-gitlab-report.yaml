id: scenario:issue-3348/mcp-doctor-gitlab-report
statement: The fishhawk_doctor MCP tool called with repo set to a nested GitLab path and forge set to gitlab returns a report (no validation error) whose forge is gitlab and which carries no merge_gate key.
verify_hint: 'MCP tool result, decided by the in-process hermetic harness in backend/internal/mcpserver/onboard_test.go (step 8) — no live MCP client is needed: TestDoctor_ForgePassthrough drives the doctor tool with repo=gitlab-com/customer-success/solutions-architecture/coe/gitlab-migrator and forge=gitlab against the doctorFakeBackend and asserts the readiness query carries both untouched (no validation error); TestOnboardingReadinessReport_GitLabBodyMirrorsBackendTags decodes a literal gitlab-family backend body and asserts Forge==gitlab, App.Note lands and MergeGate is nil; and the tool-output re-emit assertion (the TestDoctor_MergeGateAbsent_PreservesAbsence pattern) asserts the fishhawk_doctor result''s wire bytes carry "forge":"gitlab" and "note" and NO merge_gate key. Together those decide exactly this claim on the tool result surface.'
steps: 'Decisive surface was the LIVE MCP route: POST http://localhost:8090/mcp {jsonrpc 2.0, method tools/call, params {name fishhawk_doctor, arguments {repo gitlab-com/customer-success/solutions-architecture/coe/gitlab-migrator, forge gitlab}, _meta {io.modelcontextprotocol/protocolVersion 2026-07-28, io.modelcontextprotocol/clientCapabilities {}}}} with the operator bearer and headers Mcp-Protocol-Version 2026-07-28, Mcp-Method tools/call, Mcp-Name fishhawk_doctor; inspected result.isError, content[0].text wire bytes and structuredContent. Control: the same call with {repo a/b/c, forge github}. Supporting (Posture B, sanctioned checkout /tmp/fishhawk-acceptance-tree-…, read-only): `go test ./internal/mcpserver/ -run ''TestDoctor_ForgePassthrough|TestOnboardingReadinessReport_GitLabBodyMirrorsBackendTags|TestDoctor_MergeGateAbsent'' -count=1 -v`. Also confirmed via tools/list that fishhawk_doctor''s inputSchema exposes repo (nested GitLab paths allowed; GITHUB_REPOSITORY then CI_PROJECT_PATH fallback) and forge (github|gitlab).'
assertions:
    expected: fishhawk_doctor with a nested GitLab repo and forge=gitlab returns a report (no validation error) whose forge is gitlab and which carries no merge_gate key.
    observed_at_record: '200, isError absent; wire text {"report":{"app":{"installed":false,"reason":"project is not visible to the deployment GitLab credential; …"},"forge":"gitlab","repo":"gitlab-com/customer-success/solutions-architecture/coe/gitlab-migrator","reviewers":[],"scopes":{…},"spec":{"note":"project is not resolvable with the deployment GitLab credential; cannot fetch the workflow spec","source":"unavailable","valid":false}}} — contains "forge":"gitlab" and "note", contains no merge_gate; structuredContent.report identical. Control a/b/c forge=github -> isError true ''onboarding readiness: fishhawk: HTTP 400 (validation_failed): github repositories are owner/name; a nested path is a GitLab project — pass forge=gitlab …''. Hermetic tests: TestDoctor_ForgePassthrough PASS, TestDoctor_MergeGateAbsent_PreservesAbsence (key_omitted, key_explicit_null) PASS, TestOnboardingReadinessReport_GitLabBodyMirrorsBackendTags PASS; ok github.com/kuhlman-labs/fishhawk/backend/internal/mcpserver.'
    repro_handle: POST http://localhost:8090/mcp tools/call fishhawk_doctor {"repo":"gitlab-com/customer-success/solutions-architecture/coe/gitlab-migrator","forge":"gitlab"} (bearer; Mcp-Protocol-Version 2026-07-28; params._meta protocolVersion+clientCapabilities)
