id: scenario:issue-4874/vouched-head-is-expected-head
statement: For a run whose head moved through a verified operator vouch (pull_request_opened S, then a verified vouch S→V, then the acceptance dispatch), the acceptance prompt names the vouched commit V as acceptance_expected_head_sha, not the seed S.
