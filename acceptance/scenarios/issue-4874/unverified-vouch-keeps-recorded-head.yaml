    observed_at_record: acceptance_expected_head_sha=6666666666666666666666666666666666666666 (the recorded pull_request_opened head), not 7777…
    repro_handle: GET /v0/stages/31bef872-1936-4448-bb11-658a145221af/prompt (signed)
