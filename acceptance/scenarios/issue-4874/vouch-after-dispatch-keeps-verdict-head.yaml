id: scenario:issue-4874/vouch-after-dispatch-keeps-verdict-head
statement: 'A verified vouch recorded AFTER the acceptance dispatch anchor does not re-bind that dispatch''s verdict: a signed verdict shipped for that stage is recorded against the pre-vouch head.'
verify_hint: Same fixture; on vouched-after-dispatch-run ship a signed transcript then a signed verdict (POST /v0/runs/{run}/acceptance/transcript?stage_id=…, POST /v0/runs/{run}/acceptance?stage_id=…), then GET /v0/runs/{run}/audit?category=acceptance_outcome_recorded → head_sha equals the seeded pull_request_opened sha, not the later vouched sha.
steps: 1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"acceptance-vouched-head"} and read run key vouched-after-dispatch-run (pull_request_opened aaaa…, acceptance_dispatched, THEN verified vouch aaaa…→bbbb…). 2) Sign and POST a transcript to /v0/runs/{run}/acceptance/transcript?stage_id={acceptance}, then sign and POST a passed verdict referencing it to /v0/runs/{run}/acceptance?stage_id={acceptance}. 3) GET /v0/runs/{run}/audit?category=acceptance_outcome_recorded.
assertions:
