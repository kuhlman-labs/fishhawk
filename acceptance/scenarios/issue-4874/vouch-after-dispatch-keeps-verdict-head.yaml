    observed_at_record: verdict 201; acceptance_outcome_recorded head_sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa (the pre-vouch head), not bbbb…. The prompt for this stage names bbbb…, as the fixture description says.
