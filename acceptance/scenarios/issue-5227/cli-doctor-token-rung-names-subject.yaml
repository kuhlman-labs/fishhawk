id: scenario:issue-5227/cli-doctor-token-rung-names-subject
statement: fishhawk doctor --repo <repo> against the preview prints a token valid rung naming the credential source and, when readiness answers, the subject and credential kind. Stdout never contains the token value.
verify_hint: 'CLI stdout: run fishhawk doctor with --token <preview bearer> --repo <repo>; read the `token valid` line; search stdout for the token string (must be absent).'
steps: 'Built fishhawk from the sanctioned checkout. Minted a run-bound fhm_ for a plan-gate-parked seed (fixtures, then signing-key, then dev/sign ''{}'', then mcp-token). Ran fishhawk doctor --working-dir /tmp/acc5227w/chk --backend-url http://localhost:8090 --repo kuhlman-labs/fishhawk --timeout 5s three ways: --token <fhm_>; FISHHAWK_TOKEN=<fhm_> with no flag; and both set to the same value (S5). Grepped every stdout capture for the full token and its secret part.'
assertions:
    expected: token valid rung names the credential source and, when readiness answers, subject and credential kind; stdout never contains the token
    observed_at_record: '--token and both-equal: ''token valid ... machine token (fhm_) via --token; acts as mcp:run:979031e0-92c1-420b-9b74-621d944b7631 (mcp_run)  warn''. Env only: ''... via $FISHHAWK_TOKEN; acts as mcp:run:979031e0-... (mcp_run)''. 0 token matches across all captures. The warn is because the run-bound token lacks the operator scopes.'
    repro_handle: fishhawk doctor --working-dir <repo> --backend-url http://localhost:8090 --token <fhm_> --repo kuhlman-labs/fishhawk | grep '^token valid'
