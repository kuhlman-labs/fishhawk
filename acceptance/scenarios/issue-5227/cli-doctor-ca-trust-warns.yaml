id: scenario:issue-5227/cli-doctor-ca-trust-warns
statement: Running fishhawk doctor with --backend-url pointing at an https://localhost URL and NODE_EXTRA_CA_CERTS unset prints a warn on the local CA trust rung. Its hint names the symptom `unable to verify the first certificate` and docs/local-tls.md. The same run with a plain http backend URL reports that rung as skipped.
verify_hint: 'CLI stdout: run fishhawk doctor twice (https://localhost:8443 with NODE_EXTRA_CA_CERTS unset, then http://localhost:<preview port>) and read the `local CA trust` line and its hint.'
steps: 'Posture B binary: fishhawk CLI built from the sanctioned checkout. In the throwaway repo /tmp/acc5227/chk, ran `env -u NODE_EXTRA_CA_CERTS fishhawk doctor --working-dir . --backend-url https://localhost:8443 --token <fhm_> --repo kuhlman-labs/fishhawk --timeout 5s`, then the same with --backend-url http://localhost:8090.'
assertions:
    expected: warn with a hint naming the symptom and docs/local-tls.md over https; skipped over http
    observed_at_record: 'https run: ''local CA trust  NODE_EXTRA_CA_CERTS is unset for https loopback localhost:8443  warn''. Its hint reads: ''a claude session that fails MCP calls with `unable to verify the first certificate` while already authenticated is missing the local CA ... (see docs/local-tls.md § Second repository on the same host)''. That section exists at docs/local-tls.md:148. http run: ''local CA trust  skipped — not an https URL (no TLS to trust)''.'
    repro_handle: env -u NODE_EXTRA_CA_CERTS fishhawk doctor --backend-url https://localhost:8443 --repo kuhlman-labs/fishhawk
