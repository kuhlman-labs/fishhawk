id: scenario:issue-5227/readiness-scopes-name-subject
statement: GET /v0/onboarding/readiness?repo=<repo> returns 200, and its scopes object carries subject equal to the authenticated caller's subject and a credential_kind. The response body does not contain the bearer token's value.
verify_hint: 'HTTP: call GET /v0/onboarding/readiness on the preview with the available bearer; read scopes.subject and scopes.credential_kind; search the raw body for the bearer string (must be absent).'
steps: 'POST /v0/dev/fixtures {"scenario":"plan-gate-parked"} gave run 979031e0-92c1-420b-9b74-621d944b7631. POST /v0/runs/{run}/signing-key {}, then POST /v0/dev/sign over ''{}'' with X-Fishhawk-Dev-Private-Key, then POST /v0/runs/{run}/mcp-token with X-Fishhawk-Signature, giving fhm_ bearer. GET /v0/onboarding/readiness?repo=kuhlman-labs/fishhawk with Authorization: Bearer <fhm_>. Grepped the raw body for the full token and for its secret part after ''fhm_''.'
assertions:
    expected: 200; scopes.subject equals the authenticated caller's subject; credential_kind present; bearer value absent
    observed_at_record: HTTP 200; scopes = {adequate:false, required:[...], missing:[...], subject:'mcp:run:979031e0-92c1-420b-9b74-621d944b7631', credential_kind:'mcp_run'}. The subject is the run-bound caller's subject. 0 matches for either token string in the body.
    repro_handle: 'curl -H ''Authorization: Bearer <fhm_>'' ''http://localhost:8090/v0/onboarding/readiness?repo=kuhlman-labs/fishhawk'''
