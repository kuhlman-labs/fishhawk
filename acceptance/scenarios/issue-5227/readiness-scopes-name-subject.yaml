id: scenario:issue-5227/readiness-scopes-name-subject
statement: GET /v0/onboarding/readiness?repo=<repo> returns 200, and its scopes object carries subject equal to the authenticated caller's subject and a credential_kind. The response body does not contain the bearer token's value.
verify_hint: 'HTTP: call GET /v0/onboarding/readiness on the preview with the available bearer; read scopes.subject and scopes.credential_kind; search the raw body for the bearer string (must be absent).'
steps: POST /v0/dev/fixtures plan-gate-parked -> run 61e8bea2-...; minted a run-bound fhm_ bearer (signing-key, dev/sign '{}', mcp-token). GET http://localhost:8090/v0/onboarding/readiness?repo=kuhlman-labs/fishhawk with that bearer, then grepped the raw body for the full token and for its secret part. Repeated with a second fhm_ bearer minted for run 5681bc1a-... (trace-upload-target seed). Also called it unauthenticated.
assertions:
    expected: 200; scopes.subject = caller's subject; credential_kind present; no bearer bytes in the body
    observed_at_record: '200. scopes.subject = ''mcp:run:61e8bea2-acf7-4b3e-b7eb-1b6a11099b1b'' and scopes.credential_kind = ''mcp_run''. The second bearer yields subject ''mcp:run:5681bc1a-...'', so the subject tracks the caller (docs/api/v0.md documents fhm_ subjects as mcp:run:<uuid>). Token string occurrences in the body: 0. Unauthenticated: 401 authentication_required.'
    repro_handle: 'curl -s ''http://localhost:8090/v0/onboarding/readiness?repo=kuhlman-labs/fishhawk'' -H ''Authorization: Bearer <fhm_>'''
