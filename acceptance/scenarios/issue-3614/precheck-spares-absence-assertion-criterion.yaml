id: scenario:issue-3614/precheck-spares-absence-assertion-criterion
statement: Shipping a plan that carries one unmarked live-target criterion alongside one criterion whose text asserts the absence of that dependency and whose verify_hint names a loopback procedure produces a plan_acceptance_precheck audit entry whose undecidable_criterion and missing_live_validation_marker findings both name the unmarked criterion only, with undecidable_count and live_validation_marker_count each equal to 1.
verify_hint: 'A persisted audit row on the localhost preview. Seed the plan-gate-parked scenario, ship that two-criterion plan through the plan-upload route, then GET /v0/runs/{run_id}/audit and read the plan_acceptance_precheck entry: its findings array carries exactly one undecidable_criterion and one missing_live_validation_marker, the criterion_id on BOTH is the unmarked live-target criterion, no finding of either rule names the absence-asserting criterion, and the payload''s undecidable_count and live_validation_marker_count are each 1.'
steps: '1) POST http://localhost:8090/v0/dev/fixtures {"scenario":"plan-gate-parked"}; POST /v0/runs/{run}/signing-key; sign the two-criterion plan via /v0/dev/sign; POST /v0/runs/{run}/plan?stage_id={plan} -> 201; GET /v0/runs/{run}/audit -> entries [plan_coerced, plan_generated, plan_scope_precheck, plan_surface_sweep] and NO plan_acceptance_precheck, because plan-gate-parked''s workflow configures no acceptance stage (the precheck is stage-conditional by design, backend/internal/server/plan.go:580-590). 2) Re-ran on the sibling seed that carries an acceptance stage: POST /v0/dev/fixtures {"scenario":"plan-gate-criteria"} -> run + plan stage (awaiting_approval) + acceptance stage; POST /v0/runs/{run}/signing-key; POST /v0/dev/sign over the plan bytes; POST /v0/runs/{run}/plan?stage_id={plan} with X-Fishhawk-Signature -> 201. The plan is docs/spec/examples/plan-standard-v1-example.json with verification.acceptance_criteria = [gitlab-run-pushes-to-gitlab-host (UNMARKED; statement: ''A GitLab-family run pushes its implementation branch to the GitLab host: the push lands on the live GitLab forge and the merge request is opened against the deployed GitLab instance.''), git-op-without-credential-returns-instead-of-blocking (statement: ''A git operation against a loopback endpoint that offers no usable credential returns a non-zero exit ... No live forge, network egress, or deployed environment is required.''; verify_hint: loopback listener on 127.0.0.1, assert CLI exit code and stderr)]. 3) GET /v0/runs/{run}/audit?category=plan_acceptance_precheck. (Also shipped to a trace-upload-target run: that workflow likewise wrote no precheck entry.)'
assertions:
    expected: Exactly one undecidable_criterion and one missing_live_validation_marker, both naming the unmarked live-target criterion; none naming the absence-asserting criterion; undecidable_count=1 and live_validation_marker_count=1.
    observed_at_record: 'plan_acceptance_precheck payload: findings = [{rule undecidable_criterion, criterion_id gitlab-run-pushes-to-gitlab-host, detail ''criterion statement requires a live forge round-trip ...''}, {rule missing_live_validation_marker, criterion_id gitlab-run-pushes-to-gitlab-host}]; no finding names git-op-without-credential-returns-instead-of-blocking; undecidable_count=1, live_validation_marker_count=1, criteria_count=2, all_skip_short_circuit=false.'
    repro_handle: Follow steps_taken against http://localhost:8090
