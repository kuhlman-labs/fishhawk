id: scenario:issue-4240/validate-rejects-group-and-groups
statement: '`fishhawk validate` on a workflow-v2 file whose stage `concurrency` block declares both `group` and `groups` (and, separately, both `limit` and `groups`) exits non-zero, and its error output names that stage''s concurrency block and the conflicting field.'
verify_hint: 'CLI: write two v2 workflow files (group+groups; limit+groups), run `fishhawk validate <file>` on each, and check the non-zero exit code and the stderr naming /concurrency and group or limit.'
steps: 'Built fishhawk from the sanctioned checkout. Wrote two v2 files, each with workflows.wf and an implement stage ''apply'' (executor agent claude-code). The first has concurrency {group: deploy, groups: [{group: deploy, scope: repository}]}; the second has concurrency {limit: 2, groups: [{group: deploy, scope: repository}]}. Ran `fishhawk validate <file>` on each. Cross-checked both against the preview via MCP fishhawk_validate {workflow_spec}.'
assertions:
    expected: Non-zero exit, with stderr naming the stage's concurrency block and the conflicting field.
    observed_at_record: 'group+groups: exit 1, stderr ''group_groups.yaml/workflows/wf/stages/0/concurrency/group: false schema''. limit+groups: exit 1, stderr ''.../stages/0/concurrency/limit: false schema''. stdout is empty for both. The preview''s validator returns the same pointers.'
