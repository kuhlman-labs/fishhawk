id: scenario:issue-4240/validate-rejects-group-and-groups
statement: '`fishhawk validate` on a workflow-v2 file whose stage `concurrency` block declares both `group` and `groups` (and, separately, both `limit` and `groups`) exits non-zero, and its error output names that stage''s concurrency block and the conflicting field.'
verify_hint: 'CLI: write two v2 workflow files (group+groups; limit+groups), run `fishhawk validate <file>` on each, and check the non-zero exit code and the stderr naming /concurrency and group or limit.'
steps: 'Built fishhawk from the sanctioned checkout (cd <tree>/cli && go build ./cmd/fishhawk). Wrote gg.yaml (v2, stage apply implement/claude-code, concurrency {group: deploy, groups: [{group: deploy, scope: repository}]}) and lg.yaml (concurrency {limit: 2, groups: [{group: deploy, scope: repository}]}). Ran `fishhawk validate` on each; cross-checked through the preview''s MCP fishhawk_validate using an fhm_ bearer minted from trace-upload-target.'
assertions:
    expected: Non-zero exit naming the concurrency block and the conflicting field.
    observed_at_record: 'gg: exit 1, ''gg.yaml/workflows/wf/stages/0/concurrency/group: false schema''. lg: exit 1, ''lg.yaml/workflows/wf/stages/0/concurrency/limit: false schema''. The preview agreed.'
    repro_handle: fishhawk validate gg.yaml; fishhawk validate lg.yaml
