id: scenario:issue-4240/validate-rejects-host-key-limit
statement: '`fishhawk validate` rejects a `concurrency.groups` entry `{group: implement, scope: host, limit: 2}` (and, separately, `{group: verify, scope: host, limit: 1}`): it exits non-zero, naming the entry and stating that the host default limit governs that group. The same file without the `limit` on that entry validates.'
verify_hint: 'CLI: `fishhawk validate <file>`; check the non-zero exit and stderr naming .../concurrency/groups/0 and the host default limit; then remove the limit and check exit 0.'
steps: 'Built the CLI from the sanctioned checkout. Wrote v2 files (stage apply, implement, claude-code) with concurrency.groups set to: [{group: implement, scope: host, limit: 2}], [{group: verify, scope: host, limit: 1}], [{group: preview-target, scope: host, limit: 1}] (H1), [{group: implement, scope: host}] and [{group: verify, scope: host}]. Ran `fishhawk validate` on each; cross-checked through the preview''s MCP fishhawk_validate.'
assertions:
    expected: Non-zero exit naming the entry and the host default limit; exit 0 without the limit.
    observed_at_record: 'The three limit files: exit 1 at .../concurrency/groups/0/limit, ''declares a limit: a host-scoped group is shared by every repository on the host ... the host''s implement and verify groups take the host default limits and any other host-scoped group is held at limit 1 ...''. The no-limit files: exit 0. The preview agreed.'
    repro_handle: fishhawk validate himpl.yaml
