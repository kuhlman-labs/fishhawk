id: scenario:issue-4240/validate-rejects-host-key-limit
statement: '`fishhawk validate` rejects a `concurrency.groups` entry `{group: implement, scope: host, limit: 2}` (and, separately, `{group: verify, scope: host, limit: 1}`): it exits non-zero, naming the entry and stating that the host default limit governs that group. The same file without the `limit` on that entry validates.'
verify_hint: 'CLI: `fishhawk validate <file>`; check the non-zero exit and stderr naming .../concurrency/groups/0 and the host default limit; then remove the limit and check exit 0.'
steps: 'Ran `fishhawk validate` on single-entry groups files: {group: implement, scope: host, limit: 2}, {group: verify, scope: host, limit: 1}, and, per condition H1, {group: preview-target, scope: host, limit: 1}. Then ran the implement and verify files with the limit removed. Cross-checked against the preview''s MCP fishhawk_validate.'
assertions:
    expected: Non-zero exit naming the entry, stating the host default limit governs, and passing once the limit is removed. H1 extends the rule to non-legacy host names.
    observed_at_record: 'All three limit-bearing files: exit 1, with stderr ''.../concurrency/groups/0/limit: concurrency.groups entry (scope "host", group "<name>") declares a limit: a host-scoped group is shared by every repository on the host, so its limit belongs to the host operator ...; the host''s implement and verify groups take the host default limits and any other host-scoped group is held at limit 1 until host-declared capacity (#4241). Remove limit, or declare the group with scope repository''. Without the limit: exit 0, OK. The preview returns the same messages.'
