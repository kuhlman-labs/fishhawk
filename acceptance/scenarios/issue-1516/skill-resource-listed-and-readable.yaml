id: scenario:issue-1516/skill-resource-listed-and-readable
statement: A client connected to the preview's MCP server sees `fishhawk://onboarding-skill` (MIME text/markdown) in resources/list, and resources/read on it returns a SKILL.md-shaped document (YAML frontmatter with name and description) that walks fishhawk_doctor before fishhawk_init and names `.fishhawk/workflows.yaml` as the file to write.
verify_hint: 'MCP tool/resource surface: connect to the preview''s /mcp streamable-HTTP endpoint (or bin/fishhawk-mcp over stdio) with a bearer, call resources/list and resources/read for fishhawk://onboarding-skill, inspect the returned text.'
steps: 'Against the preview''s POST http://localhost:8090/mcp (sessionless 2026-07-28 protocol: headers Mcp-Protocol-Version 2026-07-28 + Mcp-Method, params._meta with io.modelcontextprotocol/protocolVersion and clientCapabilities, operator bearer fhk_… minted by inserting a sha256-hashed row into the preview DB api_tokens via docker exec fishhawk-postgres): called resources/list, then resources/read {uri fishhawk://onboarding-skill} with Mcp-Name fishhawk://onboarding-skill. Saved the returned text to /tmp/fh1516/SKILL.md and inspected frontmatter, ordering, file name, and forge/owner URLs.'
assertions:
    expected: fishhawk://onboarding-skill (text/markdown) in resources/list; resources/read returns a SKILL.md-shaped doc with name+description frontmatter walking fishhawk_doctor before fishhawk_init and naming .fishhawk/workflows.yaml.
