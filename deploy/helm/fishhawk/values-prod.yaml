# Production-posture override layer for the fishhawk chart.
# Renders standalone: `helm template fishhawk . -f values-prod.yaml`.
#
# COMPLETE AS SHIPPED: every field an install needs is set to a concrete,
# working value — a real IngressClass (nginx), a real hostname, a real
# cert-manager ClusterIssuer — so `helm install -f values-prod.yaml` produces
# working URLs rather than half-filled placeholders. Substitute the hostname,
# IngressClass and ClusterIssuer for your own, and pre-create the Secret named
# by `existingSecret` (this file leaves secrets at the `existing` default);
# fishhawk.validateSecretContract fails the render if that name is empty.
#
# The derived URLs are asserted against this hostname by
# scripts/test-helm-render case r1 — "it rendered" is not the criterion.

# Stays prod (values.yaml default): no dev-only conveniences, real secrets.
profile: prod

image:
  # Pin to an immutable sha-<short> or vX.Y.Z tag for a real deploy — do not run
  # the rolling `main` tag in production.
  tag: ""

# Public ingress + cert-manager TLS. config.externalUrl / config.oauthCallbackUrl
# below are left empty so they DERIVE from ingress.host (https, since tls is on);
# config.oauthClientId below is what makes the callback derive (OAuth all-or-none):
#   FISHHAWKD_OAUTH_CLIENT_ID     = <your OAuth App client id>
#   FISHHAWKD_EXTERNAL_URL        = https://app.fishhawk.example
#   FISHHAWKD_OAUTH_CALLBACK_URL  = https://app.fishhawk.example/v0/auth/github/callback
ingress:
  enabled: true
  className: nginx
  host: app.fishhawk.example
  tls:
    enabled: true
    # ClusterIssuer cert-manager uses to mint the cert. cert-manager (not this
    # chart) provisions the TLS Secret; the ClusterIssuer must already exist.
    clusterIssuer: letsencrypt-prod

config:
  # Left empty on purpose — derived from ingress.host above. Set explicitly only
  # to override the derived value (e.g. a separate SPA origin for externalUrl).
  externalUrl: ""
  oauthCallbackUrl: ""
  # Substitute your own GitHub OAuth App client id (public, not a secret; the
  # matching client secret goes in the Secret named by existingSecret as
  # FISHHAWKD_OAUTH_CLIENT_SECRET). Setting it makes the callback URL above derive
  # from ingress.host and makes the client secret required. Clear it (and
  # config.oauthCallbackUrl) for an OAuth-OFF install.
  oauthClientId: "substitute-your-oauth-client-id"

# Split topology for horizontal scale-out (commented; allInOne is the default).
# Uncomment to run a multi-replica API tier plus a single-replica worker tier.
# The api pods run no background workers (every FISHHAWKD_ENABLE_* is forced off)
# and dedup webhook deliveries via the Postgres store, so they scale safely; the
# `-worker` Deployment stays at one replica (the worker singleton invariant,
# #851). Enable the worker toggles you need under `workers:` — they take effect
# only on the worker pod.
# deployment:
#   mode: split
#   api:
#     replicaCount: 3
# workers:
#   slaTimer: true
#   dispatchWatchdog: true
#   reactionPoller: true
#   mergeReconciler: true
#   childCompletionSweeper: true
#   invariantMonitor: true

# Mode 1 (self-hosted, single-tenant) example — commented; the default is the
# hosted multi-tenant posture. Uncomment `accountKey` alone for a GitHub
# Enterprise install: fishhawkd bootstraps that one implicit account at startup
# and every member of the enterprise auto-joins at sign-in (granularity and
# auto-join role then default INTERNALLY to enterprise / member). Setting any
# other key below WITHOUT accountKey is a startup error, not hosted mode.
# See docs/deploy/self-hosted.md.
# singleTenant:
#   accountKey: acme-corp
#   granularity: enterprise
#   autoJoinRole: member
#   displayName: Acme Corp
#   provider: github
#
# GHES / EMU endpoint overrides that usually accompany Mode 1:
# config:
#   githubApiUrl: https://ghes.acme.example/api/v3
#   githubUploadUrl: https://ghes.acme.example/api/uploads
#   oauthAuthorizeUrl: https://ghes.acme.example/login/oauth/authorize
#   oauthTokenUrl: https://ghes.acme.example/login/oauth/access_token
#   oauthUserUrl: https://ghes.acme.example/api/v3/user
#   oauthOrgsUrl: https://ghes.acme.example/api/v3/user/orgs
