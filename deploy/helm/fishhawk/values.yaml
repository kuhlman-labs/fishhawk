# Default values for the fishhawk chart.
# Override per-environment with `-f my-values.yaml` (see values-local.yaml for a
# localhost-flavored example).

# Deployment profile: `prod` (default) or `local`. This is the local-vs-prod
# signal the Secret guard (fishhawk.validateSecrets) keys off of — dev-only
# conveniences (a chart-managed Secret, in-cluster Postgres/MinIO default
# credentials) are permitted ONLY when profile is `local`. values-local.yaml
# sets profile: local. An operator copying values-local for a real cluster MUST
# change this back to prod (and supply real secrets) or the render fails loud.
profile: prod

image:
  # Published fishhawkd image built by backend/Dockerfile (#168) and pushed by
  # backend-release.yml. Do not build it here — the chart only references it.
  repository: ghcr.io/kuhlman-labs/fishhawkd
  # Image tag. Empty falls back to .Chart.AppVersion (the `main` rolling tag).
  # Pin to an immutable `sha-<short>` or `vX.Y.Z` tag for real deploys.
  tag: ""
  pullPolicy: IfNotPresent

# Topology mode — how the fishhawkd workload is split across Deployments.
#   allInOne (default) — one Deployment, replicaCount pods, with the background
#                        workers co-located. Safe out of the box; an existing
#                        install upgrades in place (the Deployment keeps its
#                        name/labels). Scaling past 1 replica with a worker
#                        toggle on is rejected by fishhawk.validateTopology,
#                        because the worker singletons (#851) are not yet
#                        leader-elected and would race the timers/reconcilers.
#   split              — a horizontally-scalable `-api` Deployment
#                        (deployment.api.replicaCount pods, every
#                        FISHHAWKD_ENABLE_* forced off) plus a single-replica
#                        `-worker` Deployment that owns the worker singletons.
#                        The Service routes only to the api pods. This is the
#                        way to scale fishhawkd horizontally while workers run.
deployment:
  mode: allInOne
  api:
    # API-tier replica count — used ONLY in split mode (ignored in allInOne).
    # The api pods run no background workers, so they scale horizontally;
    # webhook delivery dedup is shared across replicas via the Postgres store
    # (serve.go) whenever FISHHAWKD_DATABASE_URL is set, so this is safe > 1.
    replicaCount: 2
  # NOTE: the worker Deployment's replica count is intentionally NOT a knob — it
  # is hardcoded to 1 in deployment-worker.yaml (the worker singleton invariant)
  # until leader election lands (#851), to avoid exposing a silently-ignored
  # setting that could be raised past 1 and race the timers.

# Number of fishhawkd replicas in allInOne mode (ignored in split mode, where
# deployment.api.replicaCount drives the api tier). The worker singletons (#851)
# are not yet leader-elected, so in allInOne this MUST stay 1 while any worker
# toggle below is true — fishhawk.validateTopology fails the render otherwise. To
# scale fishhawkd horizontally with workers on, set deployment.mode=split instead
# of raising this.
replicaCount: 1

service:
  type: ClusterIP
  # Service port; targets the container's :8080 listener.
  port: 8080

# Optional Ingress + TLS (cert-manager), gated by ingress.enabled. Default false
# so the new template is inert for existing installs — local uses
# port-forward/NodePort (values-local.yaml keeps this off). See values-prod.yaml
# for a worked prod posture. When enabled, ingress.host is REQUIRED (the render
# fails loud otherwise). When config.externalUrl / config.oauthCallbackUrl are
# left empty AND the ingress is enabled, they are DERIVED from ingress.host
# (scheme https when tls.enabled, else http); explicit config values override.
ingress:
  enabled: false
  # IngressClass to bind (e.g. nginx). Empty omits ingressClassName so the
  # cluster's default IngressClass applies.
  className: ""
  # External hostname (e.g. app.fishhawk.example). Required when enabled.
  host: ""
  # HTTP path + pathType for the single rule. pathType is always emitted
  # (networking.k8s.io/v1 requires it on each path).
  path: "/"
  pathType: "Prefix"
  # Extra annotations merged onto the Ingress. The cert-manager cluster-issuer
  # annotation is added automatically when tls.enabled + tls.clusterIssuer set.
  annotations: {}
  tls:
    # When true, emit a tls block for ingress.host and (with clusterIssuer set)
    # the cert-manager.io/cluster-issuer annotation. cert-manager — not this
    # chart — provisions the named Secret from the referenced ClusterIssuer.
    enabled: false
    # ClusterIssuer cert-manager reads to mint the certificate. When set, renders
    # the cert-manager.io/cluster-issuer annotation. Empty skips the annotation.
    clusterIssuer: ""
    # TLS Secret name cert-manager populates. Empty defaults to <fullname>-tls.
    secretName: ""

# Pod resource requests/limits for the fishhawkd container.
#
# SIZING RATIONALE (E62.2 / #2301). fishhawkd is a plain Go HTTP service: it
# serves the REST API, runs the (optional) background-worker goroutines, and
# talks to Postgres and S3. Since the 2026-07-27 simplification that moved the
# claudecode/codex reviewers to the RUNNER, the control-plane image carries no
# agent CLIs and spawns NO reviewer subprocesses — so nothing here needs
# subprocess headroom, which is why the memory limit is a few hundred MiB rather
# than the multi-GiB an agent-hosting pod would want.
#   requests — what the scheduler reserves. 100m/128Mi is the idle-to-light
#              steady state of a Go service with a pgx pool and a handful of
#              timers; it keeps the pod schedulable on a small node.
#   limits   — the blast radius, not the expected use. 500m/512Mi gives ~5x CPU
#              burst for request spikes and migration-adjacent work while still
#              capping a leak. Both are SET on purpose: an unset memory limit
#              makes the pod BestEffort/Burstable without a ceiling, so a leak
#              takes the node down instead of the pod.
# Raise both together per cluster capacity; keep requests <= limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness + readiness both hit GET /healthz on the container's :8080 listener
# (fishhawkd --addr defaults to :8080; serve.go).
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# Non-secret FISHHAWKD_* environment, rendered into a ConfigMap. Empty values
# are omitted so unset keys stay unset (matching fishhawkd's ignore-if-unset
# semantics). Secret env (DB URL, API keys, OAuth secret, webhook secret, AWS
# creds, GitHub App private key) is supplied by the Secret object (#849),
# referenced via existingSecret below.
config:
  # Listen address. fishhawkd defaults to :8080; the probes/Service assume 8080.
  addr: ":8080"
  # Trace storage (S3 / MinIO). Bucket empty disables /v0/runs/{id}/trace.
  s3Region: "us-east-1"
  s3Endpoint: ""
  s3Bucket: ""
  # SPA root used for GitHub Check Run back-links (#231). Empty disables the
  # publish-to-GitHub path cleanly. When ingress.enabled, an empty value is
  # DERIVED from ingress.host (https when ingress.tls.enabled, else http); an
  # explicit value here overrides the derivation. The SPA frontend is hosted
  # separately (static, out-of-cluster — the chart serves the API only) and
  # points its API base URL at this value; see docs/deploy/kubernetes.md.
  externalUrl: ""
  # GitHub OAuth App client id — the PUBLIC half of the sign-in trio (it is not a
  # secret, which is why it lives here in the ConfigMap next to the callback URL,
  # not in the Secret). It is the ENABLEMENT SIGNAL for OAuth: set it and
  # FISHHAWKD_OAUTH_CLIENT_SECRET becomes required (fishhawk.validateSecretContract)
  # AND the ingress-derived callback URL renders. Leave it empty for the
  # documented OAuth-OFF posture — fishhawkd then serves /v0/auth/github/* as 503
  # (serve.go) rather than exiting. fishhawkd enforces all-three-or-none (client
  # id + client secret + callback URL); fishhawk.validateOAuthTrio mirrors that at
  # render time, failing loud on any partial combination.
  oauthClientId: ""
  # OAuth sign-in redirect URLs (non-secret halves; client secret is in #849).
  # When ingress.enabled AND config.oauthClientId is set, an empty oauthCallbackUrl
  # is DERIVED as <scheme>://<ingress.host>/v0/auth/github/callback; an explicit
  # value wins. With no client id the callback is NOT derived (OAuth is off).
  oauthCallbackUrl: ""
  oauthRedirectAfterLogin: "/"
  # Runner OIDC verification. Empty audience accepts unauthenticated callers
  # (v0 self-execution posture).
  oidcAudience: ""
  oidcJwksUrl: ""
  # GitHub App id (the private key is a secret, supplied by #849).
  githubAppId: ""
  # Plan-review model (ADR-027).
  planReviewModel: "claude-sonnet-4-6"
  # IANA timezone for daily budget rollover.
  budgetTimezone: "UTC"
  # GitHub Enterprise Server / EMU + data-resident GHEC endpoint overrides
  # (E44.2 / #1826). All empty = github.com / api.github.com, i.e. the hosted
  # posture. Set them together for a GHES install (Mode 1) or a
  # <slug>.ghe.com tenant (Mode 2); see docs/deploy/self-hosted.md.
  githubApiUrl: ""
  githubUploadUrl: ""
  oauthAuthorizeUrl: ""
  oauthTokenUrl: ""
  oauthUserUrl: ""
  oauthOrgsUrl: ""
  # Escape hatch for any FISHHAWKD_* env var the chart has no dedicated key for:
  # a map of NON-SECRET env name -> value merged verbatim into the ConfigMap. A
  # key that COLLIDES with a chart-managed key, or one that is not a valid env
  # identifier (^[A-Za-z_][A-Za-z0-9_]*$), fails the render with a named message
  # (fishhawk.validateExtraEnv). Values are coerced to strings (a ConfigMap data
  # value must be a string). NEVER put secrets here — the ConfigMap is readable by
  # anyone with `get configmaps`; secrets belong in the Secret.
  #
  # That last rule is ENFORCED, not merely advised, in two layers. A key the chart
  # knows to be secret-borne (any fishhawk.secretKeySpec key) is refused; so is any
  # key whose NAME ends in _SECRET / _TOKEN / _PASSWORD / _CREDENTIAL(S) /
  # _PRIVATE_KEY / _API_KEY. The second rule exists because the first can only
  # cover keys the chart already has a field for, and this escape hatch is for the
  # ones it does not — e.g. the FISHHAWKD_GITLAB_* family (#2922), where an
  # operator would otherwise be routed here holding a client secret.
  #
  # Bare _KEY is deliberately allowed (a partition or sort key is not a secret).
  extraEnv: {}

# Single-tenant deployment profile (ADR-057 Mode 1, E44.9 / #1833). The
# accountKey ALONE enables it: set it and fishhawkd bootstraps ONE implicit
# account at startup, so every member of that enterprise / org / group
# auto-joins at sign-in. Leave it empty for the hosted multi-tenant posture.
#
# Every field here defaults to EMPTY on purpose. Setting granularity /
# autoJoinRole / provider / displayName while accountKey is empty is a startup
# ERROR, not a silent fall-through to hosted mode — a deployment with no
# admitting account is one nobody can sign in to. Once accountKey is set, the
# omitted fields default INTERNALLY to github / enterprise / member.
singleTenant:
  # Enterprise slug, org login, or GitLab group path.
  accountKey: ""
  # enterprise | organization | group. Empty → enterprise.
  granularity: ""
  # Role granted to auto-joining members. Empty → member.
  autoJoinRole: ""
  # Cosmetic; empty stores NULL.
  displayName: ""
  # github | gitlab. Empty → github.
  provider: ""

# Regional-cell profile (ADR-057 Mode 2, ADR-062 / E44.7). This block carries
# ONLY the two NON-secret halves of the cell env matrix
# (docs/deploy/regional-cells.md); both default empty, and an empty key stays
# unset in the ConfigMap.
#
# The two SECRET halves are deliberately NOT here: FISHHAWKD_HANDOFF_SECRET and
# FISHHAWKD_MODEL_API_KEY are records in fishhawk.secretKeySpec and travel
# through the SAME secrets machinery as every other credential in all three
# modes (supply them via secrets.values.* in chartManaged, the pre-created
# Secret in `existing`, or secrets.externalSecrets.data[] in externalSecrets).
# Setting cell.homeRegion makes FISHHAWKD_HANDOFF_SECRET required, and setting
# cell.modelBaseUrl makes FISHHAWKD_MODEL_API_KEY required — enforced by
# fishhawk.validateSecretContract, mirroring fishhawkd's own startup refusals.
cell:
  # The region this cell serves → FISHHAWKD_HOME_REGION. Empty leaves the
  # region-pin surface DISABLED (a handoff-carrying request is refused 503).
  homeRegion: ""
  # In-region inference endpoint → FISHHAWKD_MODEL_BASE_URL. Empty keeps the
  # Anthropic SDK default. A region-scoped cell that sets homeRegion but is not
  # fully inference-configured REFUSES to boot when a reviewer is configured
  # (#2107) rather than egress out of region.
  modelBaseUrl: ""

# GitLab forge/identity profile (E45.32 / #2922). This block carries ONLY the
# NON-secret half of the FISHHAWKD_GITLAB_* family, rendered into the ConfigMap;
# all default empty and an empty key stays unset (the github.com-only posture).
#
# The three SECRET halves are deliberately NOT here: FISHHAWKD_GITLAB_TOKEN,
# FISHHAWKD_GITLAB_WEBHOOK_SECRET and FISHHAWKD_GITLAB_OAUTH_CLIENT_SECRET are
# records in fishhawk.secretKeySpec and travel the SAME secrets machinery as
# every other credential in all three modes — supply them via
# secrets.values.gitlab* (chartManaged), the pre-created Secret in `existing`, or
# secrets.externalSecrets.data[] in externalSecrets. They can NEVER go through
# config.extraEnv (its suffix guard refuses any key ending in _SECRET / _TOKEN).
#
# Enablement is graduated, mirroring fishhawkd (serve.go):
#   * baseUrl ALONE is a supported posture — it enables login-gate group
#     auto-join on the signing-in user's OAuth token (the forge/work-item
#     provider stays 501 until FISHHAWKD_GITLAB_TOKEN is also supplied, WARN-only,
#     never a refusal — so gitlabToken is never marked required).
#   * oauthClientId is the ENABLEMENT SIGNAL for the browser sign-in trio: set it
#     and secrets.values.gitlabOauthClientSecret becomes required
#     (fishhawk.validateSecretContract) AND both oauthCallbackUrl and baseUrl must
#     be set (fishhawk.validateGitLabOAuthTrio, mirroring resolveGitLabOAuth's
#     all-three-or-none + base-URL rule).
#   * oauthCallbackUrl is EXPLICIT-ONLY — deliberately NOT derived from the
#     ingress (unlike the GitHub callback). An ungated derivation would give every
#     ingress-enabled GitHub-only install a non-empty GitLab callback and fire the
#     id-empty guard spuriously.
#   * deviceClientId is a SEPARATE, NON-Confidential GitLab application for the
#     RFC 8628 device flow (fishhawk token login --provider gitlab), with NO
#     fallback to oauthClientId (serve.go, E66.4 / #2392).
gitlab:
  # GitLab instance URL → FISHHAWKD_GITLAB_BASE_URL. Empty leaves GitLab off.
  # Setting it alone enables the login-gate group lister; the OAuth trio needs
  # this set too (it is the host the browser sign-in redirect reaches).
  baseUrl: ""
  # Confidential browser-sign-in OAuth application client id →
  # FISHHAWKD_GITLAB_OAUTH_CLIENT_ID. The enablement signal for the trio.
  oauthClientId: ""
  # Public URL of /v0/auth/gitlab/callback → FISHHAWKD_GITLAB_OAUTH_CALLBACK_URL.
  # Explicit-only; not derived from the ingress.
  oauthCallbackUrl: ""
  # Non-Confidential device-flow application client id →
  # FISHHAWKD_GITLAB_DEVICE_CLIENT_ID. Separate application from the browser trio.
  deviceClientId: ""
  # Mode-2 per-installation base-URL host allowlist →
  # FISHHAWKD_GITLAB_INSTALLATION_HOST_ALLOWLIST. Non-secret; empty → scheme/parse
  # validation only.
  installationHostAllowlist: ""

# Background-worker enable toggles → FISHHAWKD_ENABLE_*. All default false so a
# fresh deploy doesn't race the timers. These workers are singletons: exactly one
# instance may run them. In allInOne mode that means keeping replicaCount=1 while
# any toggle is true (enforced by fishhawk.validateTopology). To run the workers
# alongside a scaled-out API tier, use deployment.mode=split — the workers run on
# the single-replica `-worker` Deployment while the `-api` Deployment scales
# freely. Leader election (the future alternative to this static worker
# singleton, which would let the workers run multi-replica) is deferred to #851.
workers:
  slaTimer: false
  dispatchWatchdog: false
  reactionPoller: false
  mergeReconciler: false
  childCompletionSweeper: false
  invariantMonitor: false

# DB-migration hook Job: runs `fishhawkd migrate up` against FISHHAWKD_DATABASE_URL
# (resolved identically to the serve Deployment) before serve accepts traffic
# against an unmigrated DB — the k8s analog of the ECS one-shot migrate Fargate
# task (infra/terraform/migrations.tf). The hook PHASE is derived automatically
# from postgres.enabled (not set here): pre-install,pre-upgrade for the
# external-DB prod baseline (postgres.enabled=false), so serve never starts
# against an unmigrated DB; post-install,post-upgrade for the in-cluster local
# stack (postgres.enabled=true), because Helm runs ALL pre-install hooks to
# completion before creating any normal resource — a pre-install hook depending
# on the in-cluster Postgres (a normal resource) would deadlock. Retry on a
# not-yet-ready DB is handled by Job backoffLimit (a fresh pod per attempt), not
# a shell wait loop, since the distroless fishhawkd image has no shell.
#
# TIMING DERIVATION (E62.2 / #2301) — one counting convention, recorded once:
#   * The Job controller marks the Job Failed with reason BackoffLimitExceeded
#     when status.failed EXCEEDS backoffLimit, so total attempts =
#     backoffLimit + 1.
#   * Cumulative inter-attempt backoff is the 10s-doubling series
#     (10, 20, 40, 80, 160, 320; each term capped at 6 minutes) summed over
#     backoffLimit terms.
#   * timeToFailed = (backoffLimit + 1) * assumedAttemptSeconds + backoff
# At the shipped backoffLimit=2 and assumedAttemptSeconds=60 that is
#   3 * 60 + (10 + 20) = 210s
# against Helm's 300s default `--timeout`, a 90s margin. The rejected
# alternative: backoffLimit=3 gives 4 * 60 + 70 = 310s, already PAST Helm's
# default timeout — the release would report a Helm timeout instead of the
# migration error, which is the whole point of the failure path.
#
# 210s IS A MODEL OUTPUT AND A LOWER BOUND, NOT AN OBSERVED NUMBER. The
# Kubernetes backoff series resets when no new failed pods appear, so real
# wall-clock time-to-Failed can exceed it. Nothing in this chart asserts the
# figure is correct; fishhawk.validateMigrateTiming only ever compares a SET
# activeDeadlineSeconds AGAINST it. The chart README's live operator drill
# records the OBSERVED time-to-Failed and Helm's actual error text — that is
# what turns this model into evidence.
migrate:
  enabled: true
  # Attempts = backoffLimit + 1 (see the derivation above). 2 keeps the derived
  # time-to-Failed inside Helm's 300s default --timeout.
  backoffLimit: 2
  # Assumed per-attempt wall time (pod schedule + image pull + DB connect +
  # failing SQL). An ASSUMPTION, shipped as a knob rather than baked into a
  # constant precisely because it is one: raise it on a slow registry and the
  # timing guard recomputes with you.
  assumedAttemptSeconds: 60
  # UNSET by default, on purpose. A deadline generous enough for a slow but
  # legitimate migration cannot also be tight enough to beat the failure path,
  # and when it DOES fire it reports DeadlineExceeded — hiding the migration
  # error this Job exists to surface. Set it only if you need a hard ceiling on
  # a migration blocked on a lock; fishhawk.validateMigrateTiming then fails the
  # render if the value you chose would win the race. That guard rejects a
  # deadline LESS THAN OR EQUAL TO the derived time-to-Failed, not merely one
  # below it: 210s is a lower bound, so a deadline set to exactly 210 already
  # loses the race whenever the model is not exact.
  #
  # `null` and `0` both mean UNSET. 0 is not a meaningful ceiling (the Job
  # controller's own validation on the field is exclusive-minimum 0), so the
  # chart emits no activeDeadlineSeconds field for it and the timing guard has
  # nothing to compare.
  activeDeadlineSeconds: null
  # Same sizing rationale as `resources` above: a one-shot Go process running
  # DDL against Postgres, no subprocesses. Both requests and limits are set.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Optional in-cluster Postgres 16, gated by postgres.enabled. Default false so
# the prod baseline points fishhawkd at an external managed database via the
# existingSecret's FISHHAWKD_DATABASE_URL. Turned on by values-local.yaml for a
# self-contained Docker-Desktop stack. Mirrors docker-compose.yml
# (postgres:16-alpine, fishhawk/fishhawk/fishhawk). When enabled, the fishhawkd
# Deployment gets an explicit FISHHAWKD_DATABASE_URL env (overriding the secret)
# pointing at the in-cluster Service.
postgres:
  enabled: false
  image: postgres:16-alpine
  pullPolicy: IfNotPresent
  auth:
    user: fishhawk
    password: fishhawk
    database: fishhawk
  service:
    port: 5432
  persistence:
    size: 1Gi
    # Empty uses the cluster default StorageClass (e.g. Docker Desktop's
    # hostpath, which provisions ReadWriteOnce volumes).
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Optional in-cluster MinIO (S3-compatible trace store), gated by minio.enabled.
# Default false so the prod baseline points at external S3. Mirrors
# docker-compose.yml (minio RELEASE.2025-01-20T14-49-07Z, path-style). When
# enabled, set config.s3Endpoint/s3Bucket to the in-cluster Service (see
# values-local.yaml). createBucket runs a post-install/upgrade Job that creates
# the bucket via mc.
minio:
  enabled: false
  image: minio/minio:RELEASE.2025-01-20T14-49-07Z
  # mc client image for the bucket-bootstrap Job. mc and the MinIO server are NOT
  # co-versioned — minio/mc does not publish a tag for every minio/minio server
  # release (the 2025-01-20 server tag has no matching mc tag), so this is pinned
  # INDEPENDENTLY of minio.image and must be a tag that actually EXISTS in the
  # registry. A nonexistent tag ships silently: the bucket Job is a Helm HOOK, so
  # an ImagePullBackOff there surfaces only as a `helm upgrade` timeout (#2913).
  # scripts/test-helm-render r15 fail-closes the render gate on an unpublished
  # tag, and `scripts/dev k8s` dumps hook pod state on a helm failure. Verify a
  # new pin is pullable before bumping, per CLAUDE.md's run-time image-pinning
  # rule.
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  pullPolicy: IfNotPresent
  rootUser: fishhawk
  rootPassword: fishhawk-dev-secret
  apiPort: 9000
  consolePort: 9001
  bucket: fishhawk-traces
  createBucket: true
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Optional in-cluster Jaeger all-in-one (the local OTLP trace collector for the
# runner's #649 GenAI spans), gated by jaeger.enabled. Default false. DEV /
# DOGFOODING ONLY — an ephemeral, unauthenticated collector with in-memory span
# storage (no PVC); fishhawk.validateSecrets fails the render outside
# profile: local, so it cannot reach prod. The k8s analog of the opt-in `otel`
# compose profile in docker-compose.yml. Turned on by values-local.yaml.
# fishhawkd does NOT emit spans — the host-spawned fishhawk-runner does, reaching
# this collector at localhost:4318 via the port-forward `scripts/dev k8s` opens
# (with OTEL_EXPORTER_OTLP_ENDPOINT set on the host); UI at localhost:16686.
# Image pinned per CLAUDE.md's run-time image-pinning rule (kept in sync with the
# docker-compose.yml jaeger service).
jaeger:
  enabled: false
  image: jaegertracing/all-in-one:1.62.0
  pullPolicy: IfNotPresent
  # Service ports (container ports are fixed at the Jaeger defaults 16686/4318/4317).
  uiPort: 16686
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Name of the pre-existing Secret carrying sensitive FISHHAWKD_* env, consumed by
# `secrets.mode: existing` (the default). The pod references it via envFrom
# secretRef (optional:false — fails loud if absent). For chartManaged /
# externalSecrets modes this is ignored; the chart-owned `<fullname>-secrets`
# name is used instead (see fishhawk.secretName).
existingSecret: fishhawk-secrets

# Secret provisioning (#849). Three converging modes, ALL consumed by the
# fishhawkd Deployment + migrate Job through the single `fishhawk.secretName`
# helper (no template duplication):
#   existing        — reference a pre-created Secret (default; back-compat with
#                     the pre-#849 posture). Resolves to `existingSecret` above.
#   chartManaged    — the chart renders the Secret from `secrets.values` (DEV
#                     ONLY; gated to profile: local by fishhawk.validateSecrets).
#   externalSecrets — emit an ExternalSecret CR referencing a SecretStore so the
#                     External Secrets Operator materializes the Secret in-cluster
#                     (prod hook/foundation; pairs with #182, needs ESO + a
#                     pre-provisioned SecretStore).
# chartManaged and externalSecrets both resolve to the chart-owned name
# `<fullname>-secrets`: chartManaged renders that Secret directly, externalSecrets
# has ESO materialize a Secret of that name via the ExternalSecret's target.
secrets:
  mode: existing

  # GitHub App private key, mounted as a FILE volume (never an env string). The
  # PEM is stored under a DOTTED Secret key, which envFrom skips (not a valid env
  # identifier), so it is consumed only via the mount. The non-secret file PATH
  # is advertised to fishhawkd via the ConfigMap
  # (FISHHAWKD_GITHUB_APP_PRIVATE_KEY_FILE = mountPath).
  githubApp:
    privateKeyFile:
      # enabled adds the PEM volume + readOnly mount. UPGRADE CAVEAT (#849): with
      # `existing`/`externalSecrets` mode the referenced Secret MUST carry the
      # `secretKey` below — a pre-#849 Secret won't, and Kubernetes refuses to
      # start the pod when a non-optional Secret-key mount is missing. Operators
      # with no GitHub App integration (or who manage the key outside Kubernetes)
      # should set this to false to drop the volume + mount.
      enabled: true
      secretKey: "github-app-private-key.pem"
      mountPath: "/etc/fishhawk/github-app-private-key.pem"

  # DEV-ONLY plaintext consumed by `chartManaged` mode. All empty by default so
  # the chart never bakes secrets unless explicitly populated (see
  # values-local.yaml). Empty keys are omitted from the rendered Secret, so an
  # unset value stays unset. NEVER populate these for a prod deploy.
  values:
    databaseUrl: ""           # FISHHAWKD_DATABASE_URL
    githubWebhookSecret: ""   # FISHHAWKD_GITHUB_WEBHOOK_SECRET
    oauthClientSecret: ""     # FISHHAWKD_OAUTH_CLIENT_SECRET
    anthropicApiKey: ""       # FISHHAWKD_ANTHROPIC_API_KEY
    awsAccessKeyId: ""        # AWS_ACCESS_KEY_ID (S3 / MinIO)
    awsSecretAccessKey: ""    # AWS_SECRET_ACCESS_KEY (S3 / MinIO)
    # PEM contents for the GitHub App private key (rendered under the dotted
    # secretKey above and mounted as a file, NOT injected as env).
    githubAppPrivateKey: ""
    # Regional-cell credentials (ADR-062). Required only when the matching
    # cell.* non-secret half is set: handoffSecret when cell.homeRegion is set,
    # modelApiKey when cell.modelBaseUrl is set.
    handoffSecret: ""         # FISHHAWKD_HANDOFF_SECRET
    modelApiKey: ""           # FISHHAWKD_MODEL_API_KEY
    # GitLab credentials (E45.32 / #2922). gitlabToken and gitlabWebhookSecret
    # are NEVER required by the contract — supplied-or-not, like any optional
    # credential (serve.go warns and disables the gitlab provider on a partial
    # config rather than refusing). gitlabOauthClientSecret is required exactly
    # when gitlab.oauthClientId is set (the browser-sign-in enablement signal).
    gitlabToken: ""              # FISHHAWKD_GITLAB_TOKEN
    gitlabWebhookSecret: ""      # FISHHAWKD_GITLAB_WEBHOOK_SECRET
    gitlabOauthClientSecret: ""  # FISHHAWKD_GITLAB_OAUTH_CLIENT_SECRET

  # `externalSecrets` mode: emit an ExternalSecret CR (no inline Secret).
  # secretStoreRef.name MUST be set (the guard fails an empty one). apiVersion is
  # overridable to track ESO releases. Each `data` item maps a key in the
  # materialized Secret to a remote ref in the backing store.
  externalSecrets:
    apiVersion: "external-secrets.io/v1beta1"
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    refreshInterval: "1h"
    data: []
    # - secretKey: FISHHAWKD_DATABASE_URL
    #   remoteRef:
    #     key: fishhawk/db
    #     property: url
