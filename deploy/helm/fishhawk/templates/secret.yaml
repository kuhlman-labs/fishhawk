{{- if eq .Values.secrets.mode "chartManaged" }}
{{- include "fishhawk.validateSecrets" . -}}
# Chart-managed Secret (#849), rendered ONLY in `secrets.mode: chartManaged`.
# DEV-ONLY: this bakes plaintext from `secrets.values` into a release manifest;
# fishhawk.validateSecrets fails the render unless profile is `local`. The
# Deployment + migrate Job consume this via fishhawk.secretName (the same name
# the other modes resolve to), so no template references it directly.
#
# The key set is NOT authored here — it is RANGED from fishhawk.secretKeySpec
# (E62.2 / #2301), the one credential contract that fishhawk.requiredSecretKeys
# and fishhawk.validateSecretContract also read. That is what makes chartManaged
# able to render the very keys it is required to validate; the seven
# hand-written blocks this replaced could drift from the validator, and did:
# the GitHub App PEM had no entry at all.
#
# Sensitive env (DATABASE_URL, webhook/OAuth secrets, Anthropic key, AWS creds,
# the cell handoff/model keys) is delivered via envFrom secretRef. The GitHub App
# private key is stored under a DOTTED key (not a valid env identifier), so
# envFrom skips it (its record carries envDelivered:false) — it is consumed only
# as a mounted file (see the Deployment volume + the ConfigMap path).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fishhawk.secretName" . }}
  labels:
    {{- include "fishhawk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $values := .Values.secrets.values }}
  {{- $pemEnabled := .Values.secrets.githubApp.privateKeyFile.enabled }}
  {{- range fromYamlArray (include "fishhawk.secretKeySpec" $) }}
  {{- $supplied := index $values .valuesField }}
  {{- if and $supplied (or .envDelivered $pemEnabled) }}
  {{ .secretKey | quote }}: {{ $supplied | quote }}
  {{- end }}
  {{- end }}
{{- end }}
