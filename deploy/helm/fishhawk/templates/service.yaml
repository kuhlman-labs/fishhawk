{{- include "fishhawk.validateMode" . -}}
{{- /* OAuth trio + credential-contract + extraEnv guards (E62.2 / #2301, E69.4 /
       #2915) all live here for the same reason validateMode does: service.yaml
       is the only template rendering in EVERY topology mode AND every secrets
       mode, so a guard that must always run cannot live in deployment.yaml
       (skipped in split mode) or secret.yaml (skipped outside chartManaged).

       validateOAuthTrio runs BEFORE validateSecretContract on purpose (#2915):
       an operator who sets ONLY config.oauthClientId on a non-ingress install
       has BOTH an empty callback AND (since the id makes the client secret
       required) a missing secret. Running the contract guard first would fail on
       the missing FISHHAWKD_OAUTH_CLIENT_SECRET and the operator would never see
       the callback remedy. validateOAuthTrio branch (i) fires only when the
       callback is empty, so it speaks the more actionable message first (set
       config.oauthCallbackUrl OR enable the ingress); once the callback is
       reachable it is SILENT and validateSecretContract owns the
       id-set-but-secret-missing case, so there is still one message per
       condition, not two guards racing.

       validateGitLabOAuthTrio (E45.32 / #2922) runs here too, after the GitHub
       trio and BEFORE validateSecretContract, for the same reason: an operator
       who sets only gitlab.oauthClientId has both an empty callback and (by the
       derived requiredness of FISHHAWKD_GITLAB_OAUTH_CLIENT_SECRET) a missing
       secret, so running the contract guard first would surface the missing
       secret while hiding the more actionable callback/base-URL remedy. It
       mirrors fishhawkd's resolveGitLabOAuth all-three-or-none rule plus its
       base-URL requirement. */ -}}
{{- include "fishhawk.validateOAuthTrio" . -}}
{{- include "fishhawk.validateGitLabOAuthTrio" . -}}
{{- include "fishhawk.validateSecretContract" . -}}
{{- include "fishhawk.validateExtraEnv" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fishhawk.fullname" . }}
  labels:
    {{- include "fishhawk.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- if eq .Values.deployment.mode "split" }}
    # Split mode: route HTTP + webhook traffic only to the api pods (which dedup
    # webhook deliveries via the Postgres store). The single -worker pod
    # (component=worker) is deliberately excluded from the Service endpoints.
    {{- include "fishhawk.selectorLabels" (dict "root" . "role" "api") | nindent 4 }}
    {{- else }}
    {{- include "fishhawk.selectorLabels" . | nindent 4 }}
    {{- end }}
