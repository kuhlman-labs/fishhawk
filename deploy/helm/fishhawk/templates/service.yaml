{{- include "fishhawk.validateMode" . -}}
{{- /* Credential-contract guard (E62.2 / #2301). service.yaml is the only
       template that renders in EVERY topology mode AND every secrets mode,
       which is why validateMode already lives here: deployment.yaml does not
       render in split mode and secret.yaml does not render outside
       chartManaged, so neither can host a guard that must always run. */}}
{{- include "fishhawk.validateSecretContract" . -}}
{{- /* OAuth trio + extraEnv guards (E69.4 / #2915) live here for the same
       reason: service.yaml is the only template rendering in every topology mode
       and every secrets mode, so a guard that must always run cannot live in
       deployment.yaml (skipped in split mode) or secret.yaml (skipped outside
       chartManaged). validateOAuthTrio runs AFTER validateSecretContract so the
       id-set-but-secret-missing case surfaces once, with the contract guard's
       message, rather than racing this one. */ -}}
{{- include "fishhawk.validateOAuthTrio" . -}}
{{- include "fishhawk.validateExtraEnv" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fishhawk.fullname" . }}
  labels:
    {{- include "fishhawk.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- if eq .Values.deployment.mode "split" }}
    # Split mode: route HTTP + webhook traffic only to the api pods (which dedup
    # webhook deliveries via the Postgres store). The single -worker pod
    # (component=worker) is deliberately excluded from the Service endpoints.
    {{- include "fishhawk.selectorLabels" (dict "root" . "role" "api") | nindent 4 }}
    {{- else }}
    {{- include "fishhawk.selectorLabels" . | nindent 4 }}
    {{- end }}
