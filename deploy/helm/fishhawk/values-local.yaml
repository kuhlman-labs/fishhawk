# Local-development override layer for the fishhawk chart.
# Renders cleanly standalone: `helm template fishhawk . -f values-local.yaml`.
# Localhost-flavored endpoints + lower resource asks; placeholders fill any
# render-time-needed fields. Not for cluster use as-is — secrets.mode is
# chartManaged with dev placeholders (#849), permitted only by profile: local.

# Local profile: acknowledges the dev-only conveniences (chart-managed Secret +
# in-cluster Postgres/MinIO default credentials) so fishhawk.validateSecrets
# permits them. A real cluster MUST keep profile: prod (values.yaml default).
profile: local

image:
  tag: "main"
  pullPolicy: Always

replicaCount: 1

# Local reaches fishhawkd via `kubectl port-forward` / NodePort, not an Ingress.
# Keep it off so config.externalUrl/oauthCallbackUrl below are used verbatim (no
# ingress-host derivation).
ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  addr: ":8080"
  s3Region: "us-east-1"
  # Points at the in-cluster MinIO Service below. Assumes `helm install fishhawk`
  # so fishhawk.fullname renders to `fishhawk` (release name contains chart name).
  s3Endpoint: "http://fishhawk-minio:9000"
  s3Bucket: "fishhawk-traces"
  externalUrl: "http://localhost:5173"
  # Dev OAuth client id — the PUBLIC enablement signal that completes the local
  # trio (id here, client secret in secrets.values below, callback explicit). The
  # local stack now renders a COMPLETE trio, so `scripts/dev k8s` produces a
  # fishhawkd that boots. Not a real client id — replace for a real GitHub App.
  oauthClientId: "dev-oauth-client-id"
  oauthCallbackUrl: "http://localhost:8080/v0/auth/github/callback"
  oauthRedirectAfterLogin: "http://localhost:5173/"
  oidcAudience: "fishhawkd-local"
  oidcJwksUrl: ""
  # GitHub App OFF for the local profile (#2914). serve.go requires
  # --github-app-id and --github-app-private-key-file TOGETHER and exits with
  # "github app misconfigured: both --github-app-id and
  # --github-app-private-key-file required" on either alone; a dev id without a
  # parseable key is exactly the crashloop #2914 reports (fishhawkd parses the
  # PEM eagerly at boot). Left empty (not deleted) so the OFF posture is visible
  # and a reader does not re-add a lone id. To turn the App back on with a
  # generated throwaway key, see deploy/helm/fishhawk/README.md.
  githubAppId: ""
  planReviewModel: "claude-sonnet-4-6"
  budgetTimezone: "UTC"

workers:
  slaTimer: false
  dispatchWatchdog: false
  reactionPoller: false
  mergeReconciler: false
  childCompletionSweeper: false
  invariantMonitor: false

# Self-contained local stack: in-cluster Postgres + MinIO. fishhawkd's
# FISHHAWKD_DATABASE_URL is overridden by the Deployment to target the in-cluster
# postgres Service; config.s3Endpoint above points at the in-cluster minio.
postgres:
  enabled: true

minio:
  enabled: true

# In-cluster Jaeger all-in-one (the local OTLP trace collector). DEV-ONLY; the
# host-spawned fishhawk-runner reaches it at localhost:4318 via the port-forward
# `scripts/dev k8s` opens, and the UI is at localhost:16686. Set
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 on this host to have the
# runner emit spans (unset is a clean no-op).
jaeger:
  enabled: true

# Chart-managed Secret with dev placeholders so the chart renders standalone
# (no out-of-band Secret needed). DEV-ONLY — never copy these to a prod values
# file. existingSecret (values.yaml) is intentionally NOT set here: chartManaged
# supersedes it via fishhawk.secretName, so the chart owns `<fullname>-secrets`.
secrets:
  mode: chartManaged
  # GitHub App disabled for the local profile (#2914). enabled:false drops the
  # PEM volume + readOnly mount from the pod spec, drops
  # FISHHAWKD_GITHUB_APP_PRIVATE_KEY_FILE from the ConfigMap, and makes the PEM
  # record non-required in fishhawk.secretKeySpec so validateSecretContract does
  # not demand it. Paired with config.githubAppId: "" above, this ships the App
  # wholly OFF — the posture serve.go supports with a Warn ("FISHHAWKD_GITHUB_
  # APP_ID not set; webhook dispatch and GitHub-side actions will be disabled"),
  # not an exit. See README.md for the generate-a-key-and-enable recipe.
  githubApp:
    privateKeyFile:
      enabled: false
  values:
    # Targets the in-cluster Postgres Service. Matches the Deployment's
    # postgres.enabled override, kept here so chartManaged renders a complete
    # Secret even though the Deployment env wins at runtime.
    databaseUrl: "postgres://fishhawk:fishhawk@fishhawk-postgres:5432/fishhawk?sslmode=disable"
    githubWebhookSecret: "dev-webhook-secret"
    oauthClientSecret: "dev-oauth-client-secret"
    anthropicApiKey: "dev-anthropic-key"
    # Equal to minio.rootUser / minio.rootPassword so fishhawkd reaches the
    # in-cluster MinIO bucket (trace storage).
    awsAccessKeyId: "fishhawk"
    awsSecretAccessKey: "fishhawk-dev-secret"
    # No githubAppPrivateKey: the local profile runs with the GitHub App disabled
    # (secrets.githubApp.privateKeyFile.enabled: false above), so the record is
    # non-required and no PEM key is emitted. A placeholder PEM cannot parse and
    # fishhawkd parses it eagerly at boot, which is the crashloop #2914 reports —
    # so shipping one here is worse than shipping none. To enable the App with a
    # generated throwaway key, see README.md.
