server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # API, webhooks and OAuth are routed by Ingress to fishhawkd on the same
    # origin; this container serves only the SPA and never receives secrets.
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-store"; }
}
