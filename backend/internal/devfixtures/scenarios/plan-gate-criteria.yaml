# plan-gate-criteria — a feature_change run parked at its plan gate whose
# plan carries REAL acceptance criteria, plus a pending acceptance stage
# (#3181).
#
# plan-gate-parked's plan declares no acceptance_criteria, so the
# approve-time amend_acceptance_criteria channel (retire / restate / add)
# refuses it 422 acceptance_criteria_unavailable and no shipped scenario
# could drive the channel from the sandboxed acceptance preview. Here the
# plan stage is at awaiting_approval carrying a valid standard_v1 plan whose
# verification.acceptance_criteria declares TWO drivable criteria
# (run-readable / stages-listed), and the acceptance stage sits at pending,
# so after an approve (e.g. one carrying an `add`) GET
# /v0/stages/{acceptance_stage_id}/prompt-render renders the effective
# acceptance prompt — the operator-authored block included.
#
# Handles (`key`) are scenario-local; every Apply mints fresh ids.
runs:
  - key: criteria-run
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:3181"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (plan-gate-criteria).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: acceptance
              type: acceptance
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
                - artifact: pull_request
                  from_stage: implement
              egress:
                target_hosts:
                  - localhost:8090
              produces:
                - artifact: acceptance

stages:
  - key: plan
    run: criteria-run
    sequence: 1
    type: plan
    executor_kind: agent
    executor_ref: claude-code
    requires_approval: true
    state: awaiting_approval
  - key: implement
    run: criteria-run
    sequence: 2
    type: implement
    executor_kind: agent
    executor_ref: claude-code
    state: pending
  - key: review
    run: criteria-run
    sequence: 3
    type: review
    executor_kind: human
    executor_ref: human
    requires_approval: true
    state: pending
  - key: acceptance
    run: criteria-run
    sequence: 4
    type: acceptance
    executor_kind: agent
    executor_ref: claude-code
    state: pending

artifacts:
  - key: plan
    stage: plan
    kind: plan
    schema_version: standard_v1
    content: |
      {
        "plan_version": "standard_v1",
        "ticket_reference": {
          "type": "github_issue",
          "url": "https://github.com/kuhlman-labs/fishhawk/issues/3181",
          "id": "kuhlman-labs/fishhawk#3181"
        },
        "generated_by": {
          "agent": "claude-code",
          "model": "claude-opus-4-8",
          "timestamp": "2026-01-01T09:00:00Z"
        },
        "summary": "Seeded fixture plan parked at the plan gate with real acceptance criteria.",
        "scope": {
          "files": [
            {"path": "README.md", "operation": "modify"}
          ]
        },
        "approach": [
          {"step": 1, "description": "Edit README.md."}
        ],
        "verification": {
          "test_strategy": "None: this is a seeded fixture, never implemented.",
          "rollback_plan": "Revert the PR.",
          "acceptance_criteria": [
            {
              "id": "run-readable",
              "statement": "GET /v0/runs/{run_id} returns 200 with the seeded run's fields.",
              "source": "explicit",
              "source_ref": "kuhlman-labs/fishhawk#3181",
              "blocking": true,
              "verify_hint": "GET /v0/runs/{run_id} -> 200"
            },
            {
              "id": "stages-listed",
              "statement": "GET /v0/runs/{run_id}/stages lists the run's stages.",
              "source": "explicit",
              "source_ref": "kuhlman-labs/fishhawk#3181",
              "blocking": true,
              "verify_hint": "GET /v0/runs/{run_id}/stages -> 200"
            }
          ]
        },
        "predicted_runtime_minutes": 5,
        "predicted_runtime_confidence": "high"
      }
