# acceptance-vouched-head — five feature_change runs whose acceptance stage is
# DISPATCHED around an operator_commit_vouched row, so the acceptance prompt's
# acceptance_expected_head_sha (unbounded) and the head a signed verdict binds
# (bounded by the acceptance_dispatched anchor) show which vouch moves the head
# (#4874). A SERVER-VERIFIED vouch carries the exact payload #4856's
# vouch-commit handler writes: {run_id, vouched_sha, reason, prior_head_sha,
# head_advance_verified: true}; it is a head edge of the shared recorded walk
# only when its prior_head_sha is the head walked so far. A legacy vouch (no
# advance keys) only records lineage membership. Shaped after
# acceptance-rebased-head: every run carries an approved standard_v1 plan with
# two drivable criteria and a pull_request artifact, so a signed verdict can
# ship against it.
#
# DEV ONLY: the scenario is reachable solely through the dev fixture route
# (POST /v0/dev/fixtures), which is registered only under fishhawkd
# --dev-fixtures, loopback-only. Its seeded "verified" rows are fixture data,
# never a server verification, and cannot exist on a non-dev deployment.
#
# Audit rows are ORDERED per run (the chain sequence is the order below). The
# run_id inside each vouch payload is a scenario-local label: Apply mints the
# real run id, and no reader of the walk keys on it.
#
#   vouched-run                 pull_request_opened(S1 1111..), a verified
#                               vouch S1 -> V1 (2222..), then the anchor: the
#                               prompt names V1.
#   vouched-then-rebased-run    pull_request_opened(S2 3333..), a verified
#                               vouch S2 -> V2 (4444..), a CLEAN
#                               branch_rebased V2 -> M2 (5555.., base cccc..),
#                               then the anchor: the prompt names M2.
#   unverified-vouch-run        pull_request_opened(S3 6666..), a LEGACY vouch
#                               of V3 (7777..) with no advance keys, then the
#                               anchor: the prompt names S3.
#   vouched-parent              integration_commit_recorded(F 8888..), a
#                               verified vouch F -> W (9999..), then the
#                               anchor: the prompt names W, and the run branch
#                               is the server-derived
#                               fishhawk/run-<first 8>-consolidated.
#   vouched-after-dispatch-run  pull_request_opened(S5 aaaa..), the anchor,
#                               THEN a verified vouch S5 -> V5 (bbbb..): the
#                               unbounded prompt names V5, while a signed
#                               verdict binds S5 (the vouch is after the
#                               dispatch anchor, the same semantics as a
#                               rebase after dispatch).
#
# The parent serves no acceptance_pull_request_number: devfixtures.Run has no
# pull_request_url and this scenario does not extend the fixture schema, so the
# field is 0 (omitted) by design, exactly as in acceptance-rebased-head.
#
# Handles (`key`) are scenario-local; every Apply mints fresh ids.
runs:
  - key: vouched-run
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:4874"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (acceptance-vouched-head).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: acceptance
              type: acceptance
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
                - artifact: pull_request
                  from_stage: implement
              egress:
                target_hosts:
                  - localhost:8090
              produces:
                - artifact: acceptance
