# acceptance-rebased-head — three feature_change runs whose acceptance stage is
# DISPATCHED after the head moved past its first reported row, so the
# acceptance prompt's acceptance_expected_head_sha names the ADVANCED head the
# server's acceptanceHeadAsOf resolves, not the seed (#4874). Shaped after
# acceptance-dispatched: every run carries an approved standard_v1 plan with
# two drivable criteria and a pull_request artifact, so a signed verdict can
# ship against it.
#
# Audit rows are ORDERED per run (the chain sequence is the order below):
#
#   rebased-run              pull_request_opened(S), a CLEAN branch_rebased
#                            S -> M (clean_verified true), then the
#                            acceptance_dispatched anchor: the head is M.
#   rebased-parent           integration_commit_recorded(F), a CLEAN
#                            branch_rebased F -> P, then the anchor: the head
#                            is P, and the run branch is the server-derived
#                            fishhawk/run-<first 8>-consolidated.
#   late-integration-parent  fixup_pushed(H), then a LATER
#                            integration_commit_recorded(F2), then the anchor:
#                            the newer integration row seeds by chain
#                            sequence, so the head is F2 (the seed repair is
#                            observable on the wire).
#
# Neither parent serves an acceptance_pull_request_number: devfixtures.Run has
# no pull_request_url and this scenario does not extend the fixture schema, so
# the run-row fallback reads no URL and the field is 0 (omitted). That is the
# expected shape, not a defect; the real PR-number fallback is decided by
# TestResolveAcceptanceRunBranchAndPR_DecomposedParent with a real run URL.
# The parents are ordinary runs carrying integration rows, not decomposed
# runs with children.
#
# Handles (`key`) are scenario-local; every Apply mints fresh ids.
runs:
  - key: rebased-run
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:4874"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (acceptance-rebased-head).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: acceptance
              type: acceptance
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
                - artifact: pull_request
                  from_stage: implement
              egress:
                target_hosts:
                  - localhost:8090
              produces:
                - artifact: acceptance
  - key: rebased-parent
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:4874"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (acceptance-rebased-head).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: acceptance
              type: acceptance
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
                - artifact: pull_request
                  from_stage: implement
              egress:
                target_hosts:
                  - localhost:8090
              produces:
                - artifact: acceptance
  - key: late-integration-parent
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:4874"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (acceptance-rebased-head).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: acceptance
              type: acceptance
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
                - artifact: pull_request
                  from_stage: implement
              egress:
                target_hosts:
                  - localhost:8090
              produces:
                - artifact: acceptance

