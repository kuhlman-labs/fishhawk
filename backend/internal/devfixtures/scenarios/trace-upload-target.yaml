# trace-upload-target — a run whose plan stage is DISPATCHED, ready to
# receive POST /v0/runs/{id}/trace, plus a backdated spend baseline
# (E72.2 / #3326, closing #1874's preview gap).
#
# The four cost_recorded rows are aged 1h5m / 2h / 3h / 4h relative to
# Apply's clock. What that GUARANTEES at every seed clock: the 2h / 3h /
# 4h rows land in THREE distinct prior hour buckets (seed-hour minus 2, 3
# and 4), all inside spendalert.Evaluate's 24h Window, so a ~$5 upload in
# the seed hour OR the hour after it trips spend_alert against the
# ≈$0.001 baseline. What depends on WHERE in the hour the seed lands: the
# 1h5m row reaches seed-hour minus one only when the seed clock is at or
# past :05 (a 10:59:59 seed puts it at 09:54 → four distinct buckets,
# youngest = seed-hour minus one); an earlier seed folds it into the 2h
# row's bucket (a 10:02 seed puts it at 08:57 beside 08:02 → three
# buckets, that one summing $0.002, youngest = seed-hour minus two).
# Either way the alert trips (ratio ≈ 3750–5000); the two pinned clocks
# are TestScenario_TraceUploadTarget_BaselineSurvivesHourBoundary and
# _EarlyHourSeedSharesBucket. Seed and upload contiguously: the baseline
# ages with wall-clock time.
#
# Handles (`key`) are scenario-local; every Apply mints fresh ids.
runs:
  - key: target-run
    repo: kuhlman-labs/fishhawk
    workflow_id: feature_change
    trigger_ref: "issue:3"
    state: running
    workflow_spec: |
      version: "2"
      workflows:
        feature_change:
          description: Seeded fixture workflow (trace-upload-target).
          autonomy: low
          stages:
            - id: plan
              type: plan
              executor:
                agent: claude-code
              inputs:
                - source: github_issue
                  required: true
              produces:
                - artifact: plan
                  schema: standard_v1
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]
            - id: implement
              type: implement
              executor:
                agent: claude-code
              inputs:
                - artifact: plan
                  from_stage: plan
              produces:
                - artifact: pull_request
            - id: review
              type: review
              executor:
                human: true
              inputs:
                - artifact: pull_request
                  from_stage: implement
              gates:
                - type: approval
                  approvals:
                    count: 1
                    not: [author, agent]

stages:
  - key: plan
    run: target-run
    sequence: 1
    type: plan
    executor_kind: agent
    executor_ref: claude-code
    requires_approval: true
    state: dispatched

audit:
  - run: target-run
    stage: plan
    category: cost_recorded
    actor_kind: system
    actor_subject: devfixtures
    age: 1h5m
    payload: '{"model":"claude-opus-4-8","usd":0.001,"known_model":true,"known_usage":true,"estimated":true,"input_tokens":200,"output_tokens":0}'
  - run: target-run
    stage: plan
    category: cost_recorded
    actor_kind: system
    actor_subject: devfixtures
    age: 2h
    payload: '{"model":"claude-opus-4-8","usd":0.001,"known_model":true,"known_usage":true,"estimated":true,"input_tokens":200,"output_tokens":0}'
  - run: target-run
    stage: plan
    category: cost_recorded
    actor_kind: system
    actor_subject: devfixtures
    age: 3h
    payload: '{"model":"claude-opus-4-8","usd":0.001,"known_model":true,"known_usage":true,"estimated":true,"input_tokens":200,"output_tokens":0}'
  - run: target-run
    stage: plan
    category: cost_recorded
    actor_kind: system
    actor_subject: devfixtures
    age: 4h
    payload: '{"model":"claude-opus-4-8","usd":0.001,"known_model":true,"known_usage":true,"estimated":true,"input_tokens":200,"output_tokens":0}'
