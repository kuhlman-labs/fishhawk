# Local development stack for Fishhawk.
#
# Brings up the services that mirror production (per ADR-001 / ADR-003):
# - Postgres 16 (the primary state store)
# - RustFS (S3-compatible object storage for trace bundles; production
#   points the same aws-sdk-go-v2 client at AWS S3)
#
# Usage:
#   docker compose up -d
#   make s3-init          # one-shot: create the fishhawk-traces bucket (idempotent)
#   FISHHAWKD_DATABASE_URL=postgres://fishhawk:fishhawk@localhost:5432/fishhawk?sslmode=disable \
#     go run ./backend/cmd/fishhawkd migrate
#   go run ./backend/cmd/fishhawkd serve

services:
  postgres:
    image: postgres:16-alpine
    container_name: fishhawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fishhawk
      POSTGRES_PASSWORD: fishhawk
      POSTGRES_DB: fishhawk
    ports:
      - "5432:5432"
    volumes:
      - fishhawk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishhawk -d fishhawk"]
      interval: 2s
      timeout: 2s
      retries: 15

  rustfs:
    # RustFS is the local-dev S3 backend (ADR-003 / #67; #3386 replaced
    # MinIO after its server and mc images were removed from Docker Hub).
    # The Go tracestore package uses aws-sdk-go-v2 against this endpoint
    # with path-style addressing; production points the same SDK at
    # AWS S3.
    #
    # rustfs/rustfs:1.0.0-rc.6 is a 1.0.0 release candidate (Apache-2.0),
    # verified pullable on 2026-09-13 (#3386). No `command:` override: the
    # image Cmd is `rustfs` and RUSTFS_VOLUMES defaults to /data.
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: fishhawk-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: fishhawk
      RUSTFS_SECRET_KEY: fishhawk-dev-secret
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - fishhawk-rustfs-data:/data
    healthcheck:
      # curl ships in the image. GET /health answers 200 once the server is
      # up; GET / answers 503, so it is NOT a usable readiness path.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    # One-shot bucket bootstrap, gated behind the `init` profile so it does
    # NOT start under the default `docker compose up -d`. `make s3-init`
    # runs it via `docker compose --profile init run --rm s3-init`.
    #
    # The rustfs image ships no bucket CLI (MinIO's `mc` is gone with it),
    # so this uses the AWS CLI. `entrypoint:` overrides the image's `aws`
    # ENTRYPOINT so the shell runs the script rather than `aws /bin/sh ...`.
    # With a custom --endpoint-url the CLI does not force path-style
    # addressing, so AWS_CONFIG_FILE pins `addressing_style = path` —
    # otherwise a DNS-compatible bucket name resolves to
    # `fishhawk-traces.rustfs`, which compose DNS cannot answer.
    #
    # Exit-status contract: `set -e` plus the `head-bucket || create-bucket`
    # list means an EXISTING bucket exits 0 with no create attempted, an
    # absent bucket is created (exit 0), and a create that genuinely fails
    # exits NON-ZERO — the trailing echo never masks a failed create.
    image: amazon/aws-cli:2.36.44
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: fishhawk
      AWS_SECRET_ACCESS_KEY: fishhawk-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /tmp/aws-config
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: fishhawk-traces
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        printf '[default]\ns3 =\n  addressing_style = path\n' > "$$AWS_CONFIG_FILE"
        aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 \
          || aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET" >/dev/null
        echo "bucket $$S3_BUCKET ready"

  jaeger:
    # Opt-in local OTLP collector for inspecting the runner's #649
    # GenAI trace spans end-to-end (#679). Gated behind the `otel`
    # profile so it does NOT start under the default `docker compose
    # up -d` — the default loop and scripts/dev's pg/rustfs-only
    # preflight are unaffected. Start it explicitly with:
    #   docker compose --profile otel up -d
    # then point the runner at it via OTEL_EXPORTER_OTLP_ENDPOINT and
    # view the per-run trace tree at http://localhost:16686.
    #
    # Pinned to an immutable tag per CLAUDE.md's image-pinning rule; a
    # floating tag could change ports/behaviour under us. OTLP is on by
    # default since v1.35, but COLLECTOR_OTLP_ENABLED is set defensively
    # so older tags still accept it.
    image: jaegertracing/all-in-one:1.62.0
    container_name: fishhawk-jaeger
    restart: unless-stopped
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver (the runner's otlptracehttp target)
      - "4317:4317"    # OTLP gRPC receiver
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fishhawk-postgres-data:
  fishhawk-rustfs-data:
